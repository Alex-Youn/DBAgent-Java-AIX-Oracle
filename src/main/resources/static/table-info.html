<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 정보</title>
    <link rel="stylesheet" href="style.css?v=14">
    <script src="lib/lucide.js"></script>
    <script>
        // Match the main app's saved theme choice so this popup doesn't clash when kept open
        // side-by-side with the dashboard on a second monitor (session-detail.html과 동일 패턴).
        (function () {
            const saved = localStorage.getItem('dbagent_theme') || 'dark';
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
        body { margin: 0; padding: 20px; background: var(--bg-main); color: var(--text-main); }
    </style>
</head>
<body>
    <div id="content">불러오는 중...</div>
    <script>
        (function () {
            function getToken() { return sessionStorage.getItem('dbagent_token') || ''; }
            function qs(name) { return new URLSearchParams(window.location.search).get(name) || ''; }

            const dbId = qs('db_id');
            const tableName = qs('table_name');
            const contentEl = document.getElementById('content');

            if (!getToken()) {
                contentEl.innerHTML = '<h3 style="color: var(--danger);">인증 정보가 없습니다. 메인 화면에서 다시 열어주세요.</h3>';
                return;
            }
            if (!tableName) {
                contentEl.innerHTML = '<h3 style="color: var(--danger);">테이블명이 없습니다.</h3>';
                return;
            }

            document.title = `${tableName} 상세정보`;

            fetch(`/api/table_info?db_id=${encodeURIComponent(dbId)}&table_name=${encodeURIComponent(tableName)}&token=${encodeURIComponent(getToken())}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        contentEl.innerHTML = `<h3 style="color: var(--danger);">조회 오류</h3><p>${data.error}</p>`;
                        return;
                    }
                    document.title = `${data.table_name} 상세정보`;

                    const colsHtml = (data.columns && data.columns.length > 0)
                        ? data.columns.map(c => `
                            <tr>
                                <td style="font-weight: 500; color: var(--primary-color);">${c.column_name}</td>
                                <td>${c.data_type}</td>
                                <td>${c.data_length || '-'}</td>
                                <td>${c.nullable === 'Y' ? '<span style="color:#d03b3b; font-weight:bold;">Y</span>' : 'N'}</td>
                                <td style="color: var(--text-secondary); font-size: 0.9em;">${c.comments || '-'}</td>
                            </tr>
                        `).join('')
                        : '<tr><td colspan="5" style="text-align:center;">컬럼 정보가 없습니다.</td></tr>';

                    const idxsHtml = (data.indexes && data.indexes.length > 0)
                        ? data.indexes.map(i => `
                            <tr>
                                <td>${i.index_name}</td>
                                <td>${i.index_type}</td>
                                <td>${i.column_name}</td>
                                <td>${i.is_pk ? '<span style="background:#0ca30c; color:white; padding: 2px 6px; border-radius:4px; font-size:0.8em; font-weight:bold;">PK</span>' : '-'}</td>
                            </tr>
                        `).join('')
                        : '<tr><td colspan="4" style="text-align:center;">인덱스 정보가 없습니다.</td></tr>';

                    contentEl.innerHTML = `
                        <div style="color: var(--text-main); text-align: left;">
                            <h2 style="margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-size: 1.5rem; color: var(--primary-color);">${data.table_name} 상세정보</h2>
                            <div style="margin-bottom: 20px; font-size: 1.1rem; font-weight: 500; padding: 10px; background-color: rgba(59, 130, 246, 0.1); border-radius: 6px;">
                                ${data.table_comment ? `📝 ${data.table_comment}` : '등록된 테이블 코멘트가 없습니다.'}
                            </div>

                            <h3 style="margin-top: 20px; margin-bottom: 10px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;"><i data-lucide="columns"></i> 컬럼 정보</h3>
                            <div class="table-container" style="max-height: 300px; overflow-y: auto;">
                                <table class="data-table" style="width: 100%;">
                                    <thead>
                                        <tr>
                                            <th>컬럼명</th>
                                            <th>데이터 타입</th>
                                            <th>길이</th>
                                            <th>NULL 허용</th>
                                            <th>코멘트</th>
                                        </tr>
                                    </thead>
                                    <tbody>${colsHtml}</tbody>
                                </table>
                            </div>

                            <h3 style="margin-top: 25px; margin-bottom: 10px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;"><i data-lucide="key"></i> 인덱스 / PK 정보</h3>
                            <div class="table-container" style="max-height: 200px; overflow-y: auto;">
                                <table class="data-table" style="width: 100%;">
                                    <thead>
                                        <tr>
                                            <th>인덱스명</th>
                                            <th>인덱스 타입</th>
                                            <th>컬럼명</th>
                                            <th>PK 여부</th>
                                        </tr>
                                    </thead>
                                    <tbody>${idxsHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    `;

                    if (typeof lucide !== 'undefined') lucide.createIcons();
                })
                .catch(err => {
                    contentEl.innerHTML = `<h3 style="color: var(--danger);">오류 발생</h3><p>${err.message}</p>`;
                });
        })();
    </script>
</body>
</html>
