<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 설정</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="stylesheet" href="style.css?v=76">
    <link rel="stylesheet" href="popup.css?v=3">
    <script>
        // 메인 화면의 테마 선택을 따른다 (다른 팝업과 동일).
        (function () {
            const saved = localStorage.getItem('dbagent_theme') || 'dark';
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <script src="dbagent-common.js?v=13"></script>
    <style>
        /* 환경설정 DB화(2026-10-04): P1-4 조회 → P2 수정·초기화·이력·내보내기. 색은 전역 CSS 변수만 쓴다. */
        .as-layout { display: flex; gap: 12px; flex: 1 1 auto; min-height: 0; }
        .as-nav { flex: 0 0 200px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
        .as-nav button { text-align: left; background: transparent; color: var(--text-secondary); border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; cursor: pointer; font: inherit; font-size: 13.5px; }
        .as-nav button:hover { background: var(--bg-hover); }
        .as-nav button.active { background: var(--bg-hover); color: var(--text-main); border-color: var(--border); }
        .as-nav small { display: block; color: var(--text-secondary); font-size: 11.5px; opacity: .8; }
        .as-nav .dot { color: var(--primary); font-weight: 700; margin-left: 4px; }
        .as-main { flex: 1 1 auto; min-width: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); overflow: auto; display: flex; flex-direction: column; }
        .as-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
        .as-scope { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .as-scope select { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; font: inherit; }
        .as-scope select:disabled { opacity: .5; }
        .as-row { padding: 12px 14px; border-bottom: 1px solid var(--border); }
        .as-row:last-child { border-bottom: 0; }
        .as-row.dirty { background: rgba(79, 156, 255, .08); }
        .as-row.err { background: rgba(255, 107, 107, .08); }
        .as-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .as-label { font-weight: 700; }
        .as-key { color: var(--text-secondary); font: 11.5px Consolas, monospace; opacity: .85; }
        .as-badge { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
        .as-badge.override { color: var(--primary); border-color: var(--primary); }
        .as-badge.saved { color: var(--success, #22c55e); border-color: var(--success, #22c55e); }
        .as-badge.lock { color: #f5b942; border-color: #f5b942; }
        .as-badge.restart { color: #b58cff; border-color: #b58cff; }
        .as-badge.pending { background: #b58cff; color: #12091f; border-color: #b58cff; }
        .as-badge.live { color: var(--success, #22c55e); border-color: var(--success, #22c55e); }
        .as-badge.none { color: var(--text-secondary); border-style: dashed; }
        .as-badge.danger { color: var(--danger); border-color: var(--danger); }
        .as-summary { color: var(--text-secondary); font-size: 12.5px; margin: 3px 0 8px; }
        .as-ctrl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .as-input { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); border-radius: 5px; padding: 4px 10px; font: 600 13.5px Consolas, monospace; min-width: 120px; }
        .as-input.wide { min-width: 360px; }
        .as-input:disabled { opacity: .6; }
        .as-input.bad { border-color: var(--danger); }
        .as-unit { color: var(--text-secondary); font-size: 12.5px; }
        .as-def { color: var(--text-secondary); font-size: 12px; }
        .as-phrase { margin-top: 8px; font-size: 12.5px; color: var(--success, #22c55e); background: rgba(62, 207, 142, .08); border-left: 3px solid var(--success, #22c55e); padding: 5px 9px; border-radius: 0 4px 4px 0; }
        .as-copy { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg-hover); font-size: 12.5px; }
        .as-copy-title { font-weight: 700; margin-bottom: 4px; }
        .as-copy-list { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0; }
        .as-copy-item { white-space: nowrap; cursor: pointer; }
        .as-copy-result { margin-top: 8px; }
        .as-error { margin-top: 6px; font-size: 12.5px; color: var(--danger); }
        .as-detail { display: none; margin-top: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; color: var(--text-secondary); }
        .as-detail.open { display: block; }
        .as-detail p { margin: 0 0 6px; }
        .as-detail .warn { color: var(--danger); border-left: 3px solid var(--danger); background: rgba(255, 107, 107, .08); padding: 5px 9px; margin-top: 6px; }
        .as-banner { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; font-size: 12.5px; border: 1px solid var(--border); }
        .as-banner.warn { border-color: #f5b942; color: #f5b942; background: rgba(245, 185, 66, .08); }
        .as-banner ul { margin: 4px 0 0 18px; padding: 0; }
        .as-note { padding: 10px 14px; font-size: 12.5px; color: var(--text-secondary); background: var(--bg-hover); border-bottom: 1px solid var(--border); }
        .as-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .as-table th, .as-table td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
        .as-table th { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
        .as-table code { font: 12px Consolas, monospace; }
        .as-savebar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg-main); }
        .as-savebar .grow { flex: 1 1 200px; font-size: 12.5px; color: var(--text-secondary); }
        .as-savebar .grow.bad { color: var(--danger); }
        .as-savebar input.reason { flex: 1 1 100%; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); border-radius: 5px; padding: 5px 10px; font: inherit; }
        .as-savebar input.reason.bad { border-color: var(--danger); }
        .as-toast { position: fixed; right: 18px; bottom: 18px; background: var(--success, #22c55e); color: #05150d; padding: 8px 14px; border-radius: 6px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
        .as-toast.show { opacity: 1; }
        .as-toast.bad { background: var(--danger); color: #fff; }
        .pp-btn:disabled { opacity: .45; cursor: not-allowed; }
    </style>
</head>
<body class="pp-body">
    <div id="root" class="pp-root">불러오는 중...</div>
    <div id="toast" class="as-toast"></div>
    <script>
        (function () {
            const root = document.getElementById('root');
            const token = sessionStorage.getItem('dbagent_token');
            // 톱니 메뉴 숨김은 편의일 뿐이다 - 일반 계정이 주소로 직접 열 때를 위해 여기서도 막는다(서버도 막는다).
            if (sessionStorage.getItem('dbagent_role') !== 'admin' || !token) {
                root.innerHTML = '<h3 style="color: var(--danger);">관리자만 접근할 수 있습니다.</h3>';
                return;
            }

            // drafts[범위][키] = 입력 중인 값(문자열). 범위는 '' (전역) 또는 db_id. 저장 전까지 화면 전환·새로고침 없이 유지한다.
            const state = { data: null, group: null, dbId: '', drafts: {}, errors: {}, message: '', reason: '', history: null, resetArm: null, copyOpen: false, copyTargets: {}, copyResult: null };
            const INCIDENT_KEY = 'dbagent.monitor.tm-holder-incident-count';
            const LASTCALL_KEY = 'dbagent.monitor.tm-holder-last-call-et-seconds';
            let rowRefs = {};   // 현재 그려진 항목 행 (키 → {row, input, item})
            let saveBarEl = null;

            function el(tag, cls, text) {
                const e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text !== undefined && text !== null) e.textContent = text;
                return e;
            }
            function toast(msg, bad) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.className = 'as-toast show' + (bad ? ' bad' : '');
                clearTimeout(toast._t);
                toast._t = setTimeout(() => { t.className = 'as-toast' + (bad ? ' bad' : ''); }, 2200);
            }
            function scopeKey() { return state.dbId || ''; }
            function drafts() { return state.drafts[scopeKey()] || (state.drafts[scopeKey()] = {}); }
            function errs() { return state.errors[scopeKey()] || {}; }

            async function api(method, path, body) {
                const opt = { method, headers: {} };
                if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(Object.assign({ token }, body)); }
                const res = await fetch(path, opt);
                const json = await res.json().catch(() => ({}));
                return { ok: res.ok, status: res.status, json };
            }

            async function load() {
                const q = '/api/app_settings?token=' + encodeURIComponent(token) + (state.dbId ? '&db_id=' + encodeURIComponent(state.dbId) : '');
                try {
                    const res = await fetch(q);
                    const body = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(body.error || ('조회 실패 (HTTP ' + res.status + ')'));
                    state.data = body;
                    if (!state.group) state.group = body.groups.length ? body.groups[0].id : 'boot';
                    render();
                } catch (e) {
                    root.replaceChildren(el('h3', 'pp-error', e.message));
                }
            }

            async function loadHistory() {
                const r = await api('GET', '/api/app_settings/history?token=' + encodeURIComponent(token) + '&limit=200');
                state.history = r.ok ? r.json.items : [];
                render();
            }

            // ───────── 표시 보조 ─────────
            function findItem(key) {
                for (const g of state.data.groups) for (const it of g.items) if (it.key === key) return it;
                return null;
            }
            function boolText(v) { return String(v).toLowerCase() === 'true' ? '사용' : '사용 안 함'; }
            function formatDefault(it) {
                if (it.type === 'BOOL') return boolText(it.default);
                if (it.default === '') return '(비어 있음)';
                return it.default + (it.unit ? ' ' + it.unit : '');
            }
            // [기본값 복원] 을 누르면 실제로 돌아가는 값을 보여준다 - 옛 외부 파일에 값이 있으면 코드 기본값과 다르다.
            function fmtValue(it, v) {
                if (it.type === 'BOOL') return boolText(v);
                if (v === '' || v === null || v === undefined) return '(비어 있음)';
                return v + (it.unit ? ' ' + it.unit : '');
            }
            function sameVal(it, a, b) {
                if (it.type === 'INT' || it.type === 'DECIMAL') {
                    const x = Number(a), y = Number(b);
                    if (!isNaN(x) && !isNaN(y)) return x === y;
                }
                if (it.type === 'BOOL') return String(a).toLowerCase() === String(b).toLowerCase();
                return String(a).trim() === String(b).trim();
            }
            function defaultText(it, scoped) {
                const base = '기본값 ' + formatDefault(it);
                if (scoped && it.per_db) return base;
                if (it.restore_value === null || it.restore_value === undefined || sameVal(it, it.restore_value, it.default)) return base;
                return '복원 시 ' + fmtValue(it, it.restore_value) + ' (' + it.restore_source_label + ') · ' + base;
            }
            function isDirty(it) {
                const d = drafts();
                return Object.prototype.hasOwnProperty.call(d, it.key);
            }
            function dirtyKeys() { return Object.keys(drafts()); }
            function dirtyDangerKeys() { return dirtyKeys().filter(k => { const it = findItem(k); return it && it.danger; }); }

            function sourceBadge(it, scoped) {
                if (it.locked) return el('span', 'as-badge lock', it.source_label + ' (고정)');
                if (scoped && it.per_db) {
                    return it.source === 'DB_PER_DB' ? el('span', 'as-badge override', '이 DB 재정의') : el('span', 'as-badge', '전역값 상속');
                }
                if (it.source === 'DB_GLOBAL') return el('span', 'as-badge saved', '변경됨 (DB 저장값)');
                if (it.source === 'CODE_DEFAULT') return el('span', 'as-badge', '기본값 사용 중');
                return el('span', 'as-badge', it.source_label);
            }
            function appliesBadge(it) {
                if (it.applies === 'none') return el('span', 'as-badge none', '연결 전 (저장만 됨)');
                if (it.applies === 'live') return el('span', 'as-badge live', '즉시 적용');
                return it.restart_pending ? el('span', 'as-badge pending', '재시작 대기') : el('span', 'as-badge restart', '재시작 후 적용');
            }

            // ───────── 항목 행 ─────────
            function buildControl(it) {
                const d = drafts();
                const cur = Object.prototype.hasOwnProperty.call(d, it.key) ? d[it.key] : it.value;
                const wrap = el('span', 'as-ctrl');
                let input;
                if (it.type === 'BOOL') {
                    input = el('input');
                    input.type = 'checkbox';
                    input.checked = String(cur).toLowerCase() === 'true';
                    const lab = el('label');
                    lab.append(input, document.createTextNode(' 사용'));
                    wrap.append(lab);
                } else {
                    input = el('input', 'as-input' + (it.type === 'URL' || it.type === 'CSV' || it.type === 'STRING' ? ' wide' : ''));
                    input.type = (it.type === 'INT' || it.type === 'DECIMAL') ? 'number' : 'text';
                    if (it.type === 'DECIMAL') input.step = 'any';
                    input.value = cur === null || cur === undefined ? '' : cur;
                    wrap.append(input);
                    if (it.unit) wrap.append(el('span', 'as-unit', it.unit));
                }
                input.disabled = !it.editable;
                input.dataset.key = it.key;
                input.setAttribute('aria-label', it.label);
                const onChange = () => {
                    const v = it.type === 'BOOL' ? String(input.checked) : input.value.trim();
                    const original = it.type === 'BOOL' ? String(String(it.value).toLowerCase() === 'true') : String(it.value === null ? '' : it.value);
                    if (v === original) delete drafts()[it.key]; else drafts()[it.key] = v;
                    delete errs()[it.key];
                    refreshDirtyUI();
                };
                input.addEventListener('input', onChange);
                input.addEventListener('change', onChange);
                return { wrap, input };
            }

            function renderItem(it, scoped) {
                const row = el('div', 'as-row');
                const head = el('div', 'as-head');
                head.append(el('span', 'as-label', it.label), sourceBadge(it, scoped), appliesBadge(it), el('span', 'as-key', it.key));
                if (it.danger) head.append(el('span', 'as-badge danger', '위험'));
                row.append(head, el('div', 'as-summary', it.summary));

                const ctrl = el('div', 'as-ctrl');
                const c = buildControl(it);
                ctrl.append(c.wrap, el('span', 'as-def', defaultText(it, scoped)));

                const hasRow = scoped && it.per_db ? it.source === 'DB_PER_DB' : it.source === 'DB_GLOBAL';
                const resetLabel = scoped && it.per_db ? '전역값으로 되돌리기' : '기본값 복원';
                const resetBtn = el('button', 'pp-btn', resetLabel);
                resetBtn.disabled = !(hasRow && it.editable);
                resetBtn.addEventListener('click', () => onReset(it, resetBtn, resetLabel));
                const descBtn = el('button', 'pp-btn', '설명');
                ctrl.append(resetBtn, descBtn);
                row.append(ctrl);

                let phrase = null;
                if (it.key === INCIDENT_KEY) {
                    phrase = el('div', 'as-phrase');
                    row.append(phrase);
                }
                const err = el('div', 'as-error');
                err.style.display = 'none';
                row.append(err);

                const detail = el('div', 'as-detail');
                detail.append(el('p', '', it.detail || '추가 설명이 없습니다.'));
                detail.append(el('p', 'as-def', '키: ' + it.key + (it.per_db ? ' · DB별 재정의 가능' : ' · 전역 전용')
                    + (it.min !== null && it.max !== null ? ' · 허용 범위 ' + it.min + ' ~ ' + it.max : '')));
                if (it.warning) detail.append(el('div', 'warn', it.warning));
                row.append(detail);
                descBtn.addEventListener('click', () => {
                    detail.classList.toggle('open');
                    descBtn.textContent = detail.classList.contains('open') ? '설명 닫기' : '설명';
                });
                rowRefs[it.key] = { row, input: c.input, item: it, err, phrase };
                return row;
            }

            // 입력 중에는 전체를 다시 그리지 않고(포커스 유지) 행 표시와 저장 줄만 갱신한다.
            function refreshDirtyUI() {
                const e = errs();
                Object.keys(rowRefs).forEach(k => {
                    const r = rowRefs[k];
                    r.row.classList.toggle('dirty', isDirty(r.item));
                    const msg = e[k];
                    r.row.classList.toggle('err', !!msg);
                    r.err.style.display = msg ? 'block' : 'none';
                    r.err.textContent = msg || '';
                    if (r.input.type !== 'checkbox') r.input.classList.toggle('bad', !!msg);
                });
                updatePhrase();
                updateSaveBar();
                updateNavDots();
            }

            // "현재값 문장 풀이" - 입력 중인 값까지 반영해 장애가 어떤 조건에서 나는지 문장으로 보여준다.
            function effectiveValue(key) {
                const d = drafts();
                if (Object.prototype.hasOwnProperty.call(d, key)) return d[key];
                const it = findItem(key);
                return it ? it.value : '';
            }
            function updatePhrase() {
                const r = rowRefs[INCIDENT_KEY];
                if (!r || !r.phrase) return;
                r.phrase.textContent = '현재 설정: 다른 세션을 ' + effectiveValue(LASTCALL_KEY) + '초 넘게 막고 있는 TM Holder 가 ' +
                    effectiveValue(INCIDENT_KEY) + '개 이상이면 장애로 판정하고 "장애 처리" 버튼을 보여줍니다.';
            }

            function updateNavDots() {
                const d = drafts();
                document.querySelectorAll('.as-nav button[data-group]').forEach(b => {
                    const g = state.data.groups.filter(x => x.id === b.dataset.group)[0];
                    const dirty = g && g.items.some(it => Object.prototype.hasOwnProperty.call(d, it.key));
                    const dot = b.querySelector('.dot');
                    if (dirty && !dot) b.insertBefore(el('span', 'dot', '●'), b.querySelector('small'));
                    if (!dirty && dot) dot.remove();
                });
            }

            // ───────── 저장 줄 ─────────
            function updateSaveBar() {
                if (!saveBarEl) return;
                const n = dirtyKeys().length;
                const danger = dirtyDangerKeys();
                saveBarEl.msg.className = 'grow' + (state.message ? ' bad' : '');
                saveBarEl.msg.textContent = state.message || (n ? '변경 ' + n + '건 (저장 전)' : '변경 사항 없음');
                saveBarEl.save.disabled = n === 0;
                saveBarEl.discard.disabled = n === 0;
                saveBarEl.reason.placeholder = danger.length ? '변경 사유 (필수 - 위험 항목이 포함되어 있습니다)' : '변경 사유 (선택)';
            }

            async function onSave() {
                const d = drafts();
                const keys = Object.keys(d);
                if (!keys.length) return;
                const reason = saveBarEl.reason.value.trim();
                if (dirtyDangerKeys().length && reason.length < 2) {
                    saveBarEl.reason.classList.add('bad');
                    saveBarEl.reason.focus();
                    state.message = '위험 항목이 있어 변경 사유를 입력해야 합니다.';
                    updateSaveBar();
                    saveBarEl.msg.className = 'grow bad';
                    return;
                }
                const versions = {};
                keys.forEach(k => { const it = findItem(k); if (it) versions[k] = it.version; });
                saveBarEl.save.disabled = true;
                const r = await api('PUT', '/api/app_settings', { db_id: state.dbId || null, changes: d, versions, reason });
                if (r.ok) {
                    state.drafts[scopeKey()] = {};
                    state.errors[scopeKey()] = {};
                    state.message = '';
                    state.reason = '';
                    toast('저장했습니다 (' + (r.json.changed ? r.json.changed.length : 0) + '건 변경)');
                    await load();
                } else {
                    state.errors[scopeKey()] = r.json.field_errors || {};
                    state.message = (r.json.error || ('저장 실패 (HTTP ' + r.status + ')')) + (r.status === 409 ? ' - 새로고침 버튼으로 최신 값을 불러오세요.' : '');
                    toast(state.message, true);
                    // 오류 항목이 있는 그룹으로 이동해 보여준다
                    const first = Object.keys(state.errors[scopeKey()])[0];
                    if (first) {
                        const g = state.data.groups.filter(x => x.items.some(it => it.key === first))[0];
                        if (g && g.id !== state.group) { state.group = g.id; render(); return; }
                    }
                    refreshDirtyUI();
                }
            }

            function onDiscard() {
                state.drafts[scopeKey()] = {};
                state.errors[scopeKey()] = {};
                state.message = '';
                render();
            }

            // 기본값 복원은 한 번 더 눌러야 실행된다 (확인창 대신 버튼 문구로 확인)
            async function onReset(it, btn, label) {
                if (state.resetArm !== it.key) {
                    state.resetArm = it.key;
                    btn.textContent = '정말 복원? 한 번 더 클릭';
                    setTimeout(() => { if (state.resetArm === it.key) { state.resetArm = null; btn.textContent = label; } }, 3500);
                    return;
                }
                state.resetArm = null;
                const reason = saveBarEl ? saveBarEl.reason.value.trim() : '';
                if (it.danger && reason.length < 2) {
                    state.message = '위험 항목은 아래 변경 사유를 입력한 뒤 복원할 수 있습니다.';
                    updateSaveBar();
                    if (saveBarEl) { saveBarEl.reason.classList.add('bad'); saveBarEl.reason.focus(); saveBarEl.msg.className = 'grow bad'; }
                    btn.textContent = label;
                    return;
                }
                const r = await api('POST', '/api/app_settings/reset', { db_id: state.dbId || null, keys: [it.key], reason });
                if (r.ok) {
                    delete drafts()[it.key];
                    state.message = '';
                    toast(r.json.changed && r.json.changed.length ? '복원했습니다' : '이미 기본값입니다');
                    await load();
                } else {
                    state.message = r.json.error || ('복원 실패 (HTTP ' + r.status + ')');
                    toast(state.message, true);
                    btn.textContent = label;
                    updateSaveBar();
                }
            }

            async function onExport() {
                try {
                    const res = await fetch('/api/app_settings/export?token=' + encodeURIComponent(token));
                    if (!res.ok) throw new Error('내보내기 실패 (HTTP ' + res.status + ')');
                    const blob = await res.blob();
                    const cd = res.headers.get('Content-Disposition') || '';
                    const m = /filename="([^"]+)"/.exec(cd);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = m ? m[1] : 'dbagent-settings.properties';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
                    toast('내보냈습니다 (DB 에 저장된 값만 담깁니다)');
                } catch (e) { toast(e.message, true); }
            }

            // ───────── 화면 조립 ─────────
            function renderBootstrap() {
                const wrap = el('div');
                wrap.append(el('div', 'as-note', 'DB 를 열기 전에 필요한 값이라 이 화면에서 바꿀 수 없습니다. 서버의 conf/dbagent.conf 파일 또는 기동 인자로 변경하세요. (conf 가 없으면 jar 번들 기본값을 씁니다)'));
                const table = el('table', 'as-table');
                const thead = el('thead');
                const hr = el('tr');
                ['키', '현재 값', '출처', '설명'].forEach(h => hr.append(el('th', '', h)));
                thead.append(hr);
                const tbody = el('tbody');
                state.data.bootstrap.forEach(b => {
                    const tr = el('tr');
                    const k = el('td'); k.append(el('code', '', b.key));
                    tr.append(k, el('td', '', b.value === null || b.value === '' ? '(비어 있음)' : b.value),
                        el('td', '', b.source_label), el('td', '', b.description));
                    tbody.append(tr);
                });
                table.append(thead, tbody);
                wrap.append(table);
                return wrap;
            }

            function renderHistory() {
                const wrap = el('div');
                wrap.append(el('div', 'as-note', '환경설정 변경 이력입니다 (최근 200건, 최신순). 이관(MIGRATE)은 최초 기동 때 옛 application.properties 에서 옮긴 값입니다.'));
                if (state.history === null) { wrap.append(el('div', 'as-note', '불러오는 중...')); return wrap; }
                if (!state.history.length) { wrap.append(el('div', 'as-note', '변경 이력이 없습니다.')); return wrap; }
                const table = el('table', 'as-table');
                const thead = el('thead');
                const hr = el('tr');
                ['일시', '사용자', '대상', '항목', '이전 → 이후', '구분', '사유'].forEach(h => hr.append(el('th', '', h)));
                thead.append(hr);
                const tbody = el('tbody');
                const show = v => (v === null || v === undefined || v === '') ? '(없음)' : v;
                state.history.forEach(h => {
                    const tr = el('tr');
                    const k = el('td'); k.append(document.createTextNode(h.label), document.createElement('br'), el('code', '', h.key));
                    tr.append(el('td', '', h.changed_at), el('td', '', h.changed_by || ''), el('td', '', h.db_id ? h.db_id : '전역'), k,
                        el('td', '', show(h.old_value) + ' → ' + show(h.new_value)), el('td', '', h.action), el('td', '', h.reason || ''));
                    tbody.append(tr);
                });
                table.append(thead, tbody);
                wrap.append(table);
                return wrap;
            }

            // 이 DB 에 재정의한(저장된) 항목을 다른 DB 들에 그대로 복사한다 - 대상 DB 의 같은 항목은 덮어쓰고 이력에 남는다.
            function renderCopyPanel(g) {
                const panel = el('div', 'as-copy');
                const mine = g.items.filter(it => it.per_db && it.source === 'DB_PER_DB');
                if (!mine.length) {
                    panel.append(el('div', '', '이 DB 에 재정의한 항목이 없어 복사할 것이 없습니다. 먼저 이 DB 의 값을 바꿔 저장하세요.'));
                    return panel;
                }
                panel.append(el('div', 'as-copy-title', '이 DB 의 재정의 ' + mine.length + '건을 선택한 DB 에 복사합니다: ' + mine.map(it => it.label).join(', ')));
                panel.append(el('div', 'as-def', '대상 DB 의 같은 항목은 덮어씁니다. 위험 항목이 있으면 아래 변경 사유를 먼저 입력하세요.'));
                const list = el('div', 'as-copy-list');
                state.data.dbs.filter(db => db.id !== state.dbId).forEach(db => {
                    const lab = el('label', 'as-copy-item');
                    const cb = el('input');
                    cb.type = 'checkbox';
                    cb.checked = !!state.copyTargets[db.id];
                    cb.addEventListener('change', () => { state.copyTargets[db.id] = cb.checked; });
                    lab.append(cb, document.createTextNode(' ' + db.name + ' (' + db.id + ')'));
                    list.append(lab);
                });
                panel.append(list);
                const go = el('button', 'pp-btn primary', '복사 실행');
                go.addEventListener('click', onCopy);
                panel.append(go);
                if (state.copyResult) {
                    const res = el('div', 'as-copy-result');
                    state.copyResult.forEach(r => res.append(el('div', r.ok ? '' : 'as-error', r.db_id + ' : ' + (r.ok ? '복사함 ' + r.changed + '건 (변화 없음 ' + r.unchanged + '건)' : (r.error || '실패')))));
                    panel.append(res);
                }
                return panel;
            }

            async function onCopy() {
                const targets = Object.keys(state.copyTargets).filter(k => state.copyTargets[k]);
                if (!targets.length) { toast('복사할 대상 DB 를 선택하세요.', true); return; }
                const reason = saveBarEl ? saveBarEl.reason.value.trim() : '';
                const r = await api('POST', '/api/app_settings/copy', { from_db_id: state.dbId, to_db_ids: targets, reason });
                const results = (r.json && r.json.results) ? r.json.results : [];
                if (!results.length) { toast(r.json.error || ('복사 실패 (HTTP ' + r.status + ')'), true); return; }
                state.copyResult = results;
                toast(r.ok ? '복사했습니다 (' + results.length + '개 DB)' : '일부 DB 에 복사하지 못했습니다', !r.ok);
                render();
            }

            function navButton(id, label, sub) {
                const b = el('button', state.group === id ? 'active' : '');
                b.dataset.group = id;
                b.append(document.createTextNode(label));
                if (sub) b.append(el('small', '', sub));
                b.addEventListener('click', () => {
                    state.group = id;
                    // 전역 전용 그룹에서는 DB 범위를 풀어야 한다 - 안 풀면 저장·복원 요청에 db_id 가 실려 서버가 "DB별 재정의를 지원하지 않는 항목"으로 거절한다.
                    const tg = state.data.groups.filter(x => x.id === id)[0];
                    if (tg && !tg.per_db && state.dbId) {
                        state.dbId = ''; state.message = ''; state.copyOpen = false; state.copyResult = null;
                        load();
                        return;
                    }
                    if (id === 'hist') { state.history = null; loadHistory(); } else render();
                });
                return b;
            }

            function render() {
                const d = state.data;
                rowRefs = {};
                saveBarEl = null;
                const frag = document.createDocumentFragment();

                const head = el('div', 'pp-head');
                head.append(el('h3', '', '시스템 설정'),
                    el('span', 'pp-note', '관리자 전용 · 바꾼 값만 DB 에 저장되고, 바꾸지 않은 항목은 기본값으로 동작합니다'));
                const actions = el('div', 'pp-actions');
                const exp = el('button', 'pp-btn', '내보내기');
                exp.title = 'DB 에 저장된 값을 properties 텍스트로 받습니다 (롤백·백업용)';
                exp.addEventListener('click', onExport);
                const reload = el('button', 'pp-btn', '새로고침');
                // 새로고침은 서버의 최신 값과 버전을 다시 받는다. 입력 중이던 값(drafts)은 지우지 않고 오류 표시만 걷는다 -
                // 충돌(409) 뒤 다시 저장하면 최신 버전으로 덮어쓰고, 버리려면 [되돌리기] 를 누른다.
                reload.addEventListener('click', () => { state.message = ''; state.errors = {}; load(); });
                const close = el('button', 'pp-btn', '닫기');
                close.addEventListener('click', () => window.close());
                actions.append(exp, reload, close);
                head.append(actions);
                frag.append(head);

                if (d.ignore_db) {
                    frag.append(el('div', 'as-banner warn', '안전 모드(-Ddbagent.settings.ignore-db=true)로 기동 중입니다. DB 에 저장된 값은 모두 무시되고 파일·번들 값이 쓰이며, 이 화면에서는 저장할 수 없습니다.'));
                }
                if (d.stale_file_values.length) {
                    const b = el('div', 'as-banner warn', '옛 외부 application.properties 의 값이 DB 와 달라, DB 값이 적용 중입니다. 파일을 고쳐도 반영되지 않으니 이 화면에서 바꾸세요.');
                    const ul = el('ul');
                    d.stale_file_values.forEach(s => ul.append(el('li', '', s.label + ' (' + s.key + ') - 파일 ' + s.file_value + ' / DB ' + s.db_value)));
                    b.append(ul);
                    frag.append(b);
                }

                const layout = el('div', 'as-layout');
                const nav = el('div', 'as-nav');
                d.groups.forEach(g => nav.append(navButton(g.id, g.label, g.description)));
                nav.append(navButton('boot', '부트스트랩', '읽기 전용 (conf/dbagent.conf)'));
                nav.append(navButton('hist', '변경 이력', '누가 언제 무엇을'));
                layout.append(nav);

                const main = el('div', 'as-main');
                const body = el('div', 'as-body');
                if (state.group === 'boot') {
                    body.append(renderBootstrap());
                    main.append(body);
                } else if (state.group === 'hist') {
                    body.append(renderHistory());
                    main.append(body);
                } else {
                    const g = d.groups.filter(x => x.id === state.group)[0] || d.groups[0];
                    const scope = el('div', 'as-scope');
                    const lab = el('label', '', '적용 대상');
                    const sel = el('select');
                    sel.disabled = !g.per_db;
                    const o0 = el('option', '', '전역 기본값 (모든 DB)'); o0.value = '';
                    sel.append(o0);
                    d.dbs.forEach(db => { const o = el('option', '', db.name + ' (' + db.id + ')'); o.value = db.id; sel.append(o); });
                    sel.value = g.per_db ? (state.dbId || '') : '';
                    sel.addEventListener('change', () => { state.dbId = sel.value; state.message = ''; state.copyOpen = false; state.copyResult = null; load(); });
                    scope.append(lab, sel, el('span', 'pp-note', g.per_db
                        ? (state.dbId ? '이 DB 에만 적용됩니다. 재정의하지 않은 항목은 전역값을 따릅니다.'
                            : '전역값입니다. "이 DB 재정의" 가 없는 모든 DB 에 적용됩니다.')
                        : '이 그룹은 전역 전용입니다.'));
                    if (g.per_db && state.dbId) {
                        const cb = el('button', 'pp-btn', state.copyOpen ? '복사 닫기' : '다른 DB 에 복사');
                        cb.addEventListener('click', () => { state.copyOpen = !state.copyOpen; state.copyResult = null; render(); });
                        scope.append(cb);
                    }
                    body.append(scope);
                    if (g.per_db && state.dbId && state.copyOpen) body.append(renderCopyPanel(g));
                    const scoped = g.per_db && !!state.dbId;
                    g.items.forEach(it => body.append(renderItem(it, scoped)));
                    main.append(body);

                    const bar = el('div', 'as-savebar');
                    const reason = el('input', 'reason');
                    reason.type = 'text';
                    reason.value = state.reason;
                    reason.addEventListener('input', () => { state.reason = reason.value; reason.classList.remove('bad'); });
                    const msg = el('span', 'grow');
                    const discard = el('button', 'pp-btn', '되돌리기');
                    discard.addEventListener('click', onDiscard);
                    const save = el('button', 'pp-btn primary', '저장');
                    save.addEventListener('click', onSave);
                    if (d.ignore_db) { save.disabled = true; }
                    bar.append(reason, msg, discard, save);
                    main.append(bar);
                    saveBarEl = { msg, discard, save, reason };
                }
                layout.append(main);
                frag.append(layout);
                root.replaceChildren(frag);
                if (saveBarEl) refreshDirtyUI();
            }

            load();
        })();
    </script>
</body>
</html>
