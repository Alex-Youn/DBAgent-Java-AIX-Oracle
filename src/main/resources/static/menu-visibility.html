<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 표시 설정</title>
    <link rel="stylesheet" href="style.css?v=26">
    <script>
        // Match the main app's saved theme choice (same as session-detail.html).
        (function () {
            const saved = localStorage.getItem('dbagent_theme') || 'dark';
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <script src="dbagent-common.js?v=2"></script>
    <style>
        body { margin: 0; padding: 20px; background: var(--bg-main); color: var(--text-main); }
    </style>
</head>
<body>
    <div id="content">불러오는 중...</div>
    <script>
        (function () {
            const contentEl = document.getElementById('content');
            if (!window.opener || window.opener.closed) {
                contentEl.innerHTML = '<h3 style="color: var(--danger);">메인 화면이 닫혀 있어 열 수 없습니다.</h3>';
                return;
            }
            // Gear-dropdown button hiding is only a UI convenience - this page needs its own check
            // in case a non-admin opens the URL directly.
            if (sessionStorage.getItem('dbagent_role') !== 'admin') {
                contentEl.innerHTML = '<h3 style="color: var(--danger);">관리자만 접근할 수 있습니다.</h3>';
                return;
            }

            function getHiddenMenus() {
                try {
                    return JSON.parse(localStorage.getItem('dbagent_hidden_menus') || '[]');
                } catch (e) {
                    return [];
                }
            }

            // 메뉴 목록은 dbagent-common.js 의 상수에서 온다. 예전에는 opener 의 nav 만 읽었는데,
            // 이 팝업은 RDB 대시보드에서도 열리고 그쪽에는 '.top-nav' 가 없어 목록이 통째로 비었다
            // (그 상태로 저장하면 숨김 설정이 전부 풀린다). opener 가 오라클 화면이면 nav 라벨과
            // 상수에 없는 새 메뉴를 병합해 준다 - 자세한 내용은 그 파일 상단 주석 참고.
            function renderMenuCheckboxes(container, hiddenSet) {
                const openerDoc = (window.opener && !window.opener.closed) ? window.opener.document : null;
                window.dbagentRenderCheckboxGrid(
                    container, window.dbagentMenuItems(openerDoc), hiddenSet, 'data-menu-target');
            }

            function collectHidden(container) {
                const hidden = [];
                container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    if (!cb.checked) hidden.push(cb.getAttribute('data-menu-target'));
                });
                return hidden;
            }

            contentEl.innerHTML = `
                <div class="login-card" style="max-width: 1000px; margin: 0;">
                    <h3 style="margin-bottom: 20px;">메뉴 표시 설정</h3>
                    <div id="menu-visibility-list" class="menu-checkbox-grid" style="margin-bottom: 20px;"></div>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="login-btn" id="menu-visibility-save-btn" style="margin-top: 0;">저장</button>
                        <button type="button" class="login-btn" id="menu-visibility-close-btn" style="margin-top: 0; background: #3a3a37;">닫기</button>
                    </div>
                </div>
            `;

            const listEl = document.getElementById('menu-visibility-list');
            renderMenuCheckboxes(listEl, new Set(getHiddenMenus()));
            // 메뉴가 늘어나도 창은 window.open 이 준 고정 크기(560x560) 그대로였다 - 콘텐츠에 맞춘다.
            window.dbagentAutoSizePopup({ minWidth: 420, minHeight: 300 });

            document.getElementById('menu-visibility-close-btn').addEventListener('click', () => window.close());
            document.getElementById('menu-visibility-save-btn').addEventListener('click', () => {
                localStorage.setItem('dbagent_hidden_menus', JSON.stringify(collectHidden(listEl)));
                if (window.opener && !window.opener.closed) window.opener.location.reload();
                window.close();
            });
        })();
    </script>
</body>
</html>
