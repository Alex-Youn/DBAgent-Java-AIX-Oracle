<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBRID Overview</title>
<script src="lib/lucide.js"></script>
<script src="dbagent-common.js?v=10"></script>
<script src="rdb-session-views.js?v=10"></script>
<style>
    :root {
        --bg-page: #111217;
        --bg-panel: #1f2024;
        --border: #2c2d32;
        --text: #d8d9da;
        /* #8e8e8e 는 잔글씨(11~12px)에서 너무 흐려 읽기 힘들었다 - 한 단계 밝혀 대비를 올린다. */
        --text-muted: #a9aaae;
        --teal: #5ac8db;
        --orange: #ff9830;
        --green: #73bf69;
        --blue: #5794f2;
        /* Oracle 바로가기 버튼 전용. 이 페이지의 다른 색은 전부 의미가 배정되어 있어
           (teal=FO/인터랙션, green=정상, orange=경고, #ef4444=오류, blue=데이터 수치) 네비게이션
           버튼을 구분할 색이 남지 않아 새로 추가했다. 보라는 이 대시보드에서 어떤 상태도
           의미하지 않는다. :root[data-theme="light"]에서 재정의하지 않는 이유는 이 값이 두 배색
           배경(#111217 / #0f172a) 모두에서 6.5:1 이상으로 대비가 충분하기 때문. 참고로 --blue는
           쓸 수 없다 - 두 번째 배색에서 --teal과 똑같이 #3b82f6이 되어 FO와 구분이 사라진다. */
        --ora: #a78bfa;
        --font: "Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    }
    /* index.html의 배색 전환(팔레트 아이콘)은 흰 배경 라이트 테마가 아니라 톤이 다른 두 번째 다크
       팔레트(네이비 계열)로 전환된다 - style.css의 :root[data-theme="light"] 값을 그대로 이식해서
       이 페이지의 팔레트 버튼도 동일하게 동작하도록 함(사용자 확인, 2026-09-04: "둘 다 다크모드이긴
       한데 배색이 다르잖아"). */
    :root[data-theme="light"] {
        --bg-page: #0f172a;
        --bg-panel: #1e293b;
        --border: rgba(255, 255, 255, .1);
        --text: #f8fafc;
        --text-muted: #aab6c6;
        --teal: #3b82f6;
        --orange: #f59e0b;
        --green: #10b981;
        --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg-page);
        color: var(--text);
        font-family: var(--font);
        /* 2026-09-06: 12~11.5px 짜리 잔글씨가 많아 읽기 어렵다는 지적을 받아 기준을 한 단계 올렸다.
           여기(body)를 올리면 크기를 따로 안 준 요소가 전부 같이 커진다. */
        font-size: 14px;
        overflow-x: hidden;
    }
    .pmm-app { display: flex; min-height: 100vh; }

    /* ---------- Sidebar: DB group/instance tree ---------- */
    .pmm-sidebar {
        width: 240px;
        flex: 0 0 240px;
        display: flex;
        flex-direction: column;
        padding: 10px 0;
        overflow-y: auto;
        border-right: 1px solid var(--border);
    }
    /* index.html의 .sidebar-header와 같은 구성(사용자 요청, 2026-09-04): 브랜드와 기관 배지를
       한 블록으로 묶고 구분선은 그 블록 "아래"에 둔다. 이전에는 .pmm-brand 자신이
       border-bottom을 갖고 있어서 구분선이 DB InsightFlow와 한국특허정보원 사이를 갈라놓아,
       기관 배지가 별개 영역처럼 보였다. */
    .pmm-sidebar-header {
        display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
        padding: 0 12px 10px; margin-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .pmm-brand {
        display: flex; align-items: center; gap: 8px;
        padding: 0; margin: 0;
        /* index.html .sidebar-header h2(1.35rem)에 zoom:90%가 적용된 실제 크기와 동일한 값.
           그쪽을 바꾸면 이 값도 같이 바꿔야 두 화면의 브랜드 글씨가 같아 보인다. */
        color: var(--text); text-decoration: none; font-weight: 700; font-size: 1.215rem;
    }
    .pmm-brand:hover { color: var(--teal); }
    /* 2026-09-04 사용자 요청: DB InsightFlow 로고 아이콘도 index.html 사이드바 로고처럼 커졌다
       작아지며 색이 순환하는 펄스 애니메이션 적용 (순수 장식용, 상태와 무관).
       주의: lucide.createIcons()는 <i data-lucide>를 <svg>로 통째로 교체하면서 원본 class는 그대로
       옮기지만 태그명(i)은 사라진다 - 아래처럼 반드시 .brand-icon 같은 클래스로 선택해야 렌더 후에도
       스타일이 유지된다("i" 태그 선택자는 렌더 후 아무 것도 매치하지 못해 조용히 무효화됨). */
    @keyframes brand-icon-pulse {
        0%, 100% { color: var(--teal); transform: scale(1); filter: none; }
        50% { color: #22d3ee; transform: scale(1.18); filter: drop-shadow(0 0 6px rgba(34, 211, 238, .65)); }
    }
    .pmm-brand .brand-icon {
        width: 25px; height: 25px; flex: 0 0 auto; display: inline-block;
        animation: brand-icon-pulse 2s ease-in-out infinite;
    }
    /* 상단 패딩/좌우 패딩은 이제 .pmm-sidebar-header가 갖는다. */
    .pmm-org-badge {
        display: flex; align-items: center; gap: 8px;
        padding: 0;
    }
    .pmm-org-badge img { width: 22px; height: 22px; border-radius: 4px; object-fit: contain; background: #fff; padding: 2px; }
    .pmm-org-badge span { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .db-tree { padding: 0 8px; }
    /* 그룹/인스턴스 글씨체·크기·색을 index.html의 db-groups-container(오라클) 사이드바와 동일하게 맞춤.
       index.html의 .app-container에는 zoom:90%가 걸려있어 실제 화면에 보이는 크기는 rem 값의 0.9배
       (1rem->0.9rem, 0.95rem->0.855rem, 16px 아이콘->14.4px) - 그 실제 렌더 크기를 기준으로 맞춤.
       그룹 헤더는 오라클과 동일하게 흰색(var(--text-primary)=#fff)/font-weight 600. */
    .db-tree-group-block { margin-bottom: 2px; }
    .db-tree-group {
        display: flex; align-items: center; justify-content: space-between; cursor: pointer;
        color: #fff; font-size: .9rem; font-weight: 600; padding: 10px 8px 4px;
    }
    .db-tree-chevron { width: 16.2px; height: 16.2px; color: var(--text-muted); transition: transform .3s ease; flex: 0 0 auto; }
    .db-tree-chevron.rotated { transform: rotate(90deg); }
    /* 오라클의 instancesDiv(paddingLeft:10px + borderLeft:2px + marginTop:5px)와 동일한 들여쓰기. */
    .db-tree-instances { padding-left: 10px; border-left: 2px solid var(--border); margin: 5px 0 6px 8px; }
    .db-tree-instances.collapsed { display: none; }
    .db-tree-item {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 8px; border-radius: 4px; cursor: pointer;
        color: var(--text); font-weight: bold; font-size: .855rem;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .db-tree-item:hover { background: #24252b; }
    .db-tree-item.active { background: #33343b; color: var(--teal); cursor: default; }
    .db-tree-item .item-icon-static, .db-tree-item .item-icon-live {
        width: 14.4px; height: 14.4px; flex: 0 0 auto; color: var(--text-muted);
    }
    /* 클릭해서 보고 있는(active) 인스턴스는 index.html의 active-monitoring과 동일하게 database
       아이콘 대신 activity 아이콘으로 바뀌며 펄스 애니메이션 재생. */
    .db-tree-item .item-icon-live { display: none; }
    .db-tree-item.active .item-icon-static { display: none; }
    .db-tree-item.active .item-icon-live {
        display: inline-block;
        animation: item-live-pulse 1.6s ease-in-out infinite;
    }
    @keyframes item-live-pulse {
        0%, 100% { color: var(--green); transform: scale(1); filter: none; }
        50% { color: #4ade80; transform: scale(1.22); filter: drop-shadow(0 0 5px rgba(74, 222, 128, .7)); }
    }
    .db-tree-error { color: #ef4444; font-size: 13px; padding: 8px; }

    /* ---------- Main column ---------- */
    .pmm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* ---------- Header ---------- */
    .pmm-header {
        height: 54px;
        flex: 0 0 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
    }
    /* 타이틀 전체가 인스턴스 전환 드롭다운의 트리거다. chevron은 원래 장식이었는데(핸들러 없음)
       사용자 요청으로 실제 동작을 붙였다. 드롭다운 자체는 이 페이지의 .gear-dropdown 패턴을
       그대로 따르되 오른쪽이 아닌 왼쪽 기준으로 붙는다. */
    .pmm-title {
        display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600;
        position: relative; cursor: pointer; user-select: none;
    }
    .pmm-title .caret { color: var(--text-muted); width: 16px; height: 16px; transition: transform .15s ease; }
    .pmm-title.open .caret { transform: rotate(180deg); color: var(--text); }
    .title-dropdown {
        display: none; position: absolute; left: 0; top: 30px; background: var(--bg-panel);
        border: 1px solid var(--border); border-radius: 6px; min-width: 260px; z-index: 60;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
        font-size: 12.5px; font-weight: 400; max-height: 60vh; overflow-y: auto;
    }
    .title-dropdown.open { display: block; }
    .title-dropdown .td-group {
        padding: 7px 12px 3px; color: var(--text-muted); font-size: 11px; font-weight: 600;
        border-top: 1px solid var(--border);
    }
    .title-dropdown .td-group:first-child { border-top: none; }
    .title-dropdown .td-item {
        display: flex; align-items: center; gap: 10px; padding: 7px 12px;
        color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .title-dropdown .td-item:hover { background: #24252b; }
    .title-dropdown .td-item.active { color: var(--teal); cursor: default; }
    .title-dropdown .td-item.active:hover { background: none; }
    .title-dropdown .td-host { color: var(--text-muted); margin-left: auto; font-size: 12.5px; }
    /* ---------- Header actions: ported from index.html's .header-actions (사용자 요청, 2026-09-04) -
       기존 장식용 아이콘(bar-chart-2/star/share-2/save/...)을 전부 제거하고 오라클 대시보드 우측 상단의
       실제 기능(FO 이동/자동토글/비밀번호변경/로그아웃/배색전환/관리자 설정)을 그대로 이식. 이 페이지는
       sessionStorage(dbagent_token/role/...)와 localStorage(dbagent_theme)를 index.html과 공유하는
       같은 origin이라 로그인 상태를 그대로 재사용할 수 있다. ---------- */
    .pmm-header-icons { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
        background: transparent; border: none; color: var(--text-muted); cursor: pointer;
        width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
        border-radius: 4px; transition: color .2s, background .2s;
    }
    .icon-btn:hover { background: #24252b; color: var(--text); }
    .icon-btn i { width: 16px; height: 16px; }
    .fo-btn {
        font-family: inherit; font-weight: 800; font-size: 12px; letter-spacing: .02em;
        padding: 0 10px; height: 30px; box-sizing: border-box; border: 1px solid var(--teal);
        border-radius: 8px; background: var(--teal); color: #0b1e21; text-decoration: none;
        display: inline-flex; align-items: center;
    }
    .fo-btn:hover { background: #7ad5e5; border-color: #7ad5e5; }
    /* Oracle 화면(index.html) 바로가기. 로고 이미지(Oracle_icon.jpg / oracle_icon.png)는 둘 다
       알파 채널이 없어 어두운 헤더에 흰 배경이 사각형으로 드러나서 포기하고, FO 버튼과 같은
       텍스트 필로 통일했다. FO가 솔리드(주 동선)이므로 이쪽은 아웃라인으로 한 단계 낮춘 위계.
       Oracle 브랜드 빨강은 쓰지 않는다 - 이 페이지에서 빨강(#ef4444)은 .live-error, 즉 오류
       상태색이라 "지금 장애 중"으로 오해될 수 있다. */
    .ora-btn {
        font-family: inherit; font-weight: 800; font-size: 9px; letter-spacing: .06em;
        padding: 0 8px; height: 30px; box-sizing: border-box; border: 1px solid var(--ora);
        border-radius: 8px; background: transparent; color: var(--ora); text-decoration: none;
        display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto;
    }
    /* lucide SVG는 stroke="currentColor"라 아이콘 색도 위 color를 그대로 따라간다. */
    .ora-btn:hover { background: rgba(167, 139, 250, .14); }
    .ora-btn i { width: 13px; height: 13px; flex: 0 0 auto; }
    /* ORACLE을 ORA / CLE 두 줄로 쌓아 30px 높이 안에 전체 단어를 담는다. 두 줄이 들어가야 하므로
       line-height를 1로 조이고 폰트를 9px로 줄였다 - 이보다 키우면 버튼 높이를 넘긴다. */
    .ora-btn .ora-word { line-height: 1; text-align: center; white-space: nowrap; }
    .fo-auto-toggle { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); cursor: pointer; user-select: none; }
    .gear-menu-wrap { position: relative; }
    .gear-dropdown {
        display: none; position: absolute; right: 0; top: 36px; background: var(--bg-panel);
        border: 1px solid var(--border); border-radius: 6px; min-width: 150px; z-index: 50;
        overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    }
    .gear-dropdown.open { display: block; }
    .gear-dropdown-item {
        display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px;
        background: none; border: none; color: var(--text); font-size: 12.5px; cursor: pointer; text-align: left;
    }
    .gear-dropdown-item:hover { background: #24252b; }
    .gear-dropdown-item i { width: 14px; height: 14px; color: var(--text-muted); }
    .pmm-modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .6);
        align-items: center; justify-content: center; z-index: 100;
    }
    .pmm-modal-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; width: 320px; }
    .pmm-modal-card h3 { margin: 0 0 16px; color: var(--text); font-size: 15px; }
    .pmm-form-group { margin-bottom: 12px; }
    .pmm-form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .pmm-form-group input {
        width: 100%; padding: 7px 9px; background: #17181c; border: 1px solid var(--border);
        border-radius: 4px; color: var(--text); font-size: 13px; box-sizing: border-box;
    }
    .pmm-modal-btn {
        flex: 1; padding: 8px; border-radius: 4px; border: 1px solid var(--border);
        background: #17181c; color: var(--text); cursor: pointer; font-size: 13px;
    }
    .pmm-modal-btn.primary { background: var(--teal); border-color: var(--teal); color: #0b1e21; font-weight: 600; }
    .pmm-modal-error { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 14px; display: none; }

    /* ---------- Filter bar ---------- */
    .pmm-filterbar {
        height: 34px; flex: 0 0 34px;
        display: flex; align-items: center; gap: 22px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
    }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-label { color: var(--teal); font-weight: 600; }
    .filter-label.white { color: var(--text); }
    .filter-select {
        font-family: inherit; font-size: inherit; color: var(--text);
        background: transparent; border: 1px solid var(--border); border-radius: 4px;
        padding: 2px 4px; cursor: pointer; max-width: 280px;
    }
    .filter-select:hover { border-color: var(--teal); }
    .filter-select:focus { outline: none; border-color: var(--teal); }
    .filter-select option { background: var(--bg-panel); color: var(--text); }
    .filter-num {
        font-family: inherit; font-size: inherit; color: var(--text);
        background: transparent; border: 1px solid var(--border); border-radius: 4px;
        padding: 2px 4px; width: 62px;
    }
    .filter-num:hover { border-color: var(--teal); }
    .filter-num:focus { outline: none; border-color: var(--teal); }
    .filter-unit { color: var(--text-muted); }
    .filter-num[hidden], .filter-unit[hidden] { display: none; }
    .live-badge {
        font-size: 10px; font-weight: 700; letter-spacing: .03em;
        color: #0b3d2e; background: var(--green); border-radius: 999px;
        padding: 1px 7px; margin-left: 2px;
    }
    .live-count { font-size: 28px; font-weight: 700; color: var(--blue); line-height: 1; }
    .live-count-label { color: var(--text-muted); font-size: 12.5px; margin-top: 4px; }
    .live-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .live-table th, .live-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .live-table th { color: var(--text-muted); font-weight: 600; }
    /* 행이 여러 줄일 때 눈이 줄을 놓치지 않도록 옅은 줄무늬를 준다. */
    .live-table tbody tr:nth-child(even) { background: rgba(255, 255, 255, .028); }
    .live-summary { display: flex; gap: 20px; margin-bottom: 10px; font-size: 13px; }
    .live-summary strong { color: var(--text); }
    .live-error { color: #ef4444; font-size: 13px; }

    /* ---------- Content ---------- */
    .pmm-content { padding: 14px 16px 40px; }

    /* ---------- KPI collapsible row ---------- */
    .kpi-toggle-row {
        display: flex; align-items: center; gap: 8px; cursor: pointer;
        color: var(--text-muted); margin-bottom: 8px; user-select: none;
    }
    .kpi-toggle-row i { width: 16px; height: 16px; transition: transform .15s ease; }
    .kpi-toggle-row.collapsed i { transform: rotate(-90deg); }

    .kpi-row {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px;
        overflow: hidden;
    }
    .kpi-row.collapsed { display: none; }
    .kpi-card {
        position: relative;
        background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px;
        padding: 10px 12px 12px; min-height: 100px; overflow: hidden;
    }
    .kpi-card .info-icon { position: absolute; top: 8px; left: 8px; width: 13px; height: 13px; color: var(--text-muted); opacity: .6; }
    .kpi-card .kpi-title { margin-left: 20px; color: var(--text-muted); font-size: 13.5px; }
    .kpi-card .kpi-value { margin-top: 22px; font-size: 26px; font-weight: 700; line-height: 1; }
    .kpi-card .kpi-value.green { color: var(--green); }
    .kpi-card .kpi-value.orange { color: var(--orange); }
    .kpi-card .kpi-value.white { color: var(--text); }
    .kpi-card .kpi-sparkline { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; }
    .kpi-card .kpi-gauge-track {
        position: absolute; left: 12px; right: 12px; bottom: 14px; height: 8px;
        background: #33343b; border-radius: 3px; overflow: hidden;
    }
    .kpi-card .kpi-gauge-fill { height: 100%; background: var(--orange); width: 90%; }
    /* KPI 카드 아래 한 줄 보조 설명(원시값 등). 게이지가 있는 카드는 게이지에 자리를 내주려고
       더 아래에서 시작한다. */
    .kpi-card .kpi-sub { position: absolute; left: 12px; right: 12px; bottom: 2px; font-size: 11px; color: var(--text-muted); }
    .kpi-card .kpi-gauge-track ~ .kpi-sub { bottom: 0; }

    /* CUBRID 는 다른 엔진이 주는 정보 일부(SQL 원문 등)를 구조적으로 제공하지 않는다.
       화면에 값이 비는 이유를 밝히지 않으면 조회 실패로 오해하므로 상단에 상시 노출한다. */
    .engine-note {
        margin: 0 0 16px; padding: 10px 12px; border-radius: 6px;
        background: rgba(122, 162, 247, .08); border: 1px solid rgba(122, 162, 247, .25);
        color: var(--text-muted); font-size: 12px; line-height: 1.7;
    }
    .engine-note b { color: var(--text); font-weight: 600; }

    /* ---------- Accordion metric-group rows ---------- */
    .metric-row {
        background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px;
        margin-bottom: 6px;
    }
    .metric-row > summary {
        list-style: none; cursor: pointer; user-select: none;
        display: flex; align-items: center; gap: 8px;
        padding: 9px 12px; font-weight: 600;
    }
    .metric-row > summary::-webkit-details-marker { display: none; }
    .metric-row > summary .chevron { width: 16px; height: 16px; color: var(--text-muted); transition: transform .15s ease; flex: 0 0 auto; }
    .metric-row[open] > summary .chevron { transform: rotate(90deg); }
    .metric-row > summary .row-title { flex: 0 0 auto; }
    .metric-row > summary .panel-count { color: var(--text-muted); font-style: italic; font-weight: 400; font-size: 12.5px; }
    .metric-row > summary .grip { margin-left: auto; color: var(--text-muted); width: 16px; height: 16px; flex: 0 0 auto; }
    .metric-row .row-body {
        /* 2026-09-06: 글자를 키우면서 280px 칸에서는 범례 표(min/max/avg/current)가 잘렸다.
           한 줄에 들어가는 패널 수를 줄여 칸을 넓힌다. */
        display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 8px;
        padding: 0 12px 12px;
    }
    .metric-panel {
        background: #17181c; border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px;
    }
    /* 패널 제목은 그 패널이 무엇인지 알려주는 유일한 단서라 특히 작으면 안 된다. */
    .metric-panel .panel-title { color: var(--text-muted); font-size: 13px; margin-bottom: 5px; }
    .metric-panel svg { display: block; width: 100%; height: 60px; }

    /* ---------- Overview/Detail view tabs ---------- */
    .view-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    /* Detail 탭 제거 후 탭이 하나만 남아 전환 대상이 없다(사용자 요청, 2026-09-04). 그래서
       cursor를 pointer가 아닌 default로 두어 "누를 수 있는 것"처럼 보이지 않게 했다.
       사실상 섹션 제목 역할이라 hover 색 변화도 없앴다.

       font-size 16px은 오라클 화면(index.html)의 사이드바 DASHBOARD 항목과 맞춘 값이다.
       그쪽 .nav-item에는 font-size 선언이 아예 없고 body/.sidebar/.sidebar-nav/html 어디에도
       지정이 없어 브라우저 기본값 16px로 렌더링된다 - 그래서 rem이 아니라 16px로 고정한다.
       활성 색은 오라클 쪽 .nav-item.active의 var(--primary)(#3987e5)에 대응하는 이 팔레트의
       파랑 var(--blue)를 쓴다. 밑줄도 같은 색으로 맞췄다 - 글자만 파랑이고 밑줄이 teal이면
       한 요소에 강조색이 둘이라 실수처럼 보인다. */
    .view-tab {
        background: none; border: none; color: var(--text-muted); font-size: 16px; font-weight: 600;
        padding: 8px 16px; cursor: default; border-bottom: 2px solid transparent; font-family: inherit;
        display: inline-flex; align-items: center; gap: 8px;
    }
    .view-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .view-tab i { width: 18px; height: 18px; }

    /* ---------- Detail view (real-data time-series+legend panels) ---------- */
    .detail-row-title { font-weight: 600; font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 12px; }

    /* ---------- CUBRID DASHBOARD 패널 (시계열 차트 대신 현재 상태 표/목록) ---------- */
    /* 2026-09-06: 패널 안 지표 목록이 작아 읽기 어렵다는 지적으로 한 단계 더 키웠다.
       상단 해설(.engine-note)은 본문보다 작은 보조 문구라 일부러 그대로 둔다. */
    .detail-slot {
        background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
        padding: 13px 15px; min-height: 60px; font-size: 13.5px; color: var(--text-muted);
    }
    .metric-list { display: flex; flex-direction: column; gap: 2px; }
    .metric-list-row {
        display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
        padding: 5px 0; border-bottom: 1px dashed var(--border);
    }
    .metric-list-row:last-child { border-bottom: none; }
    .metric-list-key { color: var(--text-muted); }
    .metric-list-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

    /* 볼륨 경로처럼 긴 값이 들어가므로 표는 가로로만 스크롤시킨다(페이지 본문이 밀리지 않게). */
    .cub-table-wrap { overflow-x: auto; }
    .cub-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .cub-table th, .cub-table td {
        padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .cub-table th { color: var(--text-muted); font-weight: 600; }
    .cub-table td { color: var(--text); font-variant-numeric: tabular-nums; }
    .cub-table tbody tr:nth-child(even) { background: rgba(255, 255, 255, .028); }
    .cub-table tbody tr:last-child td { border-bottom: none; }
    /* 사용률 막대 - 용량 조회 탭과 같은 임계값(75% 주황 / 90% 빨강)을 쓴다. */
    .cub-bar-track { margin-top: 3px; height: 5px; background: #33343b; border-radius: 3px; overflow: hidden; min-width: 60px; }
    .cub-bar-fill { height: 100%; background: var(--green); }
    .cub-bar-fill.warn { background: var(--orange); }
    .cub-bar-fill.danger { background: var(--red, #e5534b); }
    .ts-panel {
        background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; padding: 8px calc(10px + 0.5cm) 4px;
    }
    .ts-panel .panel-title { color: var(--text-muted); font-size: 11.5px; text-align: center; margin-bottom: 2px; }
    .ts-panel .y-label { fill: var(--text-muted); font-size: 10px; }
    .ts-panel .live-table { font-size: 13px; }
</style>
</head>

            <div class="view-tabs">

                <button type="button" class="view-tab" id="tabSessionsBtn" data-view="sessions"><i data-lucide="list"></i>세션 리스트</button>

<script>
// index.html과 동일한 저장된 배색 선택을 적용 (같은 origin의 localStorage 공유) - 페인트 전에
// 최대한 일찍 적용해서 다크->네이비 전환이 눈에 띄게 깜빡이지 않도록 함.
(function () {
    if (localStorage.getItem('dbagent_theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();
(function () {
    // Instance name comes from the Fleet Overview / sidebar link that navigated here
    // (?db_id=...&db_type=...&name=...) - falls back to the generic title if opened directly.
    const qs = new URLSearchParams(window.location.search);
    const instanceName = qs.get('name');
    const dbId = qs.get('db_id');
    function getToken() { return sessionStorage.getItem('dbagent_token') || ''; }
    if (instanceName) {
        document.title = `${instanceName} - CUBRID Overview`;
        document.getElementById('pmmTitle').textContent = instanceName;
    }

    // Left sidebar DB tree (databases.json's own group/instance structure, via /api/config) - lets the
    // user jump to any registered RDB instance from any RDB dashboard page, not just same-engine ones
    // like the old top-right engine nav did. Oracle instances are intentionally excluded (사용자 요청,
    // 2026-09-04) - Oracle lives entirely in index.html's own tab-based UI, not this PMM-style shell, so
    // there's nowhere on this page for an Oracle click to sensibly land. A group with no non-Oracle
    // instances left after filtering is dropped from the tree entirely rather than showing an empty header.
    function dbTreeTargetPage(dbType) {
        if (dbType === 'mysql' || dbType === 'mariadb') return 'mysql-overview-dashboard.html';
        if (dbType === 'postgres') return 'postgres-overview-dashboard.html';
        if (dbType === 'mssql') return 'mssql-overview-dashboard.html';
        if (dbType === 'cubrid') return 'cubrid-overview-dashboard.html';
        return 'rdb-dashboard.html';
    }
    (function buildDbTree() {
        const mount = document.getElementById('dbTree');
        fetch('/api/config').then(res => res.json()).then(cfg => {
            const groups = cfg.groups || [];

            // ORA/CLE 버튼은 오라클·RDB 양쪽 모두에 접근 권한이 있는 계정에게만 보인다
            // (사용자 지시, 2026-09-05). 마크업에서는 display:none 으로 숨겨둔 채 시작해
            // 판정된 뒤에만 드러난다 - 판정에 실패하면 감춰진 쪽이 안전하다(fail-closed).
            // 이미 받아둔 cfg 를 그대로 쓴다 - 추가 요청 없음.
            const oraBtn = document.getElementById('pmmOracleBtn');
            if (oraBtn && window.dbagentCrossNavAccess) {
                const acc = window.dbagentCrossNavAccess(window.dbagentInstancesFromConfig(cfg));
                // 오라클 DB가 <b>아예 등록되어 있지 않으면</b> 버튼을 보여주고 눌렀을 때 그 사실을
                // 알린다(2026-09-06 사용자 요청). 권한 때문에 0건인 경우는 기존대로 감춘 채 둔다 -
                // 그때 "등록된 오라클DB가 없습니다" 라고 하면 사실과 다른 안내가 된다.
                if (acc.emptyOracle) {
                    oraBtn.removeAttribute('href');   // 이동시키지 않고 안내만 한다
                    oraBtn.style.cursor = 'pointer';
                    oraBtn.title = '등록된 오라클DB가 없습니다';
                    oraBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('등록된 오라클DB가 없습니다.');
                    });
                    oraBtn.style.display = '';
                } else if (acc.allowed) {
                    oraBtn.style.display = '';
                }
            }
            mount.innerHTML = '';
            let rendered = 0;
            groups.forEach(g => {
                const instances = (g.instances || []).filter(inst => inst.db_type && inst.db_type !== 'oracle');
                if (!instances.length) return;
                rendered++;
                const hasActive = instances.some(inst => inst.id === dbId);

                const block = document.createElement('div');
                block.className = 'db-tree-group-block';

                const header = document.createElement('div');
                header.className = 'db-tree-group';
                header.innerHTML = `<span>${g.group_name}</span><i data-lucide="chevron-right" class="db-tree-chevron${hasActive ? ' rotated' : ''}"></i>`;

                const body = document.createElement('div');
                body.className = 'db-tree-instances' + (hasActive ? '' : ' collapsed');
                body.innerHTML = instances.map(inst => {
                    const active = inst.id === dbId;
                    const page = dbTreeTargetPage(inst.db_type);
                    const href = `${page}?db_id=${encodeURIComponent(inst.id)}&db_type=${encodeURIComponent(inst.db_type)}&name=${encodeURIComponent(inst.name || inst.id)}`;
                    return `<div class="db-tree-item${active ? ' active' : ''}" data-href="${href}" title="${inst.name || inst.id}">` +
                        `<i data-lucide="database" class="item-icon-static"></i>` +
                        `<i data-lucide="activity" class="item-icon-live"></i>` +
                        `<span>${inst.name || inst.id}</span></div>`;
                }).join('');

                // index.html의 그룹 아코디언(클릭 시 화살표 회전 + 펼침/접힘)과 동일한 동작.
                header.addEventListener('click', () => {
                    const collapsed = body.classList.toggle('collapsed');
                    header.querySelector('.db-tree-chevron').classList.toggle('rotated', !collapsed);
                });

                block.appendChild(header);
                block.appendChild(body);
                mount.appendChild(block);
            });
            if (!rendered) {
                mount.innerHTML = '<div class="db-tree-error">등록된 DB가 없습니다.</div>';
            }
            mount.querySelectorAll('.db-tree-item:not(.active)').forEach(el => {
                el.addEventListener('click', (e) => { e.stopPropagation(); window.location.href = el.getAttribute('data-href'); });
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }).catch(() => {
            mount.innerHTML = '<div class="db-tree-error">DB 목록을 불러오지 못했습니다.</div>';
        });
    })();

    // =====================================================================================
    // CUBRID DASHBOARD 탭 본문.
    //
    // 다른 세 대시보드는 서버의 누적 통계 카운터(QPS, 버퍼 적중률 등)로 시계열 패널을 그리지만,
    // CUBRID 는 그 통계가 기본 구성에서 전부 0 이라 쓸 수 없다(SHOW EXEC STATISTICS / statdump 모두
    // 0 - CubridMonitorService 클래스 주석 참고). 그래서 시계열 차트 대신 **지금 이 순간의 서버
    // 상태**를 표로 보여준다. 없는 값을 그럴듯한 그래프로 채우는 것보다 이쪽이 정직하고, DBA 가
    // 대시보드에서 먼저 확인하는 것도 "지금 몇 세션이 붙어 있고 무엇이 막혀 있나" 이다.
    // =====================================================================================

    const NOTE_HTML =
        '<b>CUBRID는 다른 엔진과 제공 범위가 다릅니다.</b> ' +
        '실행 중인 <b>SQL 원문</b>과 락을 <b>쥐고 있는 세션(holder)</b>은 CUBRID가 JDBC로 제공하지 않습니다' +
        '(DB 서버에서 <code>cubrid killtran -q &lt;db&gt;</code> 로만 확인 가능). ' +
        '그래서 세션 리스트의 SQL 칸은 항상 &quot;-&quot; 이고 — 조회 실패가 아닙니다 — ' +
        '<b>Lock 탭은 트리가 아니라 대기 세션 목록</b>입니다. ' +
        '무엇을 얼마나 기다리는지는 정확히 나오고, 홀더는 미커밋 변경을 가진 세션을 후보로 함께 보여줍니다. ' +
        '가동 시간·QPS·버퍼 적중률도 CUBRID가 SQL로 노출하지 않아 제공하지 않습니다. ' +
        '접속 호스트/프로그램이 <code>broker1_cub_cas_*</code> 로 보이는 것은 정상입니다 — ' +
        '클라이언트가 브로커(CAS)를 거쳐 접속하므로 서버는 CAS 프로세스를 클라이언트로 인식합니다.';
    document.getElementById('engineNote').innerHTML = NOTE_HTML;

    /** 숫자를 천단위 구분해서. null/undefined 는 '-'. */
    function num(v) {
        if (v === null || v === undefined) return '-';
        return typeof v === 'number' ? v.toLocaleString() : String(v);
    }

    /** label:value 목록 패널. 값은 textContent 로만 넣는다(서버가 준 문자열을 그대로 그리지 않는다). */
    function renderKeyValues(el, items) {
        el.innerHTML = '';
        if (!items.length) {
            el.innerHTML = '<span class="live-error">표시할 항목이 없습니다.</span>';
            return;
        }
        const list = document.createElement('div');
        list.className = 'metric-list';
        items.forEach(([label, value]) => {
            const row = document.createElement('div');
            row.className = 'metric-list-row';
            const k = document.createElement('span');
            k.className = 'metric-list-key';
            k.textContent = label;
            const v = document.createElement('span');
            v.className = 'metric-list-val';
            v.textContent = value === null || value === undefined ? '-' : String(value);
            row.appendChild(k);
            row.appendChild(v);
            list.appendChild(row);
        });
        el.appendChild(list);
    }

    /** 표 패널. cells 는 문자열 배열이고 전부 textContent 로 들어간다. */
    function renderTable(el, headers, rows, emptyText) {
        el.innerHTML = '';
        if (!rows.length) {
            el.innerHTML = '<span class="live-error">' + (emptyText || '표시할 항목이 없습니다.') + '</span>';
            return;
        }
        const wrap = document.createElement('div');
        wrap.className = 'cub-table-wrap';
        const table = document.createElement('table');
        table.className = 'cub-table';
        const thead = document.createElement('thead');
        const htr = document.createElement('tr');
        headers.forEach(h => {
            const th = document.createElement('th');
            th.textContent = h;
            htr.appendChild(th);
        });
        thead.appendChild(htr);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        rows.forEach(cells => {
            const tr = document.createElement('tr');
            cells.forEach(c => {
                const td = document.createElement('td');
                if (c && typeof c === 'object' && c.bar !== undefined) {
                    // 사용률 칸: 숫자 + 막대(용량 조회 탭과 같은 임계값 - 75% 주황, 90% 빨강).
                    const pct = Math.min(100, Math.max(0, Number(c.bar) || 0));
                    td.textContent = c.text;
                    const track = document.createElement('div');
                    track.className = 'cub-bar-track';
                    const fill = document.createElement('div');
                    fill.className = 'cub-bar-fill' + (pct >= 90 ? ' danger' : (pct >= 75 ? ' warn' : ''));
                    fill.style.width = pct + '%';
                    track.appendChild(fill);
                    td.appendChild(track);
                } else {
                    td.textContent = c === null || c === undefined ? '-' : String(c);
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        el.appendChild(wrap);
    }

    /** DASHBOARD 탭의 패널 자리를 만든다. */
    function buildDetailSection() {
        const mount = document.getElementById('detailRows');
        const groups = [
            { label: '스레드 / 트랜잭션', keys: ['threads', 'trans'] },
            { label: '볼륨', keys: ['volumes'] },
            { label: '서버 로그 / 최근 접속', keys: ['logHeader', 'access'] }
        ];
        const holders = {};
        groups.forEach(g => {
            const title = document.createElement('div');
            title.className = 'detail-row-title';
            title.innerHTML = `${g.label} <span class="live-badge">LIVE</span>`;
            mount.appendChild(title);
            const grid = document.createElement('div');
            grid.className = 'detail-grid';
            if (g.keys.length === 1) grid.style.gridTemplateColumns = '1fr';
            g.keys.forEach(key => {
                const slot = document.createElement('div');
                slot.className = 'detail-slot';
                slot.innerHTML = dbId ? '불러오는 중...' : '<span class="live-error">db_id 없음</span>';
                grid.appendChild(slot);
                holders[key] = slot;
            });
            mount.appendChild(grid);
        });
        return holders;
    }
    const detailHolders = buildDetailSection();

    function renderDetailPanels(d) {
        if (d.error) {
            Object.values(detailHolders).forEach(el => { el.innerHTML = `<span class="live-error">${d.error}</span>`; });
            return;
        }
        const byType = d.threadsByType || {};
        const byStatus = d.threadsByStatus || {};
        renderKeyValues(detailHolders.threads,
            Object.keys(byType).map(k => ['종류 · ' + k, num(byType[k])])
                .concat(Object.keys(byStatus).map(k => ['상태 · ' + k, num(byStatus[k])])));

        const byState = d.tranByState || {};
        const byIso = d.tranByIsolation || {};
        const tranItems = Object.keys(byState).map(k => ['상태 · ' + k, num(byState[k])])
            .concat(Object.keys(byIso).map(k => ['격리수준 · ' + k, num(byIso[k])]));
        if (!tranItems.length) tranItems.push(['활성 트랜잭션', '0']);
        renderKeyValues(detailHolders.trans, tranItems);

        renderTable(detailHolders.volumes,
            ['볼륨', '용도', '구분', '할당(MB)', '사용(MB)', '여유(MB)', '사용률'],
            (d.volumes || []).map(v => [
                v.name, v.purpose, v.kind, num(v.total_mb), num(v.used_mb), num(v.free_mb),
                v.used_pct === null || v.used_pct === undefined
                    ? '-' : { text: v.used_pct + '%', bar: v.used_pct }
            ]), '볼륨 정보를 읽지 못했습니다.');

        renderKeyValues(detailHolders.logHeader, [
            ['CUBRID 버전', d.release],
            ['DB 페이지 크기', d.dbPageSize ? num(d.dbPageSize) + ' bytes' : '-'],
            ['로그 페이지 크기', d.logPageSize ? num(d.logPageSize) + ' bytes' : '-'],
            ['활성 로그 페이지 수', num(d.numActiveLogPages)],
            ['다음 트랜잭션 ID', num(d.nextTransId)],
            ['마지막 체크포인트 LSA', d.checkpointLsa],
            ['DB 생성 시각', d.dbCreationTime]
        ]);

        renderTable(detailHolders.access,
            ['계정', '마지막 접속', '접속 호스트', '프로그램'],
            (d.accessStatus || []).map(a => [a.user, a.last_access_time, a.last_access_host, a.program]),
            '접속 이력이 없습니다.');
    }

    // 탭 전환(DASHBOARD / 세션 리스트 / Lock 대기 세션 / 용량 조회). 전환도 표도 모달도 전부
    // rdb-session-views.js 가 맡는다 - 네 대시보드가 같은 코드를 네 번 복사하지 않기 위함(그 파일
    // 머리말 참고).
    //
    // locksNote 를 넘기는 이유: 공통 문구는 "Holder 를 위에, Waiter 를 아래에 붙여 트리로 보여준다 /
    // 맨 위 Holder 를 처리하면 아래가 한꺼번에 풀린다" 인데, CUBRID 는 대기자를 막고 있는 holder 를
    // JDBC 로 알 수 없어(CubridMonitorService 주석) 트리도 다단계 체인도 만들 수 없다. 그 문구를
    // 그대로 두면 화면(평평한 대기 목록)과 어긋나고, 서버가 주는 blocker_note("holder 를 알려주지
    // 않습니다")와도 정면으로 모순된다.
    if (window.dbagentInitRdbSessionViews) {
        window.dbagentInitRdbSessionViews({
            dbId: dbId,
            getToken: getToken,
            locksNote: '지금 락을 기다리고 있는 세션을 보여줍니다. ' +
                'CUBRID는 대기자를 막고 있는 세션(Holder)을 JDBC로 알려주지 않아 트리가 아니라 ' +
                '대기자 목록으로 표시하며, 표 위에 홀더 후보를 따로 안내합니다. ' +
                '행을 클릭하면 세션 상세를 볼 수 있습니다.'
        });
    } else {
        // rdb-session-views.js 로드가 빠졌을 때의 안전망 - 최소한 DASHBOARD 는 보여야 한다.
        const detailView = document.getElementById('detailView');
        if (detailView) detailView.style.display = 'block';
    }

    // ---- Real data: KPI row (/api/rdb/cubrid_overview) + DASHBOARD 패널 (/api/rdb/cubrid_status)
    function loadAll() {
        const ids = ['kpiActiveSessions', 'kpiLockWaits', 'kpiWorker', 'kpiVolume'];
        if (!dbId) {
            ids.forEach(id => { document.getElementById(id).innerHTML = '<span class="live-error">db_id 없음</span>'; });
            return;
        }
        Promise.all([
            fetch(`/api/rdb/cubrid_overview?db_id=${encodeURIComponent(dbId)}&token=${encodeURIComponent(getToken())}`).then(res => res.json()),
            fetch(`/api/rdb/cubrid_status?db_id=${encodeURIComponent(dbId)}&token=${encodeURIComponent(getToken())}`).then(res => res.json())
        ]).then(([overview, status]) => {
            if (overview.error) {
                ids.forEach(id => { document.getElementById(id).innerHTML = `<span class="live-error">${overview.error}</span>`; });
                renderDetailPanels({ error: overview.error });
                return;
            }

            document.getElementById('kpiActiveSessions').textContent = num(overview.activeSessions);
            document.getElementById('kpiActiveSessionsSub').textContent =
                '트랜잭션 진행 중 ' + num(overview.openTransactions) + '건';

            // 락 대기는 0 이 정상이다. 0 이 아니면 그 자체로 봐야 할 상황이므로 색을 바꾼다.
            const lockWaits = overview.lockWaitSessions;
            const lockEl = document.getElementById('kpiLockWaits');
            lockEl.textContent = num(lockWaits);
            lockEl.className = 'kpi-value' + (lockWaits > 0 ? ' orange' : ' white');
            document.getElementById('kpiLockWaitsSub').textContent =
                lockWaits > 0 ? '세션 리스트의 대기 이벤트 칸에서 확인' : '대기 중인 세션 없음';

            // 워커 스레드 사용률 = 문서 6.1 "커넥션 풀 고갈율" 의 CUBRID 대응. 100%에 닿으면
            // 새 요청이 대기하기 시작한다.
            const workerPct = overview.workerBusyPct;
            const workerKnown = (workerPct !== null && workerPct !== undefined);
            const workerEl = document.getElementById('kpiWorker');
            workerEl.textContent = workerKnown ? workerPct + '%' : '-';
            workerEl.className = 'kpi-value' + (workerKnown ? (workerPct >= 80 ? ' orange' : ' white') : ' white');
            document.getElementById('kpiWorkerGauge').style.width =
                workerKnown ? Math.min(100, Math.max(0, workerPct)) + '%' : '0%';
            document.getElementById('kpiWorkerSub').textContent =
                num(overview.workerBusy) + ' / ' + num(overview.workerTotal) + ' 사용 중';

            // 값이 없으면 "null%" 대신 "-" 로 (다른 대시보드와 같은 처리, 2026-09-05)
            const volPct = overview.volumeUsedPct;
            const volKnown = (volPct !== null && volPct !== undefined);
            const volEl = document.getElementById('kpiVolume');
            volEl.textContent = volKnown ? volPct + '%' : '-';
            volEl.className = 'kpi-value' + (volKnown ? (volPct >= 90 ? ' orange' : (volPct >= 75 ? ' orange' : ' green')) : '');
            document.getElementById('kpiVolumeGauge').style.width =
                volKnown ? Math.min(100, Math.max(0, volPct)) + '%' : '0%';
            document.getElementById('kpiVolumeSub').textContent = volKnown
                ? num(overview.volumeUsedMb) + ' / ' + num(overview.volumeTotalMb) + ' MB'
                : '볼륨 정보를 읽지 못했습니다.';

            renderDetailPanels(status);
        }).catch(err => {
            ids.forEach(id => { document.getElementById(id).innerHTML = `<span class="live-error">${err.message}</span>`; });
            renderDetailPanels({ error: err.message });
        });
    }
    loadAll();

    // ---- Header actions ported from index.html's .header-actions (사용자 요청, 2026-09-04) - same
    // origin/sessionStorage as index.html, so login state (dbagent_token/role/fleet_overview*) is
    // reused as-is rather than re-implemented. FO 자동 이동 체크박스, 비밀번호 변경, 로그아웃, 배색
    // 전환(:root[data-theme="light"] 팔레트로 즉시 전환 - 실제로는 흰 배경이 아니라 톤이 다른 두
    // 번째 다크 팔레트, 자세한 내용은 위 :root 블록 주석 참고), 관리자 설정 드롭다운(계정
    // 관리/DB 관리/메뉴 표시 설정 - 기존 팝업 창을 그대로 재사용) 전부 동일 로직으로 이식.
    (function wireHeaderActions() {
        if (sessionStorage.getItem('dbagent_role') !== 'admin') {
            document.querySelectorAll('.admin-only').forEach(el => { el.style.display = 'none'; });
        }
        // 메뉴 표시 설정(브라우저별 localStorage)과 계정 권한(관리자가 계정 관리에서 지정)에 따라
        // 탭 버튼을 숨긴다 - index.html의 applyMenuVisibility()에 대응하는 RDB 화면 쪽 처리.
        // 지금은 탭이 DASHBOARD 하나뿐이고 본문은 탭과 무관하게 항상 보이므로 버튼만 사라진다.
        if (window.dbagentApplyRdbMenuVisibility) window.dbagentApplyRdbMenuVisibility();
        const canFleetOverview = sessionStorage.getItem('dbagent_role') === 'admin'
            || sessionStorage.getItem('dbagent_fleet_overview') === 'true';
        const foBtn = document.getElementById('pmmFoBtn');
        const foAutoWrap = document.getElementById('pmmFoAutoWrap');
        const foAutoInput = document.getElementById('pmmFoAutoInput');
        // 좌측 상단 로고도 FO 로 가는 통로다 - 버튼만 숨기면 권한 없는 계정이 로고를 눌러 건너간 뒤
        // "접근 권한이 없습니다" 만 보게 된다(2026-09-06 실측).
        if (window.dbagentGateBrandLink) window.dbagentGateBrandLink('.pmm-brand');
        if (!canFleetOverview) {
            if (foBtn) foBtn.style.display = 'none';
            if (foAutoWrap) foAutoWrap.style.display = 'none';
        } else if (foAutoInput) {
            foAutoInput.checked = sessionStorage.getItem('dbagent_fleet_overview_auto_redirect') === 'true';
            foAutoInput.addEventListener('change', async () => {
                const autoRedirect = foAutoInput.checked;
                sessionStorage.setItem('dbagent_fleet_overview_auto_redirect', autoRedirect ? 'true' : 'false');
                try {
                    await fetch('/api/me/fleet_overview_auto_redirect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: getToken(), auto_redirect: autoRedirect })
                    });
                } catch (e) { console.error('Failed to save Fleet Overview auto-redirect preference', e); }
            });
        }

        document.getElementById('pmmLogoutBtn')?.addEventListener('click', async () => {
            const token = getToken();
            try {
                await fetch('/api/logout', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token })
                });
            } catch (e) { console.error('Logout request failed', e); }
            sessionStorage.removeItem('dbagent_token');
            sessionStorage.removeItem('dbagent_role');
            sessionStorage.removeItem('dbagent_account_hidden_menus');
            sessionStorage.removeItem('dbagent_account_hidden_dbs');
            sessionStorage.removeItem('dbagent_fleet_overview');
            sessionStorage.removeItem('dbagent_fleet_overview_auto_redirect');
            window.location.href = 'index.html';
        });

        document.getElementById('pmmThemeBtn')?.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const next = isLight ? 'dark' : 'light';
            localStorage.setItem('dbagent_theme', next);
            if (next === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        });

        const pwdModal = document.getElementById('pmmPwdModal');
        document.getElementById('pmmChangePwdBtn')?.addEventListener('click', () => { pwdModal.style.display = 'flex'; });
        document.getElementById('pmmPwdCancel')?.addEventListener('click', () => {
            pwdModal.style.display = 'none';
            document.getElementById('pmmPwdForm').reset();
            document.getElementById('pmmPwdError').style.display = 'none';
        });
        document.getElementById('pmmPwdForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const current = document.getElementById('pmmPwdCurrent').value;
            const newPwd = document.getElementById('pmmPwdNew').value;
            const confirmPwd = document.getElementById('pmmPwdConfirm').value;
            const errDiv = document.getElementById('pmmPwdError');
            if (newPwd !== confirmPwd) {
                errDiv.textContent = '새 비밀번호가 일치하지 않습니다.';
                errDiv.style.display = 'block';
                return;
            }
            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: getToken(), current_password: current, new_password: newPwd })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('비밀번호가 성공적으로 변경되었습니다. 다시 로그인해주세요.');
                    sessionStorage.removeItem('dbagent_token');
                    sessionStorage.removeItem('dbagent_role');
                    window.location.href = 'index.html';
                } else {
                    errDiv.textContent = data.message || '변경 실패';
                    errDiv.style.display = 'block';
                }
            } catch (e) {
                errDiv.textContent = '서버 오류';
                errDiv.style.display = 'block';
            }
        });

        const gearTrigger = document.getElementById('pmmGearTrigger');
        const gearDropdown = document.getElementById('pmmGearDropdown');
        gearTrigger?.addEventListener('click', (e) => { e.stopPropagation(); gearDropdown.classList.toggle('open'); });
        document.addEventListener('click', (e) => {
            if (gearDropdown && gearDropdown.classList.contains('open') && !gearDropdown.contains(e.target) && e.target !== gearTrigger) {
                gearDropdown.classList.remove('open');
            }
        });
        function openAdminPopup(url, name, features) {
            gearDropdown.classList.remove('open');
            const popup = window.open(url, name, features);
            if (popup) popup.focus();
        }
        document.getElementById('pmmOpenAccountMgmt')?.addEventListener('click', () => {
            openAdminPopup('account-mgmt.html', 'dbagent_account_mgmt', window.dbagentAdminPopupFeatures('account'));
        });
        document.getElementById('pmmOpenDbMgmt')?.addEventListener('click', () => {
            openAdminPopup('db-mgmt.html', 'dbagent_db_mgmt', 'width=980,height=820,resizable=yes,scrollbars=yes');
        });
        document.getElementById('pmmOpenMenuVisibility')?.addEventListener('click', () => {
            openAdminPopup('menu-visibility.html', 'dbagent_menu_visibility', window.dbagentAdminPopupFeatures('menu'));
        });
    })();

    if (typeof lucide !== 'undefined') lucide.createIcons();
    // ---------------------------------------------------------------------
    // 필터바 Interval / Host
    //
    // 이전에는 세 항목 모두 정적 목업이었고(auto / ecy-s-dbrm-001 / PMM Annotations 체크박스),
    // 이 대시보드에는 자동 새로고침 자체가 없어 페이지 로드 시 1회만 조회했다. PMM Annotations는
    // 연동할 대상(PMM 서버)이 없어 삭제했고, 나머지 둘을 실제로 동작하게 만들었다.
    // ---------------------------------------------------------------------

    /**
     * 페이지별로 적재 함수 구성이 다르다(mssql/postgres/cubrid는 loadAll, mysql은 loadStatusOverview +
     * loadKpiStats). 세 대시보드가 이 블록을 그대로 공유할 수 있도록, 선언되지 않은 식별자에도
     * 안전한 typeof로 존재하는 것만 호출한다.
     */
    function refreshAllPanels() {
        if (typeof loadStorage === 'function') loadStorage();
        if (typeof loadConnections === 'function') loadConnections();
        if (typeof loadAll === 'function') loadAll();
        if (typeof loadStatusOverview === 'function') loadStatusOverview();
        if (typeof loadKpiStats === 'function') loadKpiStats();
        // 세션 리스트/Lock 탭은 지금 보고 있는 탭만 다시 읽는다(rdb-session-views.js).
        if (typeof window.dbagentRefreshRdbSessionViews === 'function') window.dbagentRefreshRdbSessionViews();
    }

    (function wireFilterBar() {
        const INTERVAL_KEY = 'rdb_refresh_interval';
        const CUSTOM_KEY = 'rdb_refresh_custom_sec';
        const intervalSel = document.getElementById('refreshIntervalSelect');
        const customInput = document.getElementById('customIntervalInput');
        const customUnit = document.getElementById('customIntervalUnit');
        const hostSel = document.getElementById('hostSelect');
        let timerId = null;
        // 선택값이 저장되어 있지 않을 때의 기본 주기 = 5초 (사용자 지정, 2026-09-04).
        // /api/config의 polling_interval_ms는 오라클 메인 화면 전용 값이라 여기서는 쓰지 않는다 -
        // 이 대시보드의 주기는 이 상수와 사용자가 고른 값으로만 결정된다.
        // 예전에는 'auto (5s)' 옵션이 따로 있었는데 아래 '5s' 와 값이 같아 고를 이유가 없었다.
        // 그래서 옵션을 없애고, 저장돼 있던 'auto' 는 아래에서 5s 로 옮긴다(2026-09-05).
        const DEFAULT_MS = 5000;
        // 직접 입력 허용 범위(초). 1초 미만은 의미가 없고, 상한이 없으면 오타 하나로 사실상
        // 갱신이 멈춘 것처럼 보이므로 1시간에서 자른다.
        const CUSTOM_MIN_SEC = 1;
        const CUSTOM_MAX_SEC = 3600;

        function customSec() {
            const raw = parseInt(customInput ? customInput.value : "", 10);
            if (isNaN(raw)) return CUSTOM_MIN_SEC;
            return Math.min(CUSTOM_MAX_SEC, Math.max(CUSTOM_MIN_SEC, raw));
        }

        function currentMs() {
            if (!intervalSel) return 0;
            if (intervalSel.value === 'custom') return customSec() * 1000;
            return parseInt(intervalSel.value, 10) || 0;
        }

        /** custom 선택일 때만 숫자 입력칸을 보여준다. */
        function syncCustomVisibility() {
            const on = !!intervalSel && intervalSel.value === 'custom';
            if (customInput) customInput.hidden = !on;
            if (customUnit) customUnit.hidden = !on;
        }

        function applyInterval() {
            if (timerId) { clearInterval(timerId); timerId = null; }
            const ms = currentMs();
            if (ms > 0) {
                // 탭이 백그라운드일 땐 건너뛴다 - 안 보는 화면 때문에 DB를 계속 치지 않기 위함.
                timerId = setInterval(function () { if (!document.hidden) refreshAllPanels(); }, ms);
            }
        }

        if (intervalSel) {
            const savedCustom = parseInt(localStorage.getItem(CUSTOM_KEY), 10);
            if (customInput && !isNaN(savedCustom)) customInput.value = savedCustom;
            let saved = localStorage.getItem(INTERVAL_KEY);
            // 없어진 'auto' 옵션을 고르고 있던 브라우저를 같은 값의 5s 로 옮긴다.
            // 이걸 안 하면 저장값이 옵션 목록에 없어 무시되고, 첫 옵션인 off 가 선택돼
            // 자동 새로고침이 꺼진다.
            if (saved === 'auto') {
                saved = String(DEFAULT_MS);
                localStorage.setItem(INTERVAL_KEY, saved);
            }
            if (saved !== null && Array.prototype.some.call(intervalSel.options, function (o) { return o.value === saved; })) {
                intervalSel.value = saved;
            } else {
                intervalSel.value = String(DEFAULT_MS);
            }
            syncCustomVisibility();
            intervalSel.addEventListener('change', function () {
                localStorage.setItem(INTERVAL_KEY, intervalSel.value);
                syncCustomVisibility();
                if (intervalSel.value === 'custom' && customInput) customInput.focus();
                applyInterval();
                if (currentMs() > 0) refreshAllPanels();   // 주기를 바꾸면 즉시 한 번 갱신
            });
        }

        if (customInput) {
            // 'input'이 아니라 'change'로 받는다 - 타이핑 중간값(예: '1' -> '15')마다 타이머를
            // 재설정하면 1초 주기로 잠깐 폭주한다. 확정(blur/Enter/스피너) 시점에만 반영.
            customInput.addEventListener('change', function () {
                const sec = customSec();
                customInput.value = sec;            // 범위를 벗어난 입력은 잘라서 되돌려 보여줌
                localStorage.setItem(CUSTOM_KEY, String(sec));
                if (intervalSel && intervalSel.value === 'custom') {
                    applyInterval();
                    refreshAllPanels();
                }
            });
        }

        fetch('/api/config').then(function (res) { return res.json(); }).then(function (cfg) {
            applyInterval();

            if (!hostSel) return;
            const rdb = [];
            (cfg.groups || []).forEach(function (g) {
                (g.instances || []).forEach(function (inst) {
                    if (inst.db_type && inst.db_type !== 'oracle') rdb.push(inst);
                });
            });

            // 헤더 타이틀 옆 chevron 드롭다운. Host 셀렉트와 같은 목록을 쓰지만 그룹 헤더까지
            // 보여줘서 좌측 트리와 같은 구조로 읽힌다. /api/config를 다시 받지 않고 이 then의
            // cfg를 그대로 재사용한다.
            const titleWrap = document.getElementById('pmmTitleWrap');
            const titleDd = document.getElementById('pmmTitleDropdown');
            if (titleWrap && titleDd) {
                let ddHtml = '';
                (cfg.groups || []).forEach(function (g) {
                    const list = (g.instances || []).filter(function (i) {
                        return i.db_type && i.db_type !== 'oracle';
                    });
                    if (!list.length) return;
                    ddHtml += '<div class="td-group">' + g.group_name + '</div>';
                    ddHtml += list.map(function (inst) {
                        const page = dbTreeTargetPage(inst.db_type);
                        const href = page + '?db_id=' + encodeURIComponent(inst.id)
                            + '&db_type=' + encodeURIComponent(inst.db_type)
                            + '&name=' + encodeURIComponent(inst.name || inst.id);
                        const active = inst.id === dbId;
                        // 현재 보고 있는 인스턴스는 data-href를 주지 않아 클릭해도 이동하지 않는다.
                        return '<div class="td-item' + (active ? ' active' : '') + '"'
                            + (active ? '' : ' data-href="' + href + '"') + '>'
                            + '<span>' + (inst.name || inst.id) + '</span>'
                            + '<span class="td-host">' + (inst.host || '') + ':' + inst.port + '</span></div>';
                    }).join('');
                });
                titleDd.innerHTML = ddHtml || '<div class="td-group">등록된 RDB DB가 없습니다</div>';

                titleWrap.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const open = titleDd.classList.toggle('open');
                    titleWrap.classList.toggle('open', open);
                });
                // 드롭다운 내부 클릭이 위 토글까지 올라가 바로 닫히지 않도록 막는다.
                titleDd.addEventListener('click', function (e) { e.stopPropagation(); });
                Array.prototype.forEach.call(titleDd.querySelectorAll('.td-item[data-href]'), function (el) {
                    el.addEventListener('click', function (e) {
                        e.stopPropagation();
                        window.location.href = el.getAttribute('data-href');
                    });
                });
                document.addEventListener('click', function () {
                    titleDd.classList.remove('open');
                    titleWrap.classList.remove('open');
                });
            }

            if (!rdb.length) {
                hostSel.innerHTML = '<option>등록된 DB 없음</option>';
                hostSel.disabled = true;
                return;
            }
            hostSel.innerHTML = rdb.map(function (inst) {
                const page = dbTreeTargetPage(inst.db_type);
                const href = page + '?db_id=' + encodeURIComponent(inst.id)
                    + '&db_type=' + encodeURIComponent(inst.db_type)
                    + '&name=' + encodeURIComponent(inst.name || inst.id);
                const host = inst.host || '(host 미지정)';
                const label = host + ':' + inst.port + ' \u00b7 ' + (inst.name || inst.id);
                return '<option value="' + href + '"' + (inst.id === dbId ? ' selected' : '') + '>' + label + '</option>';
            }).join('');
            hostSel.addEventListener('change', function () {
                if (hostSel.value) window.location.href = hostSel.value;
            });
        }).catch(function (err) {
            // 에러를 삼키면 원인 파악이 불가능하다 - 콘솔과 드롭다운 양쪽에 그대로 드러낸다.
            console.error('[filterbar] /api/config 처리 실패:', err);
            applyInterval();
            if (hostSel) {
                var reason = (err && err.message) ? err.message : String(err);
                hostSel.innerHTML = '<option>실패: ' + reason + '</option>';
                hostSel.disabled = true;
            }
        });
    })();

})();
</script>
</body>
</html>
