<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택된 세션 리스트</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="stylesheet" href="style.css?v=78">
    <link rel="stylesheet" href="popup.css?v=3">
    <script>
        // Match the main app's saved theme choice so this popup doesn't clash when kept open
        // side-by-side with the dashboard on a second monitor (same as session-detail.html).
        (function () {
            const saved = localStorage.getItem('dbagent_theme') || 'dark';
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
    </style>
</head>
<body class="pp-body">
    <div id="content" class="pp-root">불러오는 중...</div>
    <script>
        (function () {
            // The opener stashes the drag-selected sessions in localStorage (not sessionStorage - a
            // popup only inherits a one-time COPY of the opener's sessionStorage at the moment
            // window.open() is called, so re-dragging a selection while this window is already open
            // would leave it showing the stale first batch). localStorage is a live, shared area
            // across same-origin windows, and the 'storage' event below lets this page re-render
            // in place whenever the opener stashes a new selection.
            const STORAGE_KEY = 'dbagent_selected_sessions';
            const contentEl = document.getElementById('content');
            // 서버/저장소 문자열을 innerHTML에 넣기 전 이스케이프(2026-10-09 점검 수정, G-3/G-13).
            function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (ch) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]; }); }

            function render(sessions) {
                sessions = sessions || [];
                document.title = `선택된 세션 리스트 (${sessions.length}건)`;

                const cmdMap = { 2: 'INSERT', 3: 'SELECT', 6: 'UPDATE', 7: 'DELETE' };
                contentEl.innerHTML = `
                    <h3 class="pp-title" style="color:var(--text-main); margin-top:0;">선택된 세션 리스트 (${sessions.length}건)</h3>
                    <p style="color:var(--text-secondary); font-size:13px; margin-bottom:15px;">행을 클릭하시면 세션 상세정보(SQL 텍스트, DBMS Plan, 바인드 변수)가 별도 창으로 열립니다.</p>
                    <div style="overflow-x:auto; border:1px solid var(--border); border-radius:4px;">
                        <table class="pp-col-lines" style="width:100%; border-collapse:collapse; color:var(--text-main); white-space: nowrap;">
                            <thead style="background:var(--bg-hover); position:sticky; top:0;">
                                <tr>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">Database Name</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">종료시간</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">SID</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">SERIAL#</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">SQL_ID</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">Command</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">Elapse Time(sec)</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">Program</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">Oracle User Name</th>
                                    <th style="padding:10px; text-align:left; border-bottom:1px solid var(--border);">Host User Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${sessions.map(s => {
                                    // 서버가 이름(INSERT 등) 또는 null을 준다 - null을 "null"로 찍지 않게 비교를 넓힌다(2026-10-01).
                                    const cmdText = s.command != null && s.command !== '' ? (cmdMap[s.command] || s.command) : '-';
                                    return `
                                    <tr class="clickable-session-row" style="cursor:pointer; border-bottom:1px solid var(--border);" data-sid="${esc(s.sid)}" data-serial="${esc(s.serial || '')}" data-sql_id="${esc(s.sql_id || '')}">
                                        <td style="padding:10px;">${esc(s.db_name || '-')}</td>
                                        <td style="padding:10px;">${esc(s.capture_time || '-')}</td>
                                        <td style="padding:10px;">${esc(s.sid)}</td>
                                        <td style="padding:10px;">${esc(s.serial || '-')}</td>
                                        <td style="padding:10px;">${esc(s.sql_id || '-')}</td>
                                        <td style="padding:10px;">${esc(cmdText)}</td>
                                        <td style="padding:10px; color:var(--danger); font-weight:bold;">${esc(s.duration_time)}s</td>
                                        <td style="padding:10px;">${esc(s.program_name || '-')}</td>
                                        <td style="padding:10px;">${esc(s.username || '-')}</td>
                                        <td style="padding:10px;">${esc(s.osuser || '-')}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    const parsed = raw ? JSON.parse(raw) : null;
                    render(parsed ? parsed.sessions : []);
                } catch (e) {
                    contentEl.innerHTML = `<h3 style="color: var(--danger);">오류 발생</h3><p>${esc(e.message)}</p>`;
                }
            }

            loadFromStorage();

            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY) loadFromStorage();
            });

            // Same open-or-focus pattern as the main dashboard's `.clickable-session-row` delegate,
            // duplicated here because this popup is its own document/JS scope (window.opener isn't
            // reliable to depend on for this - the user may close the main tab while this stays open).
            document.addEventListener('click', (e) => {
                const row = e.target.closest('.clickable-session-row');
                if (!row || e.target.closest('input[type="checkbox"]')) return;

                const sid = row.getAttribute('data-sid');
                const serial = row.getAttribute('data-serial') || '';
                const sql_id = row.getAttribute('data-sql_id') || '';
                if (!sid && !sql_id) return;

                const dbId = (window.opener && !window.opener.closed && window.opener.currentDbId) ? window.opener.currentDbId : '';
                // opener가 없으면 db_id가 빈 값으로 넘어가 엉뚱한 DB를 조회할 수 있어 중단한다(2026-10-09 점검 수정).
                if (!dbId) {
                    alert('메인 화면 연결이 끊어져 대상 DB를 알 수 없습니다. 메인 화면에서 세션 리스트를 다시 열어 주세요.');
                    return;
                }
                const url = `session-detail.html?db_id=${encodeURIComponent(dbId)}&sid=${encodeURIComponent(sid || '')}&serial=${encodeURIComponent(serial)}&sql_id=${encodeURIComponent(sql_id)}`;
                const popup = window.open(url, `dbagent_session_detail_${sid || sql_id}`, 'width=1100,height=680,resizable=yes,scrollbars=yes');
                if (popup) {
                    // A window's `.opener` defaults to whatever actually called window.open() on it -
                    // that would be this session-list.html popup, not the main dashboard. session-
                    // detail.html's "튜닝" button calls `window.opener.openSqlTuningFromPopup(...)`,
                    // which only exists on the main dashboard's window, so left at the default it
                    // silently does nothing when opened through this intermediate popup. `.opener` is
                    // a writable property (WHATWG HTML calls it "Replaceable"), so forward this popup's
                    // own opener (the main dashboard) instead, keeping the chain flat.
                    try { popup.opener = window.opener; } catch (e) { /* ignore, non-fatal */ }
                    popup.focus();
                }
            });
        })();
    </script>
</body>
</html>
