<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB 관리</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="stylesheet" href="style.css?v=56">
    <link rel="stylesheet" href="popup.css?v=3">
    <script>
        (function () {
            const saved = localStorage.getItem('dbagent_theme') || 'dark';
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
        /* width:100% already comes from the base .login-card rule in style.css - just raise the cap
           and let it track the popup window's actual width as the user resizes it (native window
           resize via the resizable=yes the popup was opened with), instead of a fixed max-width. */
        .login-card { max-width: 1200px; margin: 0; max-height: none; box-sizing: border-box; }
        /* auto-fit/minmax reflows the column count to whatever fits - no fixed breakpoint needed, so
           narrowing/widening the popup window continuously adjusts how many fields sit per row instead
           of just scaling a fixed 2-column (or 5-column) grid down until it's cramped or overflows. */
        .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .field-row-5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; }
        /* .db-account-row inputs aren't inside a .login-form-group, so they missed that rule's
           styling entirely and rendered as tiny unstyled native inputs. Match .login-form-group
           input's look explicitly instead. */
        .db-account-row input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(13, 13, 13, 0.6);
            color: var(--text-main);
            font-size: 1rem;
        }
        .db-account-row input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(57, 135, 229, 0.3);
        }
        /* The dropdown-select DB picker below reuses .login-form-group input's field look for the
           <select> itself, so it reads as one design language with the rest of the form. */
        .login-form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(13, 13, 13, 0.6);
            color: var(--text-main);
            font-size: 1rem;
        }
        .login-form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(57, 135, 229, 0.3);
        }
    </style>
</head>
<body class="pp-body">
    <div id="content" class="pp-root">불러오는 중...</div>
    <script>
        (function () {
            const contentEl = document.getElementById('content');
            if (!window.opener || window.opener.closed) {
                contentEl.innerHTML = '<h3 style="color: var(--danger);">메인 화면이 닫혀 있어 열 수 없습니다.</h3>';
                return;
            }
            // Gear-dropdown button hiding is only a UI convenience - this page does real DB config
            // mutations, so it needs its own check in case a non-admin opens the URL directly.
            if (sessionStorage.getItem('dbagent_role') !== 'admin') {
                contentEl.innerHTML = '<h3 style="color: var(--danger);">관리자만 접근할 수 있습니다.</h3>';
                return;
            }
            const token = sessionStorage.getItem('dbagent_token');

            // 대시보드 기본값(app.js DEFAULT_SESSION_THRESHOLDS)과 동일 - 입력 안 하면 이 기본값이 적용됨.
            const THRESHOLD_PLACEHOLDERS = [60, 70, 80, 90, 100];
            function thresholdFieldsHtml(prefix) {
                return THRESHOLD_PLACEHOLDERS.map((ph, i) => `
                    <input type="number" id="${prefix}-threshold-${i}" placeholder="${ph}" min="1" style="width:100%;">
                `).join('');
            }

            function reloadOpenerAndClose() {
                if (window.opener && !window.opener.closed) window.opener.location.reload();
                window.close();
            }

            function addAccountRow(container, user, password) {
                const row = document.createElement('div');
                row.className = 'db-account-row';
                row.style.cssText = 'display:flex; gap:8px; align-items:center;';
                row.innerHTML = `
                    <input type="text" class="db-account-user" placeholder="계정명" value="${user || ''}" style="flex:1;">
                    <input type="password" class="db-account-password" placeholder="비밀번호${user ? ' (비워두면 유지)' : ''}" value="${password || ''}" style="flex:1;" autocomplete="new-password">
                    <button type="button" class="login-btn" style="width:auto; margin-top:0; padding:10px 14px; background:#d03b3b;">×</button>
                `;
                row.querySelector('button').addEventListener('click', () => row.remove());
                container.appendChild(row);
            }
            function renderAccountRows(container, accounts) {
                container.innerHTML = '';
                (accounts || []).forEach(acc => addAccountRow(container, acc.user, ''));
            }
            function collectAccountRows(container) {
                const accounts = [];
                container.querySelectorAll('.db-account-row').forEach(row => {
                    const user = row.querySelector('.db-account-user').value.trim();
                    const password = row.querySelector('.db-account-password').value;
                    if (user) accounts.push({ user, password });
                });
                return accounts;
            }

            // Returns null (don't override - nothing entered) or an array of 5 ints, or 'invalid' if
            // only some of the 5 fields were filled in (all-or-nothing, matching the backend's rule).
            function collectThresholds(prefix) {
                const values = THRESHOLD_PLACEHOLDERS.map((_, i) => document.getElementById(`${prefix}-threshold-${i}`).value.trim());
                const filled = values.filter(v => v !== '');
                if (filled.length === 0) return null;
                if (filled.length !== 5) return 'invalid';
                return values.map(v => parseInt(v, 10));
            }
            function fillThresholds(prefix, thresholds) {
                THRESHOLD_PLACEHOLDERS.forEach((_, i) => {
                    document.getElementById(`${prefix}-threshold-${i}`).value = (thresholds && thresholds[i] != null) ? thresholds[i] : '';
                });
            }

            const dbFormFieldsHtml = (prefix, withGroupAndId) => `
                ${withGroupAndId ? `
                <div class="field-row">
                    <div class="login-form-group">
                        <label>그룹명</label>
                        <input type="text" id="${prefix}-group" list="db-group-options" required autocomplete="off">
                        <datalist id="db-group-options"></datalist>
                    </div>
                    <div class="login-form-group">
                        <label>ID (고유값)</label>
                        <input type="text" id="${prefix}-id" required autocomplete="off">
                    </div>
                </div>` : ''}
                <div class="field-row">
                    <div class="login-form-group">
                        <label>DB Type</label>
                        <select id="${prefix}-dbtype">
                            <option value="oracle">Oracle</option>
                            <option value="mysql">MySQL</option>
                            <option value="mariadb">MariaDB</option>
                            <option value="postgres">PostgreSQL</option>
                            <option value="mssql">MS SQL Server</option>
                            <option value="cubrid">CUBRID</option>
                        </select>
                    </div>
                    <div class="login-form-group">
                        <label>표시 이름</label>
                        <input type="text" id="${prefix}-name" required autocomplete="off">
                    </div>
                </div>
                <div class="login-form-group" id="${prefix}-cdb-row" style="text-align:left;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:0;">
                        <input type="checkbox" id="${prefix}-oracle-cdb" style="width:auto; margin:0;">
                        CDB 방식 (PDB에 접속 - 접속 방식은 Service Name으로 고정)
                    </label>
                </div>
                <div class="field-row">
                    <div class="login-form-group">
                        <label>Host (필수)</label>
                        <input type="text" id="${prefix}-host" required autocomplete="off">
                    </div>
                    <div class="login-form-group">
                        <label>Port</label>
                        <input type="number" id="${prefix}-port" value="1521" required>
                    </div>
                </div>
                <div class="field-row">
                    <div class="login-form-group">
                        <label id="${prefix}-sid-label">SID</label>
                        <input type="text" id="${prefix}-sid" required autocomplete="off">
                    </div>
                    <div class="login-form-group">
                        <label>계정</label>
                        <input type="text" id="${prefix}-user" required autocomplete="off">
                    </div>
                </div>
                <div class="field-row" id="${prefix}-connect-mode-row">
                    <div class="login-form-group">
                        <label>접속 방식 (Oracle 전용)</label>
                        <select id="${prefix}-connect-mode">
                            <option value="">기본 (host:port:SID)</option>
                            <option value="service">Service Name (host:port/SERVICE)</option>
                            <option value="descriptor">전체 커넥트 디스크립터 (SID 필드에 직접 입력, host/port 무시)</option>
                        </select>
                    </div>
                    <div class="login-form-group">
                        <label>예상 인스턴스명 (선택, Oracle 전용)</label>
                        <input type="text" id="${prefix}-expected-instance-name" autocomplete="off"
                               placeholder="v$instance.instance_name과 대조 - 잘못된 host/port 등록 방지">
                    </div>
                </div>
                <div class="field-row">
                    <div class="login-form-group">
                        <label>비밀번호${withGroupAndId ? '' : ' (비워두면 기존 값 유지)'}</label>
                        <input type="password" id="${prefix}-password" ${withGroupAndId ? 'required' : ''} autocomplete="new-password">
                    </div>
                    <div class="login-form-group"></div>
                </div>
                <div class="field-row">
                    <div class="login-form-group">
                        <label>Pool Min Idle (선택)</label>
                        <input type="number" id="${prefix}-pool-min" min="0">
                    </div>
                    <div class="login-form-group">
                        <label>Pool Max Size (선택)</label>
                        <input type="number" id="${prefix}-pool-max" min="1">
                    </div>
                </div>
                <div class="login-form-group">
                    <label>세션 임계치 1~5단계 (선택, 5개 모두 입력 - 비워두면 기본값 [${THRESHOLD_PLACEHOLDERS.join(', ')}] 사용)</label>
                    <div class="field-row-5">${thresholdFieldsHtml(prefix)}</div>
                </div>
                <div style="margin-bottom: 16px; text-align:left;">
                    <label style="display:block; margin-bottom:8px; color: var(--text-muted); font-size:0.9rem;">추가 로그인 계정 (선택 - 기본 계정 외에 이 DB로 전환 접속할 수 있는 계정${withGroupAndId ? '' : ', 비밀번호를 비워두면 그 계정은 기존 비밀번호 유지'})</label>
                    <div id="${prefix}-accounts" style="display:flex; flex-direction:column; gap:10px;"></div>
                    <button type="button" id="${prefix}-account-add-btn" class="login-btn" style="width:auto; margin-top:10px; padding:8px 14px; font-size:0.85rem; background:#3a3a37;">+ 계정 추가</button>
                </div>
            `;

            // Landing view is just a compact dropdown (같은 방식으로 그룹명 입력 - 화살표로 목록 펼쳐서 고르는
            // UX 요청) instead of listing every DB as an expanded row, so the popup reads at a glance.
            contentEl.innerHTML = `
                <div class="login-card">
                    <div id="db-mgmt-main-view">
                        <h3 style="margin-bottom: 20px;">DB 관리</h3>
                        <div class="login-form-group">
                            <label>DB 선택</label>
                            <select id="db-select"></select>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button type="button" class="login-btn" id="db-mgmt-edit-open-btn" style="margin-top: 0; width:auto; padding:12px 24px;">선택한 DB 수정</button>
                            <button type="button" class="login-btn" id="db-mgmt-delete-btn" style="margin-top: 0; width:auto; padding:12px 24px; background:#d03b3b;">선택한 DB 삭제</button>
                        </div>
                        <hr style="border-color: var(--border-color); margin: 24px 0;">
                        <div style="display: flex; gap: 10px;">
                            <button type="button" class="login-btn" id="db-mgmt-create-open-btn" style="margin-top: 0; width:auto; padding:12px 24px;">+ 새 DB 추가</button>
                            <button type="button" class="login-btn" id="db-mgmt-close-btn" style="margin-top: 0; width:auto; padding:12px 24px; background: #3a3a37;">닫기</button>
                        </div>
                        <div id="db-mgmt-main-error" class="login-error"></div>
                    </div>

                    <div id="db-mgmt-create-view" style="display: none;">
                        <h3 style="margin-bottom: 20px;">새 DB 추가</h3>
                        <form id="create-db-form">
                            ${dbFormFieldsHtml('new-db', true)}
                            <div style="display: flex; gap: 10px; margin-top: 15px;">
                                <button type="submit" class="login-btn" style="margin-top: 0; width:auto; padding:12px 28px;">DB 추가</button>
                                <button type="button" class="login-btn" id="create-db-cancel-btn" style="margin-top: 0; width:auto; padding:12px 28px; background: #3a3a37;">취소</button>
                            </div>
                            <div id="db-mgmt-error" class="login-error"></div>
                            <div id="new-db-check-status" style="display:none; margin-top:12px; font-size:0.9rem;"></div>
                            <div id="new-db-check-actions" style="display:none; gap:10px; margin-top:12px;"></div>
                        </form>
                    </div>

                    <div id="db-mgmt-edit-view" style="display: none;">
                        <h3 style="margin-bottom: 20px;">DB 수정 - <span id="edit-db-id"></span></h3>
                        ${dbFormFieldsHtml('edit-db', false)}
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button type="button" class="login-btn" id="edit-db-save-btn" style="margin-top: 0; width:auto; padding:12px 28px;">저장</button>
                            <button type="button" class="login-btn" id="edit-db-cancel-btn" style="margin-top: 0; width:auto; padding:12px 28px; background: #3a3a37;">취소</button>
                        </div>
                        <div id="edit-db-error" class="login-error"></div>
                        <div id="edit-db-check-status" style="display:none; margin-top:12px; font-size:0.9rem;"></div>
                        <div id="edit-db-check-actions" style="display:none; gap:10px; margin-top:12px;"></div>
                    </div>
                </div>
            `;

            const dbMgmtError = document.getElementById('db-mgmt-error');
            const dbMgmtMainError = document.getElementById('db-mgmt-main-error');
            const dbSelect = document.getElementById('db-select');
            let instanceById = {}; // populated by loadDbConfigList(), read by the edit/delete buttons

            // Switching views toggles display:none/block on siblings but the window's own scroll
            // position doesn't reset itself - since the form views are tall, going back to a view
            // scrolled halfway down looked like nothing happened.
            function showView(id) {
                ['db-mgmt-main-view', 'db-mgmt-create-view', 'db-mgmt-edit-view'].forEach(v => {
                    document.getElementById(v).style.display = (v === id) ? 'block' : 'none';
                });
                window.scrollTo(0, 0);
            }

            document.getElementById('new-db-account-add-btn').addEventListener('click', () => {
                addAccountRow(document.getElementById('new-db-accounts'));
            });
            document.getElementById('edit-db-account-add-btn').addEventListener('click', () => {
                addAccountRow(document.getElementById('edit-db-accounts'));
            });

            // Oracle uses "SID" terminology; the other engines use a plain database name - relabel the
            // field (not a separate input) so createInstance/updateInstance keep reading the same "sid"
            // value regardless of db_type. Default port also nudges to each engine's usual port when the
            // admin hasn't touched Port yet, to save a lookup.
            const DB_TYPE_DEFAULT_PORT = { oracle: 1521, mysql: 3306, mariadb: 3306, postgres: 5432, mssql: 1433, cubrid: 33000 };
            const applyDbTypeFns = {}; // prefix -> applyDbType (수정 화면이 값을 채운 뒤 다시 적용)
            function wireDbTypeFields(prefix) {
                const typeSelect = document.getElementById(`${prefix}-dbtype`);
                const sidLabel = document.getElementById(`${prefix}-sid-label`);
                const portInput = document.getElementById(`${prefix}-port`);
                const connectModeRow = document.getElementById(`${prefix}-connect-mode-row`);
                const connectModeSelect = document.getElementById(`${prefix}-connect-mode`);
                const cdbRow = document.getElementById(`${prefix}-cdb-row`);
                const cdbCheckbox = document.getElementById(`${prefix}-oracle-cdb`);
                const applyDbType = () => {
                    const isOracle = typeSelect.value === 'oracle';
                    const cdb = isOracle && cdbCheckbox.checked;
                    // CDB 방식은 PDB 서비스명으로만 붙는다(PDB에는 SID가 없음) - 접속 방식을 service로 고정하고
                    // 입력 칸 이름도 바꿔 SID로 잘못 넣어 CDB 루트에 붙는 실수를 막는다(2026-10-02).
                    sidLabel.textContent = !isOracle ? 'Database' : (cdb ? 'PDB 서비스명' : 'SID');
                    if (cdb) {
                        if (!connectModeSelect.disabled) connectModeSelect.dataset.prevMode = connectModeSelect.value;
                        connectModeSelect.value = 'service';
                        connectModeSelect.disabled = true;
                    } else if (connectModeSelect.disabled) {
                        connectModeSelect.value = connectModeSelect.dataset.prevMode || '';
                        connectModeSelect.disabled = false;
                    }
                    // connect_mode(sid/service/descriptor)와 CDB 구분은 Oracle 전용 - 다른 엔진은 항상 host:port
                    // 형태라 이 필드 자체가 의미 없다.
                    connectModeRow.style.display = isOracle ? '' : 'none';
                    cdbRow.style.display = isOracle ? '' : 'none';
                };
                typeSelect.addEventListener('change', () => {
                    applyDbType();
                    const defaultPort = DB_TYPE_DEFAULT_PORT[typeSelect.value];
                    if (defaultPort && Object.values(DB_TYPE_DEFAULT_PORT).includes(parseInt(portInput.value, 10))) {
                        portInput.value = defaultPort;
                    }
                });
                cdbCheckbox.addEventListener('change', applyDbType);
                applyDbTypeFns[prefix] = applyDbType;
                applyDbType();
            }

            function resetCdbCheck(prefix) {
                const statusEl = document.getElementById(`${prefix}-check-status`);
                const actionsEl = document.getElementById(`${prefix}-check-actions`);
                statusEl.style.display = 'none';
                statusEl.textContent = '';
                actionsEl.style.display = 'none';
                actionsEl.innerHTML = '';
            }

            // 저장 직후 자동 확인 - 등록한 CDB/Non-CDB 구분이 실제 접속 결과와 맞는지 본다(2026-10-02).
            // 저장은 이미 끝난 상태라 결과는 알려 주기만 한다. 맞으면 잠깐 보여 주고 닫고, 어긋나거나 확인에
            // 실패하면 창을 열어 둔 채 안내한다.
            async function showCdbCheckAfterSave(dbId, statusEl, actionsEl, isCreate) {
                statusEl.style.display = 'block';
                statusEl.style.color = 'var(--text-muted)';
                statusEl.textContent = '저장되었습니다. 접속 구조(CDB/Non-CDB)를 확인하는 중...';
                let data = null;
                try {
                    const res = await fetch(`/api/db_configs/${encodeURIComponent(dbId)}/cdb_check?token=${encodeURIComponent(token)}`);
                    data = await res.json();
                } catch (e) {
                    data = { success: false, message: '저장은 되었지만 접속 확인 요청에 실패했습니다.' };
                }
                if (data.success && data.ok) {
                    statusEl.style.color = 'var(--success)';
                    statusEl.textContent = `저장되었습니다. ${data.message}`;
                    setTimeout(reloadOpenerAndClose, 1500);
                    return;
                }
                statusEl.style.color = data.success ? 'var(--warning)' : 'var(--danger)';
                statusEl.textContent = `저장되었습니다. 확인 필요: ${data.message || '알 수 없는 오류'}`;
                actionsEl.innerHTML = '';
                if (isCreate) {
                    const editBtn = document.createElement('button');
                    editBtn.type = 'button';
                    editBtn.className = 'login-btn';
                    editBtn.style.cssText = 'margin-top:0; width:auto; padding:12px 24px;';
                    editBtn.textContent = '수정 화면으로';
                    editBtn.addEventListener('click', async () => {
                        await loadDbConfigList();
                        const inst = instanceById[dbId];
                        if (inst) showDbEditView(inst);
                    });
                    actionsEl.appendChild(editBtn);
                }
                const closeBtn = document.createElement('button');
                closeBtn.type = 'button';
                closeBtn.className = 'login-btn';
                closeBtn.style.cssText = 'margin-top:0; width:auto; padding:12px 24px; background:#3a3a37;';
                closeBtn.textContent = '닫기';
                closeBtn.addEventListener('click', reloadOpenerAndClose);
                actionsEl.appendChild(closeBtn);
                actionsEl.style.display = 'flex';
            }
            wireDbTypeFields('new-db');
            wireDbTypeFields('edit-db');

            async function loadDbConfigList() {
                dbMgmtMainError.style.display = 'none';
                dbSelect.innerHTML = '<option>불러오는 중...</option>';
                try {
                    const res = await fetch('/api/config');
                    const data = await res.json();

                    const groupOptions = document.getElementById('db-group-options');
                    groupOptions.innerHTML = (data.groups || [])
                        .map(g => `<option value="${g.group_name}"></option>`).join('');

                    instanceById = {};
                    dbSelect.innerHTML = '';
                    (data.groups || []).forEach(group => {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = group.group_name;
                        (group.instances || []).forEach(inst => {
                            instanceById[inst.id] = inst;
                            const opt = document.createElement('option');
                            opt.value = inst.id;
                            opt.textContent = `${inst.name} (${inst.id})`;
                            optgroup.appendChild(opt);
                        });
                        dbSelect.appendChild(optgroup);
                    });
                    if (!dbSelect.options.length) {
                        dbSelect.innerHTML = '<option>등록된 DB가 없습니다</option>';
                    }
                } catch (e) {
                    dbSelect.innerHTML = '<option>목록 조회 실패</option>';
                }
            }

            document.getElementById('db-mgmt-close-btn').addEventListener('click', () => window.close());
            document.getElementById('db-mgmt-create-open-btn').addEventListener('click', () => {
                document.getElementById('create-db-form').reset();
                document.getElementById('new-db-connect-mode').disabled = false;
                applyDbTypeFns['new-db']();
                renderAccountRows(document.getElementById('new-db-accounts'), []);
                dbMgmtError.style.display = 'none';
                resetCdbCheck('new-db');
                document.querySelector('#create-db-form button[type="submit"]').disabled = false;
                showView('db-mgmt-create-view');
            });
            document.getElementById('create-db-cancel-btn').addEventListener('click', () => showView('db-mgmt-main-view'));

            document.getElementById('db-mgmt-edit-open-btn').addEventListener('click', () => {
                const inst = instanceById[dbSelect.value];
                if (!inst) {
                    dbMgmtMainError.textContent = '수정할 DB를 선택하세요.';
                    dbMgmtMainError.style.display = 'block';
                    return;
                }
                showDbEditView(inst);
            });
            document.getElementById('db-mgmt-delete-btn').addEventListener('click', async () => {
                const inst = instanceById[dbSelect.value];
                if (!inst) {
                    dbMgmtMainError.textContent = '삭제할 DB를 선택하세요.';
                    dbMgmtMainError.style.display = 'block';
                    return;
                }
                if (!confirm(`'${inst.name}' (${inst.id})를 삭제하시겠습니까?`)) return;
                const delRes = await fetch(`/api/db_configs/${encodeURIComponent(inst.id)}?token=${encodeURIComponent(token)}`, { method: 'DELETE' });
                const delData = await delRes.json();
                if (!delRes.ok || !delData.success) {
                    dbMgmtMainError.textContent = delData.message || '삭제 실패';
                    dbMgmtMainError.style.display = 'block';
                    return;
                }
                if (window.opener && !window.opener.closed) window.opener.location.reload();
                loadDbConfigList();
            });

            document.getElementById('create-db-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const thresholds = collectThresholds('new-db');
                if (thresholds === 'invalid') {
                    dbMgmtError.textContent = '세션 임계치는 5개 값을 모두 입력하거나 모두 비워두세요.';
                    dbMgmtError.style.display = 'block';
                    return;
                }
                const body = {
                    token,
                    group_name: document.getElementById('new-db-group').value.trim(),
                    id: document.getElementById('new-db-id').value.trim(),
                    name: document.getElementById('new-db-name').value.trim(),
                    db_type: document.getElementById('new-db-dbtype').value,
                    host: document.getElementById('new-db-host').value.trim(),
                    port: parseInt(document.getElementById('new-db-port').value, 10) || 1521,
                    sid: document.getElementById('new-db-sid').value.trim(),
                    user: document.getElementById('new-db-user').value.trim(),
                    password: document.getElementById('new-db-password').value,
                    connect_mode: document.getElementById('new-db-connect-mode').value,
                    oracle_cdb: document.getElementById('new-db-dbtype').value === 'oracle' && document.getElementById('new-db-oracle-cdb').checked,
                    expected_instance_name: document.getElementById('new-db-expected-instance-name').value.trim(),
                    pool_min_idle: document.getElementById('new-db-pool-min').value ? parseInt(document.getElementById('new-db-pool-min').value, 10) : null,
                    pool_max_size: document.getElementById('new-db-pool-max').value ? parseInt(document.getElementById('new-db-pool-max').value, 10) : null,
                    accounts: collectAccountRows(document.getElementById('new-db-accounts')),
                    session_thresholds: thresholds
                };
                try {
                    const res = await fetch('/api/db_configs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        if (body.db_type === 'oracle') {
                            // 같은 ID로 다시 추가되지 않게 막고, 저장된 DB로 구조 확인
                            document.querySelector('#create-db-form button[type="submit"]').disabled = true;
                            dbMgmtError.style.display = 'none';
                            showCdbCheckAfterSave(body.id, document.getElementById('new-db-check-status'),
                                document.getElementById('new-db-check-actions'), true);
                        } else {
                            reloadOpenerAndClose();
                        }
                    } else {
                        dbMgmtError.textContent = data.message || 'DB 추가 실패';
                        dbMgmtError.style.display = 'block';
                    }
                } catch (e2) {
                    dbMgmtError.textContent = '서버 오류';
                    dbMgmtError.style.display = 'block';
                }
            });

            function showDbEditView(inst) {
                document.getElementById('edit-db-id').textContent = `${inst.name} (${inst.id})`;
                document.getElementById('edit-db-name').value = inst.name || '';
                const dbType = inst.db_type || 'oracle';
                document.getElementById('edit-db-dbtype').value = dbType;
                const editConnectMode = document.getElementById('edit-db-connect-mode');
                editConnectMode.disabled = false;
                editConnectMode.value = inst.connect_mode || '';
                document.getElementById('edit-db-oracle-cdb').checked = !!inst.oracle_cdb;
                applyDbTypeFns['edit-db']();
                document.getElementById('edit-db-expected-instance-name').value = inst.expected_instance_name || '';
                document.getElementById('edit-db-host').value = inst.host || '';
                document.getElementById('edit-db-port').value = inst.port || 1521;
                document.getElementById('edit-db-sid').value = inst.sid || '';
                document.getElementById('edit-db-user').value = inst.user || '';
                document.getElementById('edit-db-password').value = '';
                document.getElementById('edit-db-pool-min').value = inst.pool_min_idle != null ? inst.pool_min_idle : '';
                document.getElementById('edit-db-pool-max').value = inst.pool_max_size != null ? inst.pool_max_size : '';
                fillThresholds('edit-db', inst.session_thresholds);
                renderAccountRows(document.getElementById('edit-db-accounts'), inst.accounts || []);
                document.getElementById('edit-db-error').style.display = 'none';
                resetCdbCheck('edit-db');
                document.getElementById('edit-db-save-btn').dataset.dbId = inst.id;
                showView('db-mgmt-edit-view');
            }

            document.getElementById('edit-db-cancel-btn').addEventListener('click', () => showView('db-mgmt-main-view'));

            document.getElementById('edit-db-save-btn').addEventListener('click', async () => {
                const id = document.getElementById('edit-db-save-btn').dataset.dbId;
                const editDbError = document.getElementById('edit-db-error');
                const thresholds = collectThresholds('edit-db');
                if (thresholds === 'invalid') {
                    editDbError.textContent = '세션 임계치는 5개 값을 모두 입력하거나 모두 비워두세요.';
                    editDbError.style.display = 'block';
                    return;
                }
                const body = {
                    token,
                    name: document.getElementById('edit-db-name').value.trim(),
                    db_type: document.getElementById('edit-db-dbtype').value,
                    host: document.getElementById('edit-db-host').value.trim(),
                    port: parseInt(document.getElementById('edit-db-port').value, 10) || 1521,
                    sid: document.getElementById('edit-db-sid').value.trim(),
                    user: document.getElementById('edit-db-user').value.trim(),
                    password: document.getElementById('edit-db-password').value,
                    connect_mode: document.getElementById('edit-db-connect-mode').value,
                    oracle_cdb: document.getElementById('edit-db-dbtype').value === 'oracle' && document.getElementById('edit-db-oracle-cdb').checked,
                    expected_instance_name: document.getElementById('edit-db-expected-instance-name').value.trim(),
                    pool_min_idle: document.getElementById('edit-db-pool-min').value ? parseInt(document.getElementById('edit-db-pool-min').value, 10) : null,
                    pool_max_size: document.getElementById('edit-db-pool-max').value ? parseInt(document.getElementById('edit-db-pool-max').value, 10) : null,
                    accounts: collectAccountRows(document.getElementById('edit-db-accounts')),
                    session_thresholds: thresholds
                };
                try {
                    const res = await fetch(`/api/db_configs/${encodeURIComponent(id)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        if (body.db_type === 'oracle') {
                            editDbError.style.display = 'none';
                            resetCdbCheck('edit-db');
                            showCdbCheckAfterSave(id, document.getElementById('edit-db-check-status'),
                                document.getElementById('edit-db-check-actions'), false);
                        } else {
                            reloadOpenerAndClose();
                        }
                    } else {
                        editDbError.textContent = data.message || '수정 실패';
                        editDbError.style.display = 'block';
                    }
                } catch (e2) {
                    editDbError.textContent = '서버 오류';
                    editDbError.style.display = 'block';
                }
            });

            loadDbConfigList();
        })();
    </script>
</body>
</html>
