<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Overview</title>
<script>
    (function () {
        const saved = localStorage.getItem('dbagent_theme') || 'dark';
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
</script>
<!--
  This is now the real post-login landing screen (사용자 결정, 2026-08-27) - app.js's login-form
  submit handler redirects here on successful login instead of reloading index.html (see the comment
  next to that redirect). Chosen color variant (사용자 선택, over the violet fleet-overview-test.html,
  which has since been brought up to full feature parity with it - 동일 기능, 색상만 다름, see that
  file's own header comment). Renamed from fleet-overview-test-blue.html to fleet-overview.html
  (2026-08-29, 사용자 요청: "이제 테스트가 아니니") once this became the real, non-prototype screen.
  Palette lifted from 색감1.jpg (CryptiQ-style navy fintech dashboard).

  Card/row clicks navigate to index.html?db_id=<id>, and app.js's "Load config and build tree" step
  reads that query param to auto-select the matching instance (falls back to its old "first instance"
  default when the param is absent) - see the jumpToDbId comment there. index.html itself is otherwise
  unchanged - visiting it directly with an existing session still shows the normal dashboard, this
  page is only the destination right after a fresh login.

  Status/CPU/MEM/ActiveSession/LockWait/Uptime are now real, not simulated: loadDbs() joins the
  existing public GET /api/config (DB list) with the new GET /api/fleet_status (MonitorService.
  getFleetStatus via MonitorController.fleetStatus, checked concurrently per instance so one down DB
  doesn't stall the rest - the "동시 폴링 부하" concern the design doc flagged). fleet_status needs a
  valid token (same canAccessDb per-account visibility as everywhere else); without one every
  instance just falls back to a "상태 조회 실패" down-looking card instead of failing the whole page.
  Uptime% specifically is NOT a measured historical availability number (Oracle doesn't track that,
  and this app has no time-series health log) - it's derived from v$instance.startup_time, scaled to
  100% once an instance has been continuously up for 30 days. See getFleetStatus's own comment for
  the full reasoning.
-->
<style>
    :root {
        /* Palette lifted from 색감1.jpg (CryptiQ-style navy fintech dashboard) - crisper and flatter
           than the violet variant: a single solid blue accent (no multi-stop rainbow gradient),
           visible-but-thin blue-tinted borders (that reference's active sidebar item has a distinct
           blue outline box), and a page background close enough to the design doc's own #0d0d0d
           that its exact verified-contrast status hex values are used unchanged here. */
        --bg-page: #0d0d0d;
        --bg-page-2: #131312;
        --bg-card: #1a1a19;
        --bg-hover: #202120;
        --border: rgba(255,255,255,0.08);
        --border-strong: rgba(57,135,229,0.4);
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;

        /* Same blue as this app's own --primary (style.css), on purpose - 색감1's accent blue lands
           almost exactly on it, so this variant doubles as "what if Fleet Overview matched the rest
           of DB Agent's existing color instead of introducing a new brand hue". */
        --brand: #3987e5;
        --brand-hover: #2f6cb8;
        --brand-teal: #5fa3e8;
        --brand-sky: #3987e5;
        --brand-gradient: linear-gradient(135deg, #3987e5, #5fa3e8);

        /* Status colors are reserved exclusively for DB health, per the design doc's explicit
           rule - never reused for metric-category coloring elsewhere on this page. Kept at the
           design doc's own verified-contrast hex values (measured against #0d0d0d) since this
           variant's background is close enough to that tone, unlike the violet variant. */
        --status-good: #0ca30c;
        --status-warning: #fab219;
        --status-critical: #d03b3b;

        --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        --font-body: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

        /* Frame/card backgrounds get a subtle top-lighter-to-base diagonal gradient instead of a
           flat fill (사용자 피드백: "각 프레임들을 약간 밝은 톤으로 그라데이션 처리"). */
        --card-gradient: linear-gradient(160deg, #262622 0%, var(--bg-card) 60%);

        --radius-card: 20px;
        --radius-pill: 999px;
        --radius-sm: 10px;
        --radius-md: 12px;

        /* KPI summary cards - "Left Accent" 스타일 (kpi-cards-left-accent.md) */
        --kpi-bg: #141413;
        --kpi-label: #a19f97;
        --kpi-value-muted: #6b6a64;

        /* Named so the light theme below can override them too - these used to be inline rgba(57,135,229,...)
           literals scattered across body/.test-banner/.brand-icon/.engine-icon/.group-badge, which meant
           they'd stay dark-theme-blue even after switching to the light palette (사용자 요청: 배색 전환 가능하게). */
        --brand-glow-14: rgba(57,135,229,0.14);
        --brand-glow-18: rgba(57,135,229,0.18);
        --brand-banner-strong: rgba(57,135,229,0.22);
        --brand-banner-soft: rgba(57,135,229,0.05);
    }

    /* 2026-08-28 사용자 요청: FO(Fleet Overview) 화면에도 팔레트 버튼을 추가해서 배색을 바꿀 수 있게 -
       index.html/style.css의 data-theme="light" 슬롯과 동일하게, 리팩토링 이전의 기존 네이비 다크
       배색으로 전환. 이 페이지는 style.css를 쓰지 않는 완전히 독립된 페이지라 그 값들을 그대로
       가져와 이 페이지 고유의 변수 이름에 맞게 매핑했다. */
    :root[data-theme="light"] {
        --bg-page: #0f172a;
        --bg-page-2: #14213d;
        --bg-card: #1e293b;
        --bg-hover: #263449;
        --border: rgba(255,255,255,0.1);
        --border-strong: rgba(59,130,246,0.4);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;

        --brand: #3b82f6;
        --brand-hover: #2563eb;
        --brand-teal: #60a5fa;
        --brand-sky: #3b82f6;
        --brand-gradient: linear-gradient(135deg, #3b82f6, #60a5fa);

        --status-good: #10b981;
        --status-warning: #f59e0b;
        --status-critical: #ef4444;

        --card-gradient: linear-gradient(160deg, #2d3f5c 0%, var(--bg-card) 60%);

        --kpi-bg: #182338;
        --kpi-label: #94a3b8;
        --kpi-value-muted: #64748b;

        --brand-glow-14: rgba(59,130,246,0.14);
        --brand-glow-18: rgba(59,130,246,0.18);
        --brand-banner-strong: rgba(59,130,246,0.22);
        --brand-banner-soft: rgba(59,130,246,0.05);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        background:
            radial-gradient(720px 420px at 15% -10%, var(--brand-glow-14), transparent 60%),
            var(--bg-page);
        color: var(--text-primary);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
    }

    .test-banner {
        background: linear-gradient(90deg, var(--brand-banner-strong), var(--brand-banner-soft));
        border-bottom: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 12.5px;
        padding: 8px calc(clamp(24px, 3vw, 64px) + 1cm);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .test-banner strong { color: var(--text-primary); }

    .page {
        /* No max-width - fills the actual browser window instead of leaving large empty gutters on
           wide monitors (사용자 피드백: "양쪽 여백이 너무 많이 남는다"). Side padding scales gently
           with viewport width via clamp() instead of a fixed px value, so it still looks
           intentional rather than edge-to-edge on very wide/ultrawide screens. */
        padding: 28px calc(clamp(24px, 3vw, 64px) + 1cm) 48px;
    }

    /* ---------- Header ---------- */
    header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 6px; }
    /* index.html 사이드바 로고(activity 아이콘)와 동일한 펄스 애니메이션 - 커졌다 작아지며 색이
       브랜드 블루 -> 시안으로 순환. style.css의 .brand-icon-pulse를 그대로 옮김(이 페이지는
       style.css를 쓰지 않는 완전 독립 페이지라 값만 복제). */
    @keyframes brand-icon-pulse {
        0%, 100% { color: var(--brand); transform: scale(1); filter: none; }
        50% { color: #22d3ee; transform: scale(1.18); filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.65)); }
    }
    .brand-icon-pulse { display: inline-block; animation: brand-icon-pulse 2s ease-in-out infinite; }
    .brand-icon {
        width: 34px; height: 34px;
        display: flex; align-items: center; justify-content: center;
        color: var(--brand);
    }
    .brand-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 0.02em;
    }
    .header-divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
    .page-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--text-primary); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
        width: 36px; height: 36px; border-radius: var(--radius-sm);
        background: var(--bg-card); border: 1px solid var(--border);
        color: var(--text-secondary); cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .avatar {
        width: 40px; height: 40px; border-radius: 50%;
        background: linear-gradient(135deg, #2dd4bf, #06b6d4);
        color: #ffffff; font-weight: 700; font-size: 13px;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display);
    }

    /* ---------- Summary bar ---------- */
    .summary-bar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
    }
    .summary-tile {
        /* "Left Accent" 스타일 (kpi-cards-left-accent.md): 4개 카드 배경을 동일한 중립 다크 톤으로
           통일하고, 좌측 3px accent bar만 상태별로 다르게 칠해서 의미를 전달한다. */
        background: var(--kpi-bg);
        border: 1px solid var(--border);
        border-left: 5px solid transparent;
        border-radius: var(--radius-card);
        padding: 16px 18px;
        box-shadow: 0 12px 28px -18px rgba(0,0,0,0.65);
    }
    .summary-tile .label { font-size: 16px; font-weight: 800; color: #ffffff; margin-bottom: 6px; }
    .summary-tile .value { font-family: var(--font-mono); font-weight: 700; font-size: 26px; color: var(--text-primary); }
    .summary-tile.total { border-left-color: var(--brand-teal); }
    .summary-tile.good { border-left-color: var(--status-good); }
    .summary-tile.good .value { color: var(--status-good); }
    .summary-tile.warning { border-left-color: var(--status-warning); }
    .summary-tile.warning .value { color: var(--status-warning); }
    .summary-tile.critical { border-left-color: var(--status-critical); border-color: rgba(208,59,59,0.3); }
    .summary-tile.critical .value { color: var(--status-critical); }
    /* 값이 0이면 상태색 대신 무채색으로 - 실제로 이상이 있을 때만 시선이 가도록 (kpi-cards-left-accent.md) */
    .summary-tile .value.muted { color: var(--kpi-value-muted); }

    /* ---------- Layout: list column + insight column, independently top-aligned ---------- */
    .layout {
        display: grid;
        /* 360px(구 320px) - 사용자 요청(2026-08-30): "Top 5 카드 프레임 커져도 되니 폰트/굵기를
           시인성 좋게 크게" - 아래 rank-name/rank-meta/rank-cpu 폰트를 키운 만큼 여유 확보. */
        grid-template-columns: 1fr 360px;
        gap: 18px;
        align-items: start;
    }

    /* ---------- Toolbar ---------- */
    .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-box {
        display: flex; align-items: center; gap: 8px;
        width: 260px; height: 38px; padding: 0 12px;
        /* White fill (사용자 요청) instead of the dark card-gradient every other panel uses - text/
           icon colors below are overridden to dark so they stay legible against it. */
        background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md);
        color: #475569;
    }
    .search-box input {
        border: none; background: transparent; outline: none; color: #1e293b;
        font-family: var(--font-body); font-size: 13px; width: 100%;
    }
    .search-box input::placeholder { color: #94a3b8; }

    .chip {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 7px 13px; border-radius: var(--radius-pill);
        font-size: 12.5px; font-weight: 500; cursor: pointer;
        border: 1px solid var(--border); color: var(--text-secondary); background: transparent;
        white-space: nowrap;
    }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
    .chip.active { background: var(--brand-gradient); border-color: transparent; color: #ffffff; font-weight: 600; }
    .chip.active .dot { background: #ffffff; }
    .chip[data-status="alive"] .dot { background: var(--status-good); }
    .chip[data-status="degraded"] .dot { background: var(--status-warning); }
    .chip[data-status="down"] .dot { background: var(--status-critical); }

    .view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .view-toggle button {
        border: none; background: var(--bg-card); color: var(--text-secondary);
        padding: 8px 14px; font-size: 12.5px; cursor: pointer; font-family: var(--font-body);
    }
    .view-toggle button.active { background: var(--brand-gradient); color: #ffffff; font-weight: 600; }

    /* ---------- Card grid ---------- */
    .card-grid {
        display: grid;
        /* 340px(구 300px) - 사용자 요청(2026-08-29): "인스턴스 카드 크기를 조금 크게" - 아래
           stat-value/uptime-value/db-meta 폰트를 키운 만큼 줄바꿈 없이 여유있게 들어가도록. */
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
    }
    .db-card {
        background: var(--card-gradient);
        border: 1px solid var(--border);
        border-left: 3px solid var(--status-good);
        border-radius: var(--radius-card);
        padding: 20px 22px;
        cursor: pointer;
        box-shadow: 0 16px 32px -22px rgba(0,0,0,0.7);
        transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .db-card:hover {
        transform: translateY(-2px);
        /* Longhand on purpose (not the border-color shorthand) so hover never touches
           border-left-color, which carries the status accent strip instead. */
        border-top-color: var(--border-strong);
        border-right-color: var(--border-strong);
        border-bottom-color: var(--border-strong);
        box-shadow: 0 20px 40px -20px rgba(0,0,0,0.75);
    }
    .db-card.status-degraded { border-left-color: var(--status-warning); }
    .db-card.status-down { border-left-color: var(--status-critical); }

    .db-card .card-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .card-head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .engine-icon {
        width: 30px; height: 30px; border-radius: var(--radius-sm); flex: none;
        display: flex; align-items: center; justify-content: center;
        background: var(--brand-glow-18); color: var(--brand);
    }
    .db-card.status-down .engine-icon { background: rgba(137,135,129,0.14); color: var(--text-muted); }
    /* DB 아이콘을 "동작 중"일 때만 은은하게 pulse - 사용자 요청(2026-08-30: "인스턴스 카드 DB
       아이콘 동적으로"). status-dot.pulse와 같은 관례(움직임 = 살아있음/접속 시도 중)를 따라
       down 카드는 애니메이션 없이 정지 상태로 둔다 - cardHtml/tableRowHtml이 아니라 JS에서
       d.status !== 'down'일 때만 이 클래스를 붙인다. */
    @keyframes enginePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
    }
    .engine-icon.pulse { animation: enginePulse 2.4s ease-in-out infinite; }
    .card-name-block { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .db-name { font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* SID/Oracle 버전 (사용자 요청, 2026-08-29: "각 인스턴스 프레임에 DB 정보와 버전을 보여줬으면
       좋겠어") - SID는 /api/config 목록에 이미 있어 즉시 표시되고, 버전은 /api/fleet_status가
       실제 접속해 v$instance.version을 읽어와야 하므로 로딩/다운 상태에서는 비어 있다. */
    .db-meta { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .group-badge {
        font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
        padding: 3px 9px; border-radius: var(--radius-pill); flex: none;
        background: var(--brand-glow-14); color: var(--text-secondary); border: 1px solid var(--border);
    }

    .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .status-dot.pulse { animation: statusPulse 2.2s ease-in-out infinite; }
    @keyframes statusPulse {
        0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
        70% { box-shadow: 0 0 0 6px transparent; opacity: 0.35; }
        100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
    }
    .status-label { font-family: var(--font-display); font-weight: 700; font-size: 12.5px; letter-spacing: 0.03em; }
    .status-note { font-size: 11px; color: var(--text-muted); margin-left: auto; }

    .uptime-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .uptime-ring { flex: none; }
    /* "Uptime(%)" 라벨 - Active Session/CPU/MEM 라벨과 같은 요청인데 누락됐던 것 (2026-08-30). */
    .uptime-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    /* Active Session/분당 트랜잭션/CPU/MEM/Uptime - 사용자 요청(2026-08-30): 12.5px(db-meta와
       통일한 크기)로도 "여전히 작다", 이번엔 그래프(mini-bar-track)가 커져도 상관없다고 확인받아서
       텍스트뿐 아니라 CPU/MEM 바 자체 두께도 함께 키움. */
    .uptime-value { font-family: var(--font-mono); font-weight: 800; font-size: 22px; color: var(--text-primary); }

    .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    /* "Active Session"/"분당 트랜잭션" 라벨 자체 크기 - 사용자 요청(2026-08-30): 값(.stat-value)이
       아니라 이 라벨 텍스트가 작다는 지적, 값 크기는 그대로 유지. */
    .stat-cell .stat-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .stat-cell .stat-value { font-family: var(--font-mono); font-weight: 800; font-size: 16px; color: var(--text-primary); }
    .stat-cell .stat-value.muted { color: var(--text-muted); font-weight: 500; }
    .stat-cell .stat-value.warn { color: var(--status-warning); }
    .stat-cell .stat-value.crit { color: var(--status-critical); }

    .mini-bar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    /* "CPU"/"MEM" 라벨 자체 크기 - 위 .stat-label과 같은 요청, 값(.mb-pct)은 그대로 유지. */
    .mini-bar-row .mb-label { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text-muted); width: 36px; flex: none; }
    .mini-bar-track { flex: 1; height: 8px; border-radius: var(--radius-pill); background: rgba(195,194,183,0.14); overflow: hidden; }
    .mini-bar-fill { height: 100%; border-radius: var(--radius-pill); }
    .mini-bar-row .mb-pct { font-family: var(--font-mono); font-weight: 800; font-size: 14px; color: var(--text-secondary); width: 44px; text-align: right; flex: none; }

    .down-banner {
        display: flex; align-items: flex-start; gap: 8px;
        background: rgba(208,59,59,0.08); color: var(--status-critical);
        border-radius: var(--radius-sm); padding: 9px 10px; font-size: 11.5px; line-height: 1.4; margin-top: 6px;
    }
    .down-banner svg { flex: none; margin-top: 1px; }

    /* Shown on a card/row while its fleet_status result hasn't arrived yet (사용자 요청: 판넬을 먼저
       뿌리고 접속중 문구+회전 원 효과) - the DB list itself (name/group) comes from the fast, public
       /api/config and renders immediately; only the live status/metrics wait on this. */
    .loading-row { display: flex; align-items: center; gap: 10px; padding: 22px 0; color: var(--text-muted); font-size: 13px; }
    .spinner {
        width: 18px; height: 18px; flex: none;
        border: 2.5px solid rgba(255,255,255,0.15);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Table view ---------- */
    .db-table-wrap { background: var(--card-gradient); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; display: none; }
    table.db-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.db-table th {
        text-align: left; padding: 12px 16px; font-size: 11px; color: var(--text-muted);
        text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border);
        background: rgba(195,194,183,0.05);
    }
    table.db-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.db-table tbody tr { cursor: pointer; }
    table.db-table tbody tr:hover { background: var(--bg-hover); }
    table.db-table tbody tr:last-child td { border-bottom: none; }
    .table-name { font-family: var(--font-mono); font-weight: 600; }
    .table-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; }

    /* ---------- Empty state ---------- */
    .empty-state {
        grid-column: 1 / -1;
        text-align: center; padding: 60px 20px; color: var(--text-muted);
        border: 1px dashed var(--border); border-radius: var(--radius-card);
    }

    /* ---------- Top 5 insight panel ---------- */
    .insight-panel {
        background: var(--card-gradient); border: 1px solid var(--border); border-radius: var(--radius-card);
        padding: 20px;
    }
    .insight-panel h3 {
        margin: 0 0 4px; font-family: var(--font-display); font-size: 16px; font-weight: 700;
    }
    .insight-panel .insight-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
    /* Top 5 항목 전체 확대 - 사용자 요청(2026-08-30): "Top 5 카드 프레임 커져도 되니까 폰트 및
       굵기 좀 시인성 좋게 조금 더 크게". 행 패딩도 늘어난 글자 높이에 맞춰 함께 키움. */
    .rank-row {
        display: flex; align-items: center; gap: 12px; padding: 11px 0;
        border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num {
        width: 24px; height: 24px; border-radius: 50%; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-mono); font-size: 12px; font-weight: 800;
        background: rgba(195,194,183,0.14); color: var(--text-secondary);
    }
    .rank-info { min-width: 0; flex: 1; }
    .rank-name { font-family: var(--font-mono); font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-sub { font-size: 12px; color: var(--text-muted); }
    /* SID/DB 종류/버전 - 사용자 요청(2026-08-29): "주의 필요 Top 5에서 DB SID와 DB 종류, version
       정보가 들어가야 할거 같아". 이 앱은 Oracle 전용이라 "종류"는 고정 문구로 표시. */
    .rank-meta { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-cpu { font-family: var(--font-mono); font-weight: 800; font-size: 16px; flex: none; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1180px) {
        .layout { grid-template-columns: 1fr; }
        .summary-bar { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 720px) {
        .page { padding: 20px; }
        .card-grid { grid-template-columns: 1fr; }
        .summary-bar { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
    <!-- Shown only when this tab has no dbagent_token yet - GET /api/fleet_status needs one (same
         canAccessDb gate as everywhere else) or every instance falls back to a "조회 실패" card, which
         read as "모든 DB가 죽었다" rather than "로그인이 안 돼 있다" (사용자 피드백). -->
    <div class="test-banner" id="login-warning-banner" style="display:none; background: linear-gradient(90deg, rgba(208,59,59,0.22), rgba(208,59,59,0.05));">
        <span>⚠️</span>
        <span>로그인 정보가 없어 DB 상태를 조회할 수 없습니다 - 아래 카드는 전부 "조회 실패"로 보이는 게 정상입니다. <a href="index.html" style="color:#fff; font-weight:600;">index.html에서 먼저 로그인</a>한 뒤 이 탭에서 새로고침해주세요.</span>
    </div>

    <div class="page">
        <header class="top">
            <div class="brand">
                <div class="brand-icon" id="brand-icon"></div>
                <div class="brand-name">DB InsightFlow</div>
                <div class="header-divider"></div>
                <div class="page-title">Fleet Overview</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="refresh-btn" title="새로고침"></button>
                <button class="icon-btn" id="theme-toggle-btn" title="화면 배색 전환"></button>
                <button class="icon-btn" id="open-db-mgmt-btn" title="DB 관리" style="display:none;"></button>
                <div class="avatar" style="width: 30px; height: 30px; background: #ffffff; padding: 3px; box-sizing: border-box;">
                    <img src="KIPI_Symbol.jpg" alt="한국특허정보원 로고" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
            </div>
        </header>

        <div class="summary-bar">
            <div class="summary-tile total"><div class="label">전체 DB</div><div class="value" id="sum-total">--</div></div>
            <div class="summary-tile good"><div class="label">정상</div><div class="value" id="sum-good">--</div></div>
            <div class="summary-tile warning"><div class="label">경고</div><div class="value" id="sum-warning">--</div></div>
            <div class="summary-tile critical"><div class="label">위험</div><div class="value" id="sum-critical">--</div></div>
        </div>

        <div class="layout">
            <div class="list-column">
                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="search-box">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="search-input" placeholder="DB명 검색">
                        </div>
                        <div class="chip active" data-status="all">전체 <span id="chip-count-all">0</span></div>
                        <div class="chip" data-status="down"><span class="dot"></span>위험 <span id="chip-count-down">0</span></div>
                        <div class="chip" data-status="degraded"><span class="dot"></span>경고 <span id="chip-count-degraded">0</span></div>
                        <div class="chip" data-status="alive"><span class="dot"></span>정상 <span id="chip-count-alive">0</span></div>
                    </div>
                    <div class="view-toggle">
                        <button id="view-card-btn" class="active">카드</button>
                        <button id="view-table-btn">테이블</button>
                    </div>
                </div>

                <div class="card-grid" id="card-grid"></div>

                <div class="db-table-wrap" id="table-wrap">
                    <table class="db-table">
                        <thead>
                            <tr>
                                <th>상태</th>
                                <th>DB명</th>
                                <th>그룹</th>
                                <th>Active Session</th>
                                <th>분당 트랜잭션</th>
                                <th>CPU</th>
                                <th>Uptime</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>

            <div class="insight-column">
                <div class="insight-panel">
                    <h3>주의 필요 Top 5</h3>
                    <div class="insight-sub">CPU 기준 · 검색/필터와 무관하게 전체 DB 기준</div>
                    <div id="top5-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // Logged-in but not permitted (사용자 결정: Fleet Overview는 admin이거나 계정 관리에서
            // 권한을 받은 계정만) - blocked here, before any of the page's own chrome/data-loading
            // runs, rather than relying only on /api/fleet_status's 403 (that alone would just leave
            // every card stuck showing a down-looking "조회 실패", which reads as a bug not a
            // permissions message). A visitor with no session at all still falls through to the
            // existing login-warning-banner below, same as before this permission existed.
            const sessionToken = sessionStorage.getItem('dbagent_token');
            const sessionRole = sessionStorage.getItem('dbagent_role');
            const sessionFleetOverview = sessionStorage.getItem('dbagent_fleet_overview') === 'true';
            if (sessionToken && sessionRole !== 'admin' && !sessionFleetOverview) {
                document.body.innerHTML = `
                    <div style="display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; padding:24px; font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;">
                        <div>
                            <h2 style="margin:0 0 8px;">Fleet Overview 접근 권한이 없습니다</h2>
                            <p style="color:var(--text-muted);">관리자에게 계정 관리 &gt; "Fleet Overview 접근 허용" 권한을 요청하세요.</p>
                            <a href="index.html" style="color:var(--brand); font-weight:600;">대시보드로 돌아가기</a>
                        </div>
                    </div>
                `;
                return;
            }

            const ENGINE_ICON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>';
            // lucide "activity" glyph, matching index.html 사이드바 로고(DB InsightFlow 좌측)의
            // 펄스 애니메이션 아이콘과 동일 - 사용자 요청(2026-08-29)으로 헤더 brand-icon에도 적용.
            const ACTIVITY_ICON_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon-pulse"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg>';
            const WARNING_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
            const REFRESH_ICON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>';
            // Same "palette" glyph index.html's own theme-toggle button uses (via lucide's data-lucide="palette"),
            // just inlined as a raw SVG string to match this page's own icon-loading style (no lucide.js here).
            const PALETTE_ICON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"></path><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>';
            // lucide "database" glyph, matching index.html gear-dropdown's "DB 관리" item icon.
            const DB_MGMT_ICON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg>';

            document.getElementById('brand-icon').innerHTML = ACTIVITY_ICON_SVG;
            document.getElementById('refresh-btn').innerHTML = REFRESH_ICON_SVG;
            document.getElementById('theme-toggle-btn').innerHTML = PALETTE_ICON_SVG;
            // 2026-08-28 사용자 요청: index.html의 화면배색 버튼과 동일한 방식 - 클릭 시
            // data-theme="light" 슬롯(리팩토링 이전 네이비 다크 배색)과 기본 다크 배색을 토글.
            // 예전엔 여기서 location.reload()를 했는데, 이 페이지 색상은 전부 CSS 변수라 속성만
            // 바꿔도 즉시 다시 칠해짐 - 리로드는 현재 조회/필터 상태만 날리는 부작용이었음
            // (index.html의 동일 버튼에서 발견된 문제, 2026-08-29 - 여기도 같은 패턴이라 함께 수정).
            document.getElementById('theme-toggle-btn').addEventListener('click', () => {
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                const next = isLight ? 'dark' : 'light';
                localStorage.setItem('dbagent_theme', next);
                if (next === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            });

            // DB 관리 진입 (사용자 요청, 2026-08-29): index.html 톱니바퀴 메뉴의 "DB 관리"와 동일하게
            // db-mgmt.html을 팝업으로 연다. db-mgmt.html은 opener DOM을 읽지 않고 window.opener가
            // 살아있는지만 확인한 뒤 저장 시 opener.location.reload()만 호출하는 완전 독립형 팝업이라
            // (account-mgmt.html/menu-visibility.html과 달리 index.html 전용 DOM에 의존하지 않음),
            // 이 페이지에서 열어도 안전하게 동작한다 - 계정 관리/메뉴 표시 설정은 opener의 index.html
            // 전용 DOM(top-nav, #db-groups-container)을 읽어서 FO에서 열면 빈 목록이 뜨므로 제외.
            const dbMgmtBtn = document.getElementById('open-db-mgmt-btn');
            dbMgmtBtn.innerHTML = DB_MGMT_ICON_SVG;
            if (sessionRole === 'admin') dbMgmtBtn.style.display = 'flex';
            dbMgmtBtn.addEventListener('click', () => {
                const popup = window.open('db-mgmt.html', 'dbagent_db_mgmt', 'width=980,height=820,resizable=yes,scrollbars=yes');
                if (popup) popup.focus();
            });

            const STATUS_META = {
                alive: { label: 'ALIVE', color: 'var(--status-good)', pulse: true },
                degraded: { label: 'DEGRADED', color: 'var(--status-warning)', pulse: true },
                down: { label: 'NOT ALIVE', color: 'var(--status-critical)', pulse: false }
            };
            const STATUS_RANK = { down: 0, degraded: 1, alive: 2 };

            // DB 정보(SID)/DB 종류/버전 표시줄 (사용자 요청, 2026-08-29/30) - "SID : ORCL[Oracle 21c]"
            // 형식. SID는 d.sid(=/api/config, 항상 있음), 코드네임은 d.versionCodename(=/api/
            // fleet_status가 v$version.banner에서 뽑아온 "21c"/"11g" 식 표기, 접속 성공 후에만
            // 채워짐 - MonitorService.getFleetStatus 참고)을 우선 쓰고, 못 뽑았으면 raw 버전
            // 문자열(d.version)로 대체한다. withType=true(Top 5 패널)면 버전을 아직 모를 때도
            // "[Oracle]"만 표시 - 카드 쪽은 engine-icon이 이미 종류를 시각적으로 나타내므로 생략.
            function metaText(d, withType) {
                if (!d.sid) return '';
                const codename = d.versionCodename || d.version;
                if (codename) return `SID : ${d.sid}[Oracle ${codename}]`;
                return withType ? `SID : ${d.sid}[Oracle]` : `SID : ${d.sid}`;
            }

            function barColor(pct) {
                if (pct > 80) return 'var(--status-critical)';
                if (pct >= 60) return 'var(--status-warning)';
                return 'var(--status-good)';
            }

            // Uptime ring: a vivid multi-stop gradient stroke (사용자 요청: "색은 화려하게") rather
            // than a status/metric color, since this is meant to read as a distinct "headline" stat
            // on the card, not blend in with the status-strip/CPU-MEM bar coloring. Each card needs
            // its own <linearGradient> id - SVG gradient ids are page-global, so two cards reusing the
            // same id would silently both render whichever def parses last.
            const UPTIME_RING_R = 26;
            const UPTIME_RING_CIRC = 2 * Math.PI * UPTIME_RING_R;
            function uptimeRingSvg(d) {
                const gradId = `uptimeGrad-${String(d.id).replace(/[^a-zA-Z0-9_-]/g, '')}`;
                const pct = d.uptimePct != null ? Math.min(100, Math.max(0, d.uptimePct)) : 0;
                const offset = UPTIME_RING_CIRC * (1 - pct / 100);
                return `
                    <svg class="uptime-ring" width="68" height="68" viewBox="0 0 64 64">
                        <defs>
                            <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#2dd4bf"/>
                                <stop offset="35%" stop-color="#8b5cf6"/>
                                <stop offset="70%" stop-color="#f472b6"/>
                                <stop offset="100%" stop-color="#fb923c"/>
                            </linearGradient>
                        </defs>
                        <circle cx="32" cy="32" r="${UPTIME_RING_R}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="7"/>
                        ${d.uptimePct != null ? `<circle cx="32" cy="32" r="${UPTIME_RING_R}" fill="none" stroke="url(#${gradId})" stroke-width="7"
                            stroke-linecap="round" stroke-dasharray="${UPTIME_RING_CIRC}" stroke-dashoffset="${offset}"
                            transform="rotate(-90 32 32)"/>` : ''}
                    </svg>
                `;
            }

            let allDbs = [];
            let activeStatusFilter = 'all';
            let activeView = 'card';
            // Overwritten from /api/config's fleet_overview_polling_interval_ms once loadDbs() runs -
            // this fallback only matters if that fetch fails before the value is ever read.
            let fleetOverviewPollingIntervalMs = 3000;

            // Real data: /api/config gives the DB list (name/group/id), /api/fleet_status gives the
            // live status/CPU/MEM/session/lock-wait/uptime snapshot (MonitorService.getFleetStatus,
            // checked concurrently across all instances - see MonitorController.fleetStatus). Fetched
            // in parallel and joined by id client-side rather than having one endpoint do both, so the
            // (already public, unauthenticated) DB list still renders even if fleet_status fails.
            async function loadDbs() {
                const token = sessionStorage.getItem('dbagent_token') || '';
                document.getElementById('login-warning-banner').style.display = token ? 'none' : 'flex';

                // Render panels immediately from the fast, public DB list (/api/config) - each one
                // shows a "접속중..." spinner in place of status/metrics - instead of leaving the
                // whole page blank until /api/fleet_status finishes, which can take several seconds
                // (bounded by the slowest down DB's connect timeout, not the fastest) (사용자 요청).
                const configData = await (await fetch('/api/config')).json();
                if (configData.fleet_overview_polling_interval_ms) {
                    fleetOverviewPollingIntervalMs = configData.fleet_overview_polling_interval_ms;
                }
                allDbs = [];
                (configData.groups || []).forEach(group => {
                    (group.instances || []).forEach(inst => {
                        allDbs.push(Object.assign({ group_name: group.group_name }, inst, { loading: true }));
                    });
                });
                render();

                await refreshFleetStatus();
            }

            // Re-polls just the live status/CPU/MEM/etc for the already-loaded DB list - no /api/config
            // re-fetch, no reset back to the "loading" spinner state - so periodic auto-refresh updates
            // the existing cards in place instead of flashing them back to loading every cycle. Used by
            // both loadDbs()'s initial fetch and the visibility-gated setInterval below (사용자 요청:
            // 화면이 실제로 열려있을 때만 자동 갱신, 주기는 dbagent.fleet-overview.polling-interval-ms).
            async function refreshFleetStatus() {
                const token = sessionStorage.getItem('dbagent_token') || '';
                // Distinguish "this whole tab isn't logged in yet" (all instances missing - see the
                // banner above) from "this specific DB is restricted for the logged-in account" -
                // otherwise a not-logged-in visitor sees N copies of a message that sounds like N
                // individually-broken databases (사용자 피드백).
                const fallbackMessage = token
                    ? '상태 조회 실패 - 이 계정에 접근 권한이 없는 DB일 수 있습니다.'
                    : '로그인이 필요합니다.';
                let statusById = {};
                try {
                    const statusRes = await fetch(`/api/fleet_status?token=${encodeURIComponent(token)}`);
                    const statusList = statusRes.ok ? await statusRes.json() : [];
                    statusList.forEach(s => { statusById[s.id] = s; });
                } catch (e) {
                    // leave statusById empty - every instance falls back to fallbackMessage below
                }
                allDbs = allDbs.map(d => {
                    const status = statusById[d.id] || { status: 'down', errorMessage: fallbackMessage };
                    return Object.assign({}, d, status, { loading: false });
                });
                render();
            }

            function sortByRisk(list) {
                return list.slice().sort((a, b) => {
                    const r = STATUS_RANK[a.status] - STATUS_RANK[b.status];
                    if (r !== 0) return r;
                    return (b.cpuPct || 0) - (a.cpuPct || 0);
                });
            }

            function renderSummary() {
                const counts = { alive: 0, degraded: 0, down: 0 };
                allDbs.forEach(d => { if (d.status in counts) counts[d.status]++; }); // status undefined while loading
                document.getElementById('sum-total').textContent = allDbs.length;
                const goodEl = document.getElementById('sum-good');
                const warnEl = document.getElementById('sum-warning');
                const critEl = document.getElementById('sum-critical');
                goodEl.textContent = counts.alive;
                goodEl.classList.toggle('muted', counts.alive === 0);
                warnEl.textContent = counts.degraded;
                warnEl.classList.toggle('muted', counts.degraded === 0);
                critEl.textContent = counts.down;
                critEl.classList.toggle('muted', counts.down === 0);
                document.getElementById('chip-count-all').textContent = allDbs.length;
                document.getElementById('chip-count-alive').textContent = counts.alive;
                document.getElementById('chip-count-degraded').textContent = counts.degraded;
                document.getElementById('chip-count-down').textContent = counts.down;
            }

            function renderTop5() {
                const top5 = sortByRisk(allDbs).filter(d => d.cpuPct != null).sort((a, b) => (b.cpuPct || 0) - (a.cpuPct || 0)).slice(0, 5);
                const el = document.getElementById('top5-list');
                if (!top5.length) {
                    el.innerHTML = '<div style="color:var(--text-muted); font-size:12px; padding:10px 0;">표시할 DB가 없습니다.</div>';
                    return;
                }
                el.innerHTML = top5.map((d, i) => `
                    <div class="rank-row" data-db-id="${d.id}">
                        <div class="rank-num">${i + 1}</div>
                        <div class="rank-info">
                            <div class="rank-name">${d.name}</div>
                            <div class="rank-sub">${d.group_name}</div>
                            <div class="rank-meta">${metaText(d, true)}</div>
                        </div>
                        <div class="rank-cpu" style="color:${barColor(d.cpuPct)}">${d.cpuPct}%</div>
                    </div>
                `).join('');
                el.querySelectorAll('.rank-row').forEach(row => row.addEventListener('click', onDbClick));
            }

            function matchesFilters(d, query) {
                if (activeStatusFilter !== 'all' && d.status !== activeStatusFilter) return false;
                if (query && !d.name.toLowerCase().includes(query)) return false;
                return true;
            }

            function cardHtml(d) {
                if (d.loading) {
                    return `
                        <div class="db-card" data-db-id="${d.id}" style="border-left-color: var(--border);">
                            <div class="card-head">
                                <div class="card-head-left">
                                    <div class="engine-icon pulse">${ENGINE_ICON_SVG}</div>
                                    <div class="card-name-block">
                                        <div class="db-name">${d.name}</div>
                                        <div class="db-meta">${metaText(d)}</div>
                                    </div>
                                </div>
                                <div class="group-badge">${d.group_name}</div>
                            </div>
                            <div class="loading-row"><div class="spinner"></div><span>접속중...</span></div>
                        </div>
                    `;
                }
                const meta = STATUS_META[d.status];
                // CPU isn't repeated here - it's already shown as the mini-bar below (사용자 피드백:
                // "아래 그래프에 CPU/MEM 있으니 CPU 문구 빼도 될거 같다"), so this row only carries
                // the two stats that have no other representation on the card.
                const statCells = d.status === 'down'
                    ? `<div class="stat-cell"><div class="stat-label">Active Session</div><div class="stat-value muted">—</div></div>
                       <div class="stat-cell"><div class="stat-label">분당 트랜잭션</div><div class="stat-value muted">—</div></div>`
                    : `<div class="stat-cell"><div class="stat-label">Active Session</div><div class="stat-value">${d.activeSession}</div></div>
                       <div class="stat-cell"><div class="stat-label">분당 트랜잭션</div><div class="stat-value">${d.txnPerMin}</div></div>`;
                // Card shows a short generic label, not the full ORA-/tnsnames detail (사용자 피드백:
                // 카드에 너무 상세한 에러 문구가 떠 있음) - the full backend message is still there as
                // a native tooltip (title attr) for anyone who hovers to check.
                const bars = d.status === 'down'
                    ? `<div class="down-banner" title="${(d.errorMessage || '').replace(/"/g, '&quot;')}">${WARNING_ICON_SVG}<span>연결할 수 없습니다</span></div>`
                    : `<div class="mini-bar-row">
                           <span class="mb-label">CPU</span>
                           <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${d.cpuPct}%; background:${barColor(d.cpuPct)};"></div></div>
                           <span class="mb-pct">${d.cpuPct}%</span>
                       </div>
                       <div class="mini-bar-row">
                           <span class="mb-label">MEM</span>
                           <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${d.memPct}%; background:${barColor(d.memPct)};"></div></div>
                           <span class="mb-pct">${d.memPct}%</span>
                       </div>`;
                return `
                    <div class="db-card status-${d.status}" data-db-id="${d.id}">
                        <div class="card-head">
                            <div class="card-head-left">
                                <div class="engine-icon${d.status === 'down' ? '' : ' pulse'}">${ENGINE_ICON_SVG}</div>
                                <div class="card-name-block">
                                    <div class="db-name">${d.name}</div>
                                    <div class="db-meta">${metaText(d)}</div>
                                </div>
                            </div>
                            <div class="group-badge">${d.group_name}</div>
                        </div>
                        <div class="status-row">
                            <span class="status-dot ${meta.pulse ? 'pulse' : ''}" style="background:${meta.color}; color:${meta.color};"></span>
                            <span class="status-label" style="color:${meta.color};">${meta.label}</span>
                            ${d.statusNote ? `<span class="status-note">${d.statusNote}</span>` : ''}
                        </div>
                        <div class="uptime-row">
                            ${uptimeRingSvg(d)}
                            <div class="uptime-text">
                                <div class="uptime-label">Uptime(%)</div>
                                <div class="uptime-value">${d.uptimePct != null ? d.uptimePct.toFixed(2) : '—'}${d.uptimePct != null ? '%' : ''}</div>
                            </div>
                        </div>
                        <div class="stat-row">${statCells}</div>
                        ${bars}
                    </div>
                `;
            }

            function tableRowHtml(d) {
                if (d.loading) {
                    return `
                        <tr data-db-id="${d.id}">
                            <td colspan="2"><div class="loading-row" style="padding:0;"><div class="spinner"></div><span>접속중...</span></div></td>
                            <td>${d.group_name}</td>
                            <td>—</td><td>—</td><td>—</td><td>—</td>
                        </tr>
                    `;
                }
                const meta = STATUS_META[d.status];
                const cpuText = d.cpuPct != null ? `${d.cpuPct}%` : '—';
                const cpuColor = d.cpuPct == null ? 'var(--text-muted)' : barColor(d.cpuPct);
                const uptimeText = d.uptimePct != null ? `${d.uptimePct.toFixed(2)}%` : '—';
                return `
                    <tr data-db-id="${d.id}">
                        <td><span class="table-status" style="color:${meta.color}"><span class="status-dot ${meta.pulse ? 'pulse' : ''}" style="background:${meta.color}; color:${meta.color};"></span>${meta.label}</span></td>
                        <td><div class="table-name">${d.name}</div></td>
                        <td>${d.group_name}</td>
                        <td>${d.activeSession != null ? d.activeSession : '—'}</td>
                        <td>${d.txnPerMin != null ? d.txnPerMin : '—'}</td>
                        <td style="color:${cpuColor}; font-family:var(--font-mono); font-weight:600;">${cpuText}</td>
                        <td style="font-family:var(--font-mono);">${uptimeText}</td>
                    </tr>
                `;
            }

            function onDbClick(e) {
                const id = e.currentTarget.getAttribute('data-db-id');
                // index.html reads ?db_id=... on load and auto-selects that instance instead of its
                // usual "first non-restricted instance" default - see app.js's jumpToDbId handling
                // in the "Load config and build tree" block.
                window.location.href = `index.html?db_id=${encodeURIComponent(id)}`;
            }

            function render() {
                const query = document.getElementById('search-input').value.trim().toLowerCase();
                // Card/table order follows databases.json's own group/instance order (사용자 요청)
                // rather than risk-sorting - allDbs is already in that order since loadDbs() builds it
                // by walking /api/config's groups/instances in sequence. Top 5 (renderTop5) still
                // risk-sorts on purpose - that panel's whole point is surfacing the worst DBs
                // regardless of how this list is ordered or filtered.
                const filtered = allDbs.filter(d => matchesFilters(d, query));

                renderSummary();
                renderTop5();

                const grid = document.getElementById('card-grid');
                const tbody = document.getElementById('table-body');
                if (!filtered.length) {
                    grid.innerHTML = '<div class="empty-state">조건에 맞는 DB가 없습니다.</div>';
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--text-muted);">조건에 맞는 DB가 없습니다.</td></tr>';
                } else {
                    grid.innerHTML = filtered.map(cardHtml).join('');
                    tbody.innerHTML = filtered.map(tableRowHtml).join('');
                }
                grid.querySelectorAll('.db-card').forEach(el => el.addEventListener('click', onDbClick));
                tbody.querySelectorAll('tr[data-db-id]').forEach(el => el.addEventListener('click', onDbClick));
            }

            document.getElementById('search-input').addEventListener('input', render);
            document.querySelectorAll('.chip[data-status]').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.chip[data-status]').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    activeStatusFilter = chip.getAttribute('data-status');
                    render();
                });
            });
            document.getElementById('view-card-btn').addEventListener('click', () => setView('card'));
            document.getElementById('view-table-btn').addEventListener('click', () => setView('table'));
            function setView(view) {
                activeView = view;
                document.getElementById('view-card-btn').classList.toggle('active', view === 'card');
                document.getElementById('view-table-btn').classList.toggle('active', view === 'table');
                document.getElementById('card-grid').style.display = view === 'card' ? 'grid' : 'none';
                document.getElementById('table-wrap').style.display = view === 'table' ? 'block' : 'none';
            }
            document.getElementById('refresh-btn').addEventListener('click', loadDbs);

            // Auto-refresh, gated on the Page Visibility API (사용자 요청: 화면이 실제로 열려있을 때만
            // 자동 갱신) - a backgrounded/minimized tab stops firing fleet_status calls entirely instead
            // of polling somewhere nobody's looking, and picks back up (with an immediate refresh, not
            // just resuming the timer) the moment the tab is visible again.
            let fleetPollTimer = null;
            function startFleetPolling() {
                stopFleetPolling();
                fleetPollTimer = setInterval(refreshFleetStatus, fleetOverviewPollingIntervalMs);
            }
            function stopFleetPolling() {
                if (fleetPollTimer) {
                    clearInterval(fleetPollTimer);
                    fleetPollTimer = null;
                }
            }
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    stopFleetPolling();
                } else {
                    refreshFleetStatus();
                    startFleetPolling();
                }
            });

            setView('card');
            loadDbs().then(() => {
                if (!document.hidden) startFleetPolling();
            });
        })();
    </script>
</body>
</html>
