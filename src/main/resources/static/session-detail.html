<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세션 상세정보</title>
    <link rel="stylesheet" href="style.css?v=55">
    <link rel="stylesheet" href="popup.css?v=1">
    <script>
        // Match the main app's saved theme choice so this popup doesn't clash when kept open
        // side-by-side with the dashboard on a second monitor.
        (function () {
            const saved = localStorage.getItem('dbagent_theme') || 'dark';
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
</head>
<body class="pp-body">
    <!-- G1(4-3) 세션 상세 = G2 팝업 통일 스펙(popup.css)의 기준 사례 -->
    <div id="content" class="pp-root">불러오는 중...</div>
    <script>
        (function () {
            function getToken() { return sessionStorage.getItem('dbagent_token') || ''; }
            function qs(name) { return new URLSearchParams(window.location.search).get(name) || ''; }
            const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const val = (v) => (v === null || v === undefined || v === '' ? '-' : String(v));

            const dbId = qs('db_id');
            const sid = qs('sid');
            const serial = qs('serial');
            const sqlId = qs('sql_id');
            const contentEl = document.getElementById('content');

            if (!getToken()) {
                contentEl.innerHTML = '<h3 class="pp-error">인증 정보가 없습니다. 메인 화면에서 다시 열어주세요.</h3>';
                return;
            }

            function cell(label, v, cls) {
                const t = val(v);
                return `<th>${esc(label)}</th><td title="${esc(t)}"${cls ? ` class="${cls}"` : ''}>${esc(t)}</td>`;
            }

            function infoTable(r) {
                const sidSpid = r.spid ? `${val(r.sid)}.${r.spid}` : val(r.sid);
                const st = r.status ? String(r.status).toUpperCase() : '';
                const stCls = st === 'ACTIVE' ? 'pp-ok' : (st ? 'pp-muted' : '');
                const stText = st === 'ACTIVE' ? 'Active' : (st === 'INACTIVE' ? 'InActive' : (st || (r.session_state === 'ENDED' ? '종료됨' : '')));
                return '<table class="pp-kv"><tbody>' +
                    '<tr>' + cell('SID.SPID', sidSpid) + cell('Serial Number', r.serial) + cell('Program', r.program) + cell('Machine', r.machine) + '</tr>' +
                    '<tr>' + cell('OS User', r.osuser) + cell('DB User', r.username) + cell('Command', r.command) + cell('Status', stText, stCls) + '</tr>' +
                    '<tr>' + cell('Module', r.module) + cell('Logon Time', r.logon_time) + cell('SQL ID', r.sql_id) + cell('Hash Value', r.hash_value) + '</tr>' +
                    '</tbody></table>';
            }

            function bindsTable(binds) {
                if (!binds || !binds.length) return '<div class="pp-empty">바인드 변수 정보가 없습니다.</div>';
                return '<table class="pp-table"><thead><tr><th>Name</th><th>Position</th><th>Type</th><th>Value</th><th>Captured At</th></tr></thead><tbody>' +
                    binds.map(b => `<tr><td>${esc(val(b.name))}</td><td>${esc(val(b.position))}</td><td>${esc(val(b.datatype))}</td>` +
                        `<td class="em">${esc(b.value == null ? 'NULL' : b.value)}</td><td>${esc(val(b.last_captured))}</td></tr>`).join('') +
                    '</tbody></table>';
            }

            fetch(`/api/session_query?db_id=${encodeURIComponent(dbId)}&sid=${encodeURIComponent(sid)}&serial=${encodeURIComponent(serial)}&sql_id=${encodeURIComponent(sqlId)}&token=${encodeURIComponent(getToken())}`)
                .then(res => res.json())
                .then(result => {
                    if (result.error) {
                        contentEl.innerHTML = `<h3 class="pp-error">오류 발생</h3><p>${esc(result.error)}</p>`;
                        return;
                    }
                    document.title = `세션 상세정보 (SID: ${result.sid})`;
                    const note = result.session_state === 'ENDED'
                        ? '<span class="pp-note">세션이 이미 종료되어 ASH 마지막 기록으로 표시합니다(SPID·OS User·Command·Status·Logon Time 없음).</span>' : '';

                    contentEl.innerHTML = `
                        <div class="pp-head">
                            <h3>세션 상세정보 (SID: ${esc(val(result.sid))})</h3>${note}
                            <span class="pp-actions"><button type="button" id="jump-to-tuning-btn" class="pp-btn primary">Tuning</button></span>
                        </div>
                        ${infoTable(result)}
                        <div class="pp-tabs">
                            <div class="pp-tab-headers" role="tablist">
                                <button type="button" class="pp-tab-btn active" data-tab="sql" role="tab">SQL Text</button>
                                <button type="button" class="pp-tab-btn" data-tab="plan" role="tab">DBMS Plan</button>
                                <button type="button" class="pp-tab-btn" data-tab="bind" role="tab">Bind Variable</button>
                            </div>
                            <div class="pp-tab-body">
                                <div id="tab-sql" class="sess-tab"><pre class="pp-pre wrap">${esc(result.sql_fulltext || 'SQL 텍스트가 없습니다.')}</pre></div>
                                <div id="tab-plan" class="sess-tab" style="display: none;"><pre class="pp-pre plan">${esc(result.plan_text || '실행 계획 정보가 없습니다.')}</pre></div>
                                <div id="tab-bind" class="sess-tab" style="display: none;">${bindsTable(result.binds)}</div>
                            </div>
                        </div>
                    `;

                    document.querySelectorAll('.pp-tab-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.sess-tab').forEach(el => el.style.display = 'none');
                            document.querySelectorAll('.pp-tab-btn').forEach(el => el.classList.toggle('active', el === btn));
                            document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
                        });
                    });

                    const jumpBtn = document.getElementById('jump-to-tuning-btn');
                    if (jumpBtn) {
                        jumpBtn.addEventListener('click', () => {
                            if (!window.opener || window.opener.closed) {
                                alert('메인 화면이 닫혀 있어 이동할 수 없습니다.');
                                return;
                            }
                            if (typeof window.opener.openSqlTuningFromPopup === 'function') {
                                window.opener.openSqlTuningFromPopup(result.sql_fulltext, result.hash_value, result.binds, result.plan_text);
                            }
                            window.opener.focus();
                            window.close();
                        });
                    }
                })
                .catch(err => {
                    contentEl.innerHTML = `<h3 class="pp-error">오류 발생</h3><p>${esc(err.message)}</p>`;
                });
        })();
    </script>
</body>
</html>
