server.port=8005

# App users DB (auth) - equivalent of Python's users.db. H2 file DB (pure Java - unlike sqlite-jdbc's
# per-platform native lib, this runs on AIX without a platform-specific build). File becomes users.mv.db.
spring.datasource.url=jdbc:h2:file:./users
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# SQLite did not handle concurrent writers well, hence the pool-size-1 workaround; H2 doesn't have
# that limitation, but this app's write volume is low enough that there's no reason to raise it.
spring.datasource.hikari.maximum-pool-size=1
# 로그인 세션(sessions 테이블, 계정당 멀티세션 지원) 만료 기간(일). 로그아웃을 안 눌러도 이 기간이
# 지나면 토큰이 자동 만료되고, 매일 새벽 3시 정리 작업(AuthService.cleanupExpiredSessions)이 해당
# 행을 실제로 삭제한다 - 로그아웃 없이 방치된 세션이 테이블에 무한정 쌓이는 것을 막기 위함.
dbagent.auth.session-ttl-days=30

# Multi-instance Oracle target config, relative to the app's working directory (see databases.json, oracle.env)
dbagent.databases-config=databases.json
dbagent.oracle-env-path=oracle.env
# Directory containing tnsnames.ora, used when an instance's "host" is blank (SID/alias-based lookup, incl. RAC).
# Left blank on purpose: TnsAdminInitializer derives {ORACLE_HOME}\network\admin from oracle.env's
# ORACLE_HOME line when this isn't set, so moving networks only requires editing oracle.env (same as
# the Python app), not this file or a rebuild. Set this explicitly only if tnsnames.ora lives somewhere
# ORACLE_HOME doesn't point to.
dbagent.oracle.tns-admin=
# Max time to establish a new Oracle connection before giving up (ms). 500ms worked against a
# localhost DB on the dev machine, but real network latency (esp. the first connection, which also
# pays JDBC driver classloading cost) can easily exceed that and cause false "down" failures. 3000ms
# is a safer default for real networks; override via an external application.properties placed next
# to the jar (same directory) if the real observed latency needs a different value - no rebuild needed.
dbagent.oracle.connect-timeout-ms=3000
# 이미 연결된 커넥션에서 쿼리 응답의 다음 바이트를 기다리는 최대 시간(ms, oracle.net.READ_TIMEOUT).
# 위 connect-timeout-ms(접속 수립 한도)와는 목적이 다르므로 반드시 별도로 잡아야 한다 - 짧은
# 접속 타임아웃 값을 여기에 재사용했더니 AWR/ASH 조회나 SQL 정합성/튜닝처럼 원래 오래 걸리는
# 쿼리가 "DB 접속 불가"로 오인되어 전부 죽는 문제가 있었다(폐쇄망 사용자 피드백).
# 실제 쿼리는 TCP 접속과 달리 자연스러운 상한이 없어 넉넉하게 잡는다.
dbagent.oracle.read-timeout-ms=60000
# HikariCP pool size defaults, used for any databases.json instance that doesn't set its own
# pool_min_idle/pool_max_size. Per-instance values in databases.json always take priority over these.
dbagent.oracle.pool.min-idle=2
dbagent.oracle.pool.max-size=10
# Hard ceiling (seconds) on GET /api/fleet_status's per-instance status check. Bounds cases the
# connect-timeout above doesn't cover (e.g. DNS resolution hanging before the socket connect even
# starts) so one slow/unreachable instance can't hold up the rest of the Fleet Overview screen -
# past this it just reports "down" for that instance instead of waiting longer.
dbagent.fleet-status.timeout-seconds=5

# ── RDB(MySQL / MariaDB / PostgreSQL / MS SQL Server / CUBRID) 커넥션 풀 ──
# com.dbagent.rdb.RdbConnectionPoolManager 전용 설정. Oracle 경로(com.dbagent.oracle)와 완전히
# 분리된 별도 풀이라 위 dbagent.oracle.* 값의 영향을 받지 않는다. 두 계열을 따로 튜닝할 수 있도록
# 일부러 나눠 둔 것이므로, Oracle 쪽 값을 바꿀 때 이쪽도 같이 봐야 하는지 매번 확인할 것.
# 새 RDB 커넥션을 수립하는 최대 시간(ms).
dbagent.rdb.connect-timeout-ms=2000
# 이미 연결된 커넥션에서 쿼리가 블로킹될 수 있는 최대 시간(ms). Oracle의 read-timeout과 같은 목적이다.
# 이 값이 없으면 응답 없는 서버 하나가 호출 스레드와 점유 중인 커넥션을 영구히 붙잡는다 - 풀 크기
# 기본값이 5라, 같은 인스턴스에 이런 hang이 5번만 발생하면 DB가 복구된 뒤에도 그 인스턴스의 풀이
# 영구 고갈된다(멈춘 커넥션이 반납되지 않으므로).
dbagent.rdb.read-timeout-ms=60000
# HikariCP 풀 크기 기본값. databases.json의 해당 인스턴스가 pool_min_idle / pool_max_size를
# 지정한 경우 그 값이 항상 우선한다(Oracle 풀과 동일한 규칙).
dbagent.rdb.pool.min-idle=1
dbagent.rdb.pool.max-size=5

# Dashboard auto-refresh interval (ms), read once by app.js from GET /api/config on page load.
# 1000ms proved too tight - concurrent polling across widgets/tabs could exhaust the connection pool
# and misreport a healthy DB as down. 2000-5000 is a safer default.
dbagent.ui.polling-interval-ms=2000

# Fleet Overview auto-refresh interval (ms), read once by fleet-overview.html on page
# load. Only runs while the tab is actually visible (Page Visibility API) - backgrounded tabs stop
# polling entirely instead of wasting fleet_status calls nobody's looking at.
dbagent.fleet-overview.polling-interval-ms=3000

# AI DBA (RAG-lite: regex + H2 retrieval, Ollama generation). H2 file base path (no extension -
# ErrorSearchService resolves the actual data/oracle_errors.mv.db file from this).
aidba.errors-db-path=data/oracle_errors
# GPU 서버 방화벽이 REST API 포트(9300, sqlrestapi)만 열어주는 구성으로 확정되면서(2026-09-11)
# Ollama(11434)에는 AIX에서 더 이상 직접 못 붙는다 - 이 값은 이제 sqlrestapi의 베이스 URL이다.
# 모델명은 sqlrestapi 쪽(sqltune.llm.model) 설정을 따르므로 여기엔 없다(과거 aidba.ollama.model
# 프로퍼티 제거). 프로퍼티 이름 자체는 과거 호환을 위해 그대로 유지.
aidba.ollama.url=http://localhost:9300
# 응답 대기 시간(ms). 원격 GPU 서버는 로컬보다 네트워크 왕복 + 모델 로딩 시간이 더 걸릴 수 있어 넉넉하게 설정.
aidba.ollama.timeout-ms=30000

# SQL 정합성/튜닝 (자체 파인튜닝 Qwen2.5-Coder-7B QLoRA 어댑터를 서빙하는 FastAPI 서버 호출).
# SqlTuningService도 순수 HTTP(JSON) 호출이라 서버가 어디서 도는지는 무관하다. 위 aidba.ollama.url과
# 같은 이유로 AIX엔 이 모델 서버를 직접 못 올리므로, 사내망에서 접근 가능한 GPU 서버 주소로 바꿔서
# 사용할 것 (예: http://192.168.x.x:8010). 기본값이 localhost라 설정을 빠뜨리면 조용히 실패한다.
sqltuning.api.url=http://localhost:8010
# 튜닝 모델 서버의 응답을 기다리는 최대 시간(ms). 프롬프트 길이와 GPU 서버 성능에 따라 응답
# 시간 편차가 커서 설정으로 분리했다(과거에는 180초 하드코딩). 원격 GPU 서버로 옮기거나 더 큰
# 모델로 바꾸면 재조정이 필요할 수 있다.
sqltuning.api.timeout-ms=180000

# SQL Tune Advisor (사내 튜닝 사례 RAG 검색 + LLM 분석, sqltune-rag-java/RAGController 호출).
# sqltuning.* (자체 파인튜닝 sLLM)과는 별개의 서버/연동이다 - 이쪽은 bge-m3 임베딩으로 사내 튜닝
# 사례를 OpenSearch에서 검색한 뒤 그 사례를 근거로 qwen3-coder:30b가 답변한다. AIX에서도 사내망
# 접근 가능한 GPU 서버 주소로 바꿔서 사용할 것 (기본값 localhost라 빠뜨리면 조용히 실패한다).
sqltuneadvisor.api.url=http://localhost:9300
# GPU 서버 성능과 검색된 사내 사례 분량에 따라 응답 시간 편차가 커서 sqltuning.* 과 동일하게 설정으로 뺐다.
sqltuneadvisor.api.timeout-ms=180000

# SQL Runner (AI DBA 탭 위 "SQL 실행" - 기존 HikariCP 풀을 재사용해 임의 SQL 1문장을 실행).
# 브라우저 결과 그리드가 너무 커지거나 쿼리가 오래 걸리는 것을 막기 위한 상한값.
# max-rows는 사용자가 요청 시 건수를 지정하지 않았을 때 쓰는 기본값이고,
# max-rows-limit은 사용자가 지정하더라도 절대 넘을 수 없는 상한선입니다.
dbagent.sql-runner.max-rows=500
dbagent.sql-runner.max-rows-limit=5000
dbagent.sql-runner.timeout-seconds=30
