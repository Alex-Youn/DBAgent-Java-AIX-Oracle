server.port=8005

# 대상 DB 접속 비밀번호를 암호화하는 마스터 키 파일의 경로(oracle.env 제거 마이그레이션 6단계,
# 2026-09-21). 비워두면 작업 디렉터리의 dbagent.key를 쓰고, 그 파일이 없으면 최초 기동 시 자동
# 생성한다(운영자 조작 불필요). 환경변수 DBAGENT_MASTER_KEY가 있으면 그쪽이 우선한다.
# 이 키가 유출되면 등록된 모든 대상 DB 비밀번호가 복호화되므로, 운영 환경에서는 앱 디렉터리 밖
# (백업 스크립트가 훑지 않는 곳)의 경로를 명시적으로 지정하고 별도 장소에 사본 1부를 보관할 것.
# 키는 환경마다 독립이다 - dbconfig.mv.db만 다른 서버로 복사하면 복호화할 수 없다(의도된 동작).
# 폐쇄망 IBM J9 Java 8이 AES-256을 거부하면 자동으로 128비트 키를 만든다(MasterKeyProvider 참고).
dbagent.security.key-file=

# App users DB (auth) - equivalent of Python's users.db. H2 file DB (pure Java - unlike sqlite-jdbc's
# per-platform native lib, this runs on AIX without a platform-specific build). File becomes users.mv.db.
spring.datasource.url=jdbc:h2:file:./users
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# SQLite did not handle concurrent writers well, hence the original pool-size-1; H2's MVStore engine
# doesn't have that limitation. But pool-size-1 still means only one physical JDBC Connection exists
# for the whole app, so every caller (including AuthService.sessionForToken - every authenticated
# request's token check) serializes through it regardless of what H2 itself could handle. That became
# a real bottleneck once InstanceMetricSamplerService started writing metric samples from up to 4
# parallel threads (오케스트레이터 실측, 2026-09-18: 신규 대시보드 → 기존 대시보드 전환 시 busy) -
# raised to let sampler writes and request-time reads not queue behind each other.
# dbconfig.mv.db와 풀 크기를 10으로 통일(오케스트레이터 요청, 2026-09-21) - sessionForToken()이 모든
# 인증 요청마다 호출되는 고빈도 읽기 경로라 같은 이유로 여유를 둔다.
spring.datasource.hikari.maximum-pool-size=10
# LOCK_TIMEOUT(ms): dbconfig.mv.db와 동일 취지의 안전마진(락을 못 얻으면 즉시 예외 대신 재시도 대기).
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 5000
# 로그인 세션(sessions 테이블, 계정당 멀티세션 지원) 만료 기간(일). 로그아웃을 안 눌러도 이 기간이
# 지나면 토큰이 자동 만료되고, 매일 새벽 3시 정리 작업(AuthService.cleanupExpiredSessions)이 해당
# 행을 실제로 삭제한다 - 로그아웃 없이 방치된 세션이 테이블에 무한정 쌓이는 것을 막기 위함.
dbagent.auth.session-ttl-days=30

# 메트릭 이력(instance_metric_history) 전용 H2 - users DB(계정/세션)와 파일 자체를 분리해 경합을
# 원천 차단한다(오케스트레이터 요청, 2026-09-18, 원본 DBAgent-Java 대응 커밋 포팅). 샘플러가 60초마다
# 계속 쓰는 유일한 고빈도 쓰기 주체이고, 로그인/로그아웃/계정변경은 저빈도, 정리 크론은 하루 1번씩
# 시간도 분산돼 있어 이것만 분리해도 users DB 쪽 경합은 사실상 사라진다
# (com.dbagent.config.DataSourceConfig 참고). 파일은 metrics.mv.db가 된다.
dbagent.metrics.datasource.url=jdbc:h2:file:./metrics
dbagent.metrics.datasource.driver-class-name=org.h2.Driver
dbagent.metrics.datasource.username=sa
dbagent.metrics.datasource.password=
# 샘플러는 sampleAll() 안에서 순차로만 기록해 동시 쓰기 필요량은 1이지만, sampleNowAsync()(신규 DB
# 등록 즉시수집)가 정기 사이클과 겹칠 수 있는 유일한 동시 쓰기 지점이었다. 그러나 v2 대시보드의
# fetchMetricHistoryV2()도 폴링마다 이 풀에서 읽기 커넥션을 빌려가므로(dbconfig.mv.db와 같은 유형의
# 경합), users/dbconfig와 풀 크기를 10으로 통일한다(오케스트레이터 요청, 2026-09-21).
dbagent.metrics.datasource.hikari.maximum-pool-size=10
dbagent.metrics.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 5000

# 모니터링 대상 DB 목록(구 databases.json) 전용 H2 - oracle.env 제거 마이그레이션 4-1단계(2026-09-21,
# 원본 DBAgent-Java 대응 커밋 포팅)에서 파일 기반 저장을 DB로 이전. 첫 기동 시 루트의 databases.json이
# 있으면 db_instances 테이블로 1회성 마이그레이션하고, 이후로는 그 파일을 다시 읽지 않는다
# (DatabaseConfigService 참고). 파일은 dbconfig.mv.db가 된다.
# DEFRAG_ALWAYS=TRUE: 정상 종료 시 MVStore를 전체 재기록(defrag)한다. 6단계 재암호화로 덮어쓴
# 예전 B64(...) 값이 파일 안 옛 청크에 그대로 남는 것을 지우기 위함 - 실측(2026-09-21): 이 옵션
# 없이 정상 종료만 하면 B64 잔재가 그대로 남았고, 이 옵션을 켜면 0이 됐다. B64는 키 없이
# 디코딩되므로 안 지우면 "파일이 유출돼도 안전하다"는 암호화의 목적이 무너진다.
# main(SQLite)은 대응 수단이 VACUUM이라 코드에서 즉시 처리한다(purgeOldPageImages 참고).
dbagent.dbconfig.datasource.url=jdbc:h2:file:./dbconfig;DEFRAG_ALWAYS=TRUE
dbagent.dbconfig.datasource.driver-class-name=org.h2.Driver
dbagent.dbconfig.datasource.username=sa
dbagent.dbconfig.datasource.password=
# resolve()가 거의 모든 컨트롤러 진입부에서 호출되는 고빈도 읽기 경로인 데다, v2 대시보드 한 번
# 폴링에 fetchInstanceDashboardV2()가 6개 API를 Promise.all로 동시에 쏘면 그 6개 전부 이 풀에서
# 커넥션을 동시에 빌려간다(오케스트레이터 질문, 2026-09-21) - 기존 3은 그 시점에 바로 바닥나
# "환경설정 DB 리스트가 가끔 느리다"는 증상으로 이어졌다. 등록된 DB 개수(테이블 행 수) 자체는
# 인덱스 단건 조회라 거의 영향이 없고, 동시 열람 탭/사용자 수가 실제 병목이다 - 10이면 당분간 여유.
# main(원본, SQLite)과 값은 맞추되, H2 MVStore는 기본적으로 다중 읽기에 강해 journal_mode=WAL 같은
# 별도 설정은 필요 없다(main 쪽 WAL 설정에 대응되는 게 여기 없는 건 의도된 차이).
dbagent.dbconfig.datasource.hikari.maximum-pool-size=10
# LOCK_TIMEOUT(ms): H2에서 SQLite의 busy_timeout에 해당하는 설정 - 락을 못 얻으면 즉시 예외를
# 던지는 대신 이 시간만큼 기다렸다가 재시도한다. 풀을 키운 만큼(10) 커밋 순간과 겹칠 확률도 같이
# 올라가므로 안전마진으로 둔다(오케스트레이터 요청, 2026-09-21. main의 busy_timeout=5000과 동일 취지).
dbagent.dbconfig.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 5000
# Max time to establish a new Oracle connection before giving up (ms). 500ms worked against a
# localhost DB on the dev machine, but real network latency (esp. the first connection, which also
# pays JDBC driver classloading cost) can easily exceed that and cause false "down" failures. 3000ms
# is a safer default for real networks; override via an external application.properties placed next
# to the jar (same directory) if the real observed latency needs a different value - no rebuild needed.
dbagent.oracle.connect-timeout-ms=3000
# 이미 연결된 커넥션에서 쿼리 응답의 다음 바이트를 기다리는 최대 시간(ms, oracle.net.READ_TIMEOUT).
# 위 connect-timeout-ms(접속 수립 한도)와는 목적이 다르므로 반드시 별도로 잡아야 한다 - 짧은
# 접속 타임아웃 값을 여기에 재사용했더니 AWR/ASH 조회나 SQL 정합성/튜닝처럼 원래 오래 걸리는
# 쿼리가 "DB 접속 불가"로 오인되어 전부 죽는 문제가 있었다(폐쇄망 사용자 피드백).
# 실제 쿼리는 TCP 접속과 달리 자연스러운 상한이 없어 넉넉하게 잡는다.
dbagent.oracle.read-timeout-ms=60000
# HikariCP pool size defaults, used for any databases.json instance that doesn't set its own
# pool_min_idle/pool_max_size. Per-instance values in databases.json always take priority over these.
dbagent.oracle.pool.min-idle=2
dbagent.oracle.pool.max-size=10
# v$lock 스캔(Current Session 세션 리스트의 TX/TM Lock 집계, Lock Holder/Waiter Tree) 쿼리 타임아웃(초).
# 사용자 실측: 일부 인스턴스에서 enqueue 해시체인이 길어 v$lock 스캔 자체가 49초까지 걸릴 수 있어,
# 위 read-timeout-ms보다 훨씬 짧게 잡아 느리면 빨리 실패시키고 다음 폴링에서 재시도한다.
dbagent.monitor.lock-query-timeout-seconds=3
# Hard ceiling (seconds) on GET /api/fleet_status's per-instance status check. Bounds cases the
# connect-timeout above doesn't cover (e.g. DNS resolution hanging before the socket connect even
# starts) so one slow/unreachable instance can't hold up the rest of the Fleet Overview screen -
# past this it just reports "down" for that instance instead of waiting longer.
dbagent.fleet-status.timeout-seconds=5

# ── RDB(MySQL / MariaDB / PostgreSQL / MS SQL Server / CUBRID) 커넥션 풀 ──
# com.dbagent.rdb.RdbConnectionPoolManager 전용 설정. Oracle 경로(com.dbagent.oracle)와 완전히
# 분리된 별도 풀이라 위 dbagent.oracle.* 값의 영향을 받지 않는다. 두 계열을 따로 튜닝할 수 있도록
# 일부러 나눠 둔 것이므로, Oracle 쪽 값을 바꿀 때 이쪽도 같이 봐야 하는지 매번 확인할 것.
# 새 RDB 커넥션을 수립하는 최대 시간(ms).
dbagent.rdb.connect-timeout-ms=2000
# 이미 연결된 커넥션에서 쿼리가 블로킹될 수 있는 최대 시간(ms). Oracle의 read-timeout과 같은 목적이다.
# 이 값이 없으면 응답 없는 서버 하나가 호출 스레드와 점유 중인 커넥션을 영구히 붙잡는다 - 풀 크기
# 기본값이 5라, 같은 인스턴스에 이런 hang이 5번만 발생하면 DB가 복구된 뒤에도 그 인스턴스의 풀이
# 영구 고갈된다(멈춘 커넥션이 반납되지 않으므로).
dbagent.rdb.read-timeout-ms=60000
# HikariCP 풀 크기 기본값. databases.json의 해당 인스턴스가 pool_min_idle / pool_max_size를
# 지정한 경우 그 값이 항상 우선한다(Oracle 풀과 동일한 규칙).
dbagent.rdb.pool.min-idle=1
dbagent.rdb.pool.max-size=5

# Dashboard auto-refresh interval (ms), read once by app.js from GET /api/config on page load.
# 1000ms proved too tight - concurrent polling across widgets/tabs could exhaust the connection pool
# and misreport a healthy DB as down. 2000-5000 is a safer default.
dbagent.ui.polling-interval-ms=2000

# Fleet Overview auto-refresh interval (ms), read once by fleet-overview.html on page
# load. Only runs while the tab is actually visible (Page Visibility API) - backgrounded tabs stop
# polling entirely instead of wasting fleet_status calls nobody's looking at.
dbagent.fleet-overview.polling-interval-ms=3000

# AI DBA (RAG-lite: regex + H2 retrieval, Ollama generation). H2 file base path (no extension -
# ErrorSearchService resolves the actual data/oracle_errors.mv.db file from this).
aidba.errors-db-path=data/oracle_errors
# GPU 서버 방화벽이 REST API 포트(9300, sqlrestapi)만 열어주는 구성으로 확정되면서(2026-09-11)
# Ollama(11434)에는 AIX에서 더 이상 직접 못 붙는다 - sqlrestapi가 그 앞단 프록시 역할을 한다.
# 모델명은 sqlrestapi 쪽(sqltune.llm.model) 설정을 따르므로 여기엔 없다.
# 사용자 결정(2026-09-14): AI 챗봇/AI Current SQL 분석/AI SQL 작성기(OllamaChatService)와 AI SQL
# 성능분석(SqlTuneAdvisorService)이 결국 같은 GPU 서버의 같은 sqlrestapi를 가리키므로, 프로퍼티가
# aidba.ollama.url/sqltuneadvisor.api.url 둘로 나뉘어 있던 걸 이 프로퍼티 하나로 통합했다(non-AIX
# DBAgent-Java와 동일). 스킴(http(s)://)이 없으면 두 서비스 모두 normalizeUrl()에서 http://를
# 자동으로 붙이므로 "GPU서버IP:9300"처럼 스킴 없이 입력해도 된다.
aidba.restapi.url=http://localhost:9300
# 응답 대기 시간(ms). 원격 GPU 서버는 로컬보다 네트워크 왕복 + 모델 로딩 시간이 더 걸릴 수 있어 넉넉하게 설정.
# (AI SQL 성능분석 쪽 타임아웃은 sqltuneadvisor.api.timeout-ms로 계속 별도)
aidba.ollama.timeout-ms=30000

# SQL 정합성/튜닝 (자체 파인튜닝 Qwen2.5-Coder-7B QLoRA 어댑터를 서빙하는 FastAPI 서버 호출).
# SqlTuningService도 순수 HTTP(JSON) 호출이라 서버가 어디서 도는지는 무관하다. 위 aidba.ollama.url과
# 같은 이유로 AIX엔 이 모델 서버를 직접 못 올리므로, 사내망에서 접근 가능한 GPU 서버 주소로 바꿔서
# 사용할 것 (예: http://192.168.x.x:8010). 기본값이 localhost라 설정을 빠뜨리면 조용히 실패한다.
sqltuning.api.url=http://localhost:8010
# 튜닝 모델 서버의 응답을 기다리는 최대 시간(ms). 프롬프트 길이와 GPU 서버 성능에 따라 응답
# 시간 편차가 커서 설정으로 분리했다(과거에는 180초 하드코딩). 원격 GPU 서버로 옮기거나 더 큰
# 모델로 바꾸면 재조정이 필요할 수 있다.
sqltuning.api.timeout-ms=180000

# SQL Tune Advisor (사내 튜닝 사례 RAG 검색 + LLM 분석, sqltune-rag-java/RAGController 호출).
# sqltuning.* (자체 파인튜닝 sLLM)과는 별개의 서버/연동이다 - 이쪽은 bge-m3 임베딩으로 사내 튜닝
# 사례를 OpenSearch에서 검색한 뒤 그 사례를 근거로 qwen3-coder:30b가 답변한다.
# 서버 주소는 위 aidba.restapi.url과 통합됨(2026-09-14) - 같은 GPU 서버의 같은 sqlrestapi라 별도
# 프로퍼티를 둘 이유가 없었다.
# 응답 대기 시간(ms)만 화면 성격이 달라 별도 유지 - GPU 서버 성능과 검색된 사내 사례 분량에 따라
# 편차가 커서 sqltuning.* 과 동일하게 설정으로 뺐다.
sqltuneadvisor.api.timeout-ms=180000

# SQL Runner (AI DBA 탭 위 "SQL 실행" - 기존 HikariCP 풀을 재사용해 임의 SQL 1문장을 실행).
# 브라우저 결과 그리드가 너무 커지거나 쿼리가 오래 걸리는 것을 막기 위한 상한값.
# max-rows는 사용자가 요청 시 건수를 지정하지 않았을 때 쓰는 기본값이고,
# max-rows-limit은 사용자가 지정하더라도 절대 넘을 수 없는 상한선입니다.
dbagent.sql-runner.max-rows=500
dbagent.sql-runner.max-rows-limit=5000
dbagent.sql-runner.timeout-seconds=30
