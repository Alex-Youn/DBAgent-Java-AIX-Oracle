server.port=8005

# App users DB (auth) - equivalent of Python's users.db
spring.datasource.url=jdbc:sqlite:users.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite does not handle concurrent writers well; mirror Python's single-connection-per-call behavior.
spring.datasource.hikari.maximum-pool-size=1

# Multi-instance Oracle target config, relative to the app's working directory (see databases.json, oracle.env)
dbagent.databases-config=databases.json
dbagent.oracle-env-path=oracle.env
# Directory containing tnsnames.ora, used when an instance's "host" is blank (SID/alias-based lookup, incl. RAC).
# Left blank on purpose: TnsAdminInitializer derives {ORACLE_HOME}\network\admin from oracle.env's
# ORACLE_HOME line when this isn't set, so moving networks only requires editing oracle.env (same as
# the Python app), not this file or a rebuild. Set this explicitly only if tnsnames.ora lives somewhere
# ORACLE_HOME doesn't point to.
dbagent.oracle.tns-admin=
# Max time to establish a new Oracle connection before giving up (ms). 500ms worked against a
# localhost DB on the dev machine, but real network latency (esp. the first connection, which also
# pays JDBC driver classloading cost) can easily exceed that and cause false "down" failures. 3000ms
# is a safer default for real networks; override via an external application.properties placed next
# to the jar (same directory) if the real observed latency needs a different value - no rebuild needed.
dbagent.oracle.connect-timeout-ms=3000
# HikariCP pool size defaults, used for any databases.json instance that doesn't set its own
# pool_min_idle/pool_max_size. Per-instance values in databases.json always take priority over these.
dbagent.oracle.pool.min-idle=2
dbagent.oracle.pool.max-size=10

# Dashboard auto-refresh interval (ms), read once by app.js from GET /api/config on page load.
# 1000ms proved too tight - concurrent polling across widgets/tabs could exhaust the connection pool
# and misreport a healthy DB as down. 2000-5000 is a safer default.
dbagent.ui.polling-interval-ms=2000

# AI DBA (RAG-lite: regex + SQLite retrieval, Ollama generation)
aidba.errors-db-path=data/oracle_errors.db
aidba.ollama.url=http://localhost:11434
aidba.ollama.model=qwen2.5:3b

# SQL Runner (AI DBA 탭 위 "SQL 실행" - 기존 HikariCP 풀을 재사용해 임의 SQL 1문장을 실행).
# 브라우저 결과 그리드가 너무 커지거나 쿼리가 오래 걸리는 것을 막기 위한 상한값.
# max-rows는 사용자가 요청 시 건수를 지정하지 않았을 때 쓰는 기본값이고,
# max-rows-limit은 사용자가 지정하더라도 절대 넘을 수 없는 상한선입니다.
dbagent.sql-runner.max-rows=500
dbagent.sql-runner.max-rows-limit=5000
dbagent.sql-runner.timeout-seconds=30
