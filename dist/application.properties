# 이 파일은 jar 안의 기본값을 재빌드 없이 덮어쓰는 외부 설정입니다.
# jar와 같은 폴더(이 폴더)에 있으면 Spring Boot가 자동으로 읽어서 적용합니다.

# 오라클 접속(커넥션 풀 생성) 시도 후 실패로 판단하기까지 기다리는 최대 시간(ms).
# 값이 너무 작으면: 실제로는 살아있는 DB인데 네트워크 지연 때문에 "접속 안됨"으로 오판하고,
#                   10초 쿨다운에 걸려서 몇 번 다시 클릭해야 겨우 붙는 증상이 생깁니다.
# 값이 너무 크면: 진짜 죽은 DB를 감지하는 데 오래 걸립니다.
# 폐쇄망 실제 네트워크 지연을 보면서 이 숫자만 조정하시면 됩니다 (기본 3000 = 3초, 최소 250).
dbagent.oracle.connect-timeout-ms=3000

# 커넥션 풀(HikariCP) 크기 기본값. databases.json의 개별 인스턴스에 pool_min_idle/pool_max_size
# 필드가 있으면 그 값이 우선 적용되고, 없는 인스턴스만 아래 기본값을 사용합니다.
dbagent.oracle.pool.min-idle=2
dbagent.oracle.pool.max-size=10
server.port=8006

# 대시보드 자동 새로고침 주기(ms). app.js가 페이지 로드 시 GET /api/config로 한 번 읽어감.
dbagent.ui.polling-interval-ms=2000