호# 이 파일은 jar 안의 기본값을 재빌드 없이 덮어쓰는 외부 설정입니다 (dist\application.properties와 동일한 용도).
# jar와 같은 폴더(이 폴더)에 있으면 Spring Boot가 자동으로 읽어서 적용합니다.
# 이 dev 폴더는 로컬(localhost) DB로 테스트하는 용도라 기본값(3000ms)이면 충분하지만,
# 타임아웃 값을 실험해보고 싶을 때 여기서 바로 바꿀 수 있습니다.
# Docker Oracle 컨테이너용 tnsnames.ora 위치. 미지정 시 oracle.env의 ORACLE_HOME\network\admin 이
# 대신 쓰이는데(TnsAdminInitializer 참고), 거기엔 ORCL/ORCL2 alias가 없어 접속이 실패했었음.
# 참고: OS 환경변수 TNS_ADMIN은 Oracle Thin JDBC 드라이버가 읽지 않으므로 여기서 직접 지정해야 함.
# 아래 파라미터 설정되어 있지 않으면  oracle.env 에 설정되어 있는 ORACLE_HOME\network\admin\tnsnames.ora  사용
dbagent.oracle.tns-admin=C:/Oracle/docker/network/Admin

dbagent.oracle.connect-timeout-ms=5000

# 커넥션 풀(HikariCP) 크기 기본값. databases.json의 인스턴스에 pool_min_idle/pool_max_size가
# 있으면 그 값이 우선 적용되고, 없는 인스턴스만 아래 기본값을 사용합니다.
dbagent.oracle.pool.min-idle=2
dbagent.oracle.pool.max-size=10
server.port=8006

# 대시보드 자동 새로고침 주기(ms). app.js가 페이지 로드 시 GET /api/config로 한 번 읽어감.
dbagent.ui.polling-interval-ms=2000
